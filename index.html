<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shadow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   СБРОС СТИЛЕЙ
   ============================================ */
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    height: 100%;
    overflow: hidden;
}

body {
    height: 100dvh;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
    position: fixed;
    width: 100%;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
}

input,
textarea {
    font-family: inherit;
    outline: none;
    border: none;
}

video,
img {
    display: block;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: #0a0a0a;
}

::-webkit-scrollbar-thumb {
    background: #27272a;
    border-radius: 3px;
}

/* ============================================
   ПЕРЕМЕННЫЕ
   ============================================ */
:root {
    --primary: #a855f7;
    --primary-dark: #7c3aed;
    --primary-light: #c084fc;
    --text-sec: #a1a1aa;
    --text-muted: #52525b;
    --border: #27272a;
    --bg-card: #0a0a0a;
    --bg-card-alt: #121212;
    --bg-input: #1a1a1a;
    --error: #ef4444;
    --success: #22c55e;
    --premium: #fbbf24;
    --premium-dark: #f59e0b;
    --nav-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}

/* ============================================
   ПРИЛОЖЕНИЕ И ЭКРАНЫ
   ============================================ */
#app {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
}

.screen.active {
    display: flex;
    opacity: 1;
}

/* ============================================
   КНОПКИ
   ============================================ */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.15s ease;
    min-height: 48px;
    user-select: none;
}

.btn:active {
    transform: scale(0.96);
}

.btn:disabled {
    opacity: 0.5;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
}

.btn-premium {
    background: linear-gradient(135deg, var(--premium), var(--premium-dark));
    color: #000;
    font-weight: 700;
}

.btn-telegram {
    background: linear-gradient(135deg, #2AABEE, #1E96D1);
    color: #fff;
    font-weight: 700;
}

.btn-secondary {
    background: var(--bg-card-alt);
    color: #fff;
    border: 1px solid var(--border);
}

.btn-ghost {
    background: transparent;
    color: var(--text-sec);
}

.btn-danger {
    background: rgba(239, 68, 68, 0.12);
    color: var(--error);
    border: 1px solid rgba(239, 68, 68, 0.3);
}

.btn-small {
    padding: 8px 14px;
    font-size: 13px;
    min-height: 36px;
}

.btn-block {
    width: 100%;
    max-width: 320px;
}

/* ============================================
   ФОРМЫ
   ============================================ */
.form-group {
    width: 100%;
    max-width: 360px;
    margin-bottom: 18px;
    text-align: left;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-sec);
    font-weight: 500;
}

.form-input,
.form-textarea {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    transition: border-color 0.2s;
}

.form-input:focus,
.form-textarea:focus {
    border-color: var(--primary);
}

.form-textarea {
    resize: none;
    min-height: 80px;
}

/* ============================================
   АВАТАРЫ
   ============================================ */
.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    border: 2px solid var(--border);
    overflow: hidden;
    position: relative;
}

.avatar.small {
    width: 32px;
    height: 32px;
    font-size: 13px;
}

.avatar.big {
    width: 44px;
    height: 44px;
    font-size: 16px;
    cursor: pointer;
}

.avatar.xxl {
    width: 110px;
    height: 110px;
    font-size: 42px;
}

.avatar.premium {
    background: linear-gradient(135deg, var(--premium), var(--premium-dark));
    color: #000;
    border-color: var(--premium);
}

.avatar.regular {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
}

.avatar.banned {
    background: #333;
    color: #666;
    border-color: var(--error);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar.has-story {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary);
}

.avatar.has-story.premium {
    border-color: var(--premium);
    box-shadow: 0 0 0 2px var(--premium);
}

/* ============================================
   STORIES BAR
   ============================================ */
.stories-bar {
    display: flex;
    gap: 8px;
    padding: 6px 4px;
    overflow-x: auto;
    scrollbar-width: none;
    background: #000;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.stories-bar::-webkit-scrollbar {
    display: none;
}

.story-avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    flex-shrink: 0;
}

.story-avatar-wrap .avatar {
    width: 50px;
    height: 50px;
    font-size: 18px;
}

.story-avatar-name {
    font-size: 9px;
    color: var(--text-sec);
    max-width: 52px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
}

.story-add-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--text-sec);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
}

.story-add-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

/* ============================================
   STORY VIEWER
   ============================================ */
.story-viewer {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #000;
    display: none;
    flex-direction: column;
}

.story-viewer.active {
    display: flex;
}

.story-progress-bar {
    display: flex;
    gap: 3px;
    padding: 8px 6px 0;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
}

.story-progress-segment {
    flex: 1;
    height: 3px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    overflow: hidden;
}

.story-progress-fill {
    height: 100%;
    background: #fff;
    width: 0%;
    transition: width 0.1s linear;
}

.story-progress-segment.done .story-progress-fill {
    width: 100%;
}

.story-progress-segment.active .story-progress-fill {
    width: 0%;
    animation: storyProgress linear forwards;
}

@keyframes storyProgress {
    from {
        width: 0%;
    }
    to {
        width: 100%;
    }
}

.story-header {
    position: absolute;
    top: 20px;
    left: 6px;
    right: 44px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
}

.story-header .avatar {
    width: 30px;
    height: 30px;
    font-size: 12px;
}

.story-header-name {
    font-weight: 700;
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

.story-header-time {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
}

.story-close {
    position: absolute;
    top: 18px;
    right: 6px;
    z-index: 10;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
}

.story-close svg {
    width: 16px;
    height: 16px;
    fill: #fff;
}

.story-content {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.story-content img,
.story-content video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.story-nav-zone {
    position: absolute;
    top: 60px;
    bottom: 60px;
    width: 30%;
    z-index: 8;
}

.story-nav-left {
    left: 0;
}

.story-nav-right {
    right: 0;
}

/* ============================================
   STORY UPLOAD
   ============================================ */
.story-upload-slides {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 0;
    scrollbar-width: none;
}

.story-upload-slides::-webkit-scrollbar {
    display: none;
}

.story-slide-preview {
    width: 80px;
    height: 120px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    border: 2px solid var(--border);
    background: var(--bg-card-alt);
}

.story-slide-preview img,
.story-slide-preview video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.story-slide-remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
}

.story-slide-add {
    width: 80px;
    height: 120px;
    border-radius: 8px;
    border: 2px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--text-sec);
    font-size: 12px;
    transition: all 0.2s;
}

.story-slide-add:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.story-slide-number {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ============================================
   ПОСТЫ (ГЛАВНАЯ)
   ============================================ */
.home-feed {
    flex: 1;
    overflow-y: auto;
    padding-bottom: calc(var(--nav-h) + var(--safe-b));
}

.post-card {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 14px;
}

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.post-author-name {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
}

.post-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
}

.post-text {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 10px;
    white-space: pre-wrap;
}

.post-image {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    max-height: 500px;
    object-fit: cover;
}

.post-actions {
    display: flex;
    gap: 20px;
    align-items: center;
}

.post-action {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text-sec);
    font-size: 14px;
    transition: color 0.15s;
}

.post-action:active {
    transform: scale(0.95);
}

.post-action.liked {
    color: var(--primary);
}

.post-action svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

/* ============================================
   ВИДЕО ЛЕНТА
   ============================================ */
.feed-container {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

.feed-container::-webkit-scrollbar {
    display: none;
}

.video-card {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: #000;
    overflow: hidden;
}

.video-element {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
}

.video-gradient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 35%);
}

.video-info {
    position: absolute;
    bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
    left: 14px;
    right: 76px;
    z-index: 5;
}

.video-author-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.video-author-name {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 4px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    cursor: pointer;
}

.video-desc {
    font-size: 14px;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    margin-bottom: 6px;
}

.video-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.video-tag {
    font-size: 13px;
    color: var(--primary-light);
    font-weight: 600;
}

.play-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 6;
}

.play-indicator svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.95);
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
}

.play-indicator.visible {
    opacity: 1;
}

.video-actions {
    position: absolute;
    right: 10px;
    bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.video-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.video-action-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
}

.video-action-btn:active {
    transform: scale(0.85);
}

.video-action-btn svg {
    width: 26px;
    height: 26px;
    fill: #fff;
}

.video-action.liked .video-action-btn svg {
    fill: var(--primary);
}

.video-action.saved .video-action-btn svg {
    fill: var(--premium);
}

.video-action-count {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

.avatar-follow-wrap {
    position: relative;
    margin-bottom: 6px;
}

.follow-plus {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid #000;
    transition: background 0.15s;
}

.follow-plus.followed {
    background: var(--success);
}

.video-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #121212, #000);
    gap: 12px;
}

/* ============================================
   НАВИГАЦИЯ
   ============================================ */
.bottom-nav-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--nav-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
}

.nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-muted);
    transition: color 0.2s;
}

.nav-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

.nav-btn span {
    font-size: 10px;
}

.nav-btn.active {
    color: var(--primary);
}

.upload-nav-btn {
    width: 44px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(168, 85, 247, 0.4);
}

.upload-nav-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
}

/* ============================================
   ПРОФИЛЬ
   ============================================ */
.profile-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
}

.profile-header {
    text-align: center;
    margin-bottom: 20px;
}

.profile-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
}

.profile-name {
    font-size: 21px;
    font-weight: 800;
}

.profile-username {
    color: var(--text-sec);
    font-size: 14px;
    margin-top: 4px;
}

.profile-bio {
    color: var(--text-sec);
    font-size: 14px;
    margin-top: 10px;
    max-width: 300px;
}

.profile-stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.stat-val {
    font-size: 20px;
    font-weight: 800;
}

.stat-label {
    font-size: 12px;
    color: var(--text-sec);
}

.profile-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin: 20px 0 16px;
}

.profile-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sec);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    cursor: pointer;
}

.profile-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.videos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    width: 100%;
}

.grid-video {
    aspect-ratio: 9 / 16;
    background: var(--bg-card-alt);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.grid-video video,
.grid-video img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.grid-video-views {
    position: absolute;
    bottom: 6px;
    left: 6px;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

.grid-video-menu-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    z-index: 3;
}

.promo-tab-content {
    padding: 10px 0;
}

.promo-status {
    background: var(--bg-card-alt);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    margin-bottom: 16px;
}

/* ============================================
   МОДАЛКИ
   ============================================ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
    backdrop-filter: blur(3px);
}

.modal {
    background: var(--bg-card);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px 20px calc(20px + var(--safe-b));
    animation: slideUp 0.3s ease;
    border-top: 1px solid var(--border);
}

@media (min-width: 768px) {
    .modal-overlay {
        align-items: center;
    }
    .modal {
        max-width: 520px;
        border-radius: 20px;
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
}

.modal-close {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-input);
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-close svg {
    width: 18px;
    height: 18px;
    fill: var(--text-sec);
}

/* ============================================
   ЗАГРУЗКА
   ============================================ */
.upload-dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    transition: all 0.2s;
    margin-bottom: 18px;
    cursor: pointer;
}

.upload-dropzone.has-video {
    border-color: var(--success);
    background: rgba(34, 197, 94, 0.05);
}

.upload-dropzone-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.upload-preview-video,
.upload-preview-img {
    width: 100%;
    max-height: 280px;
    border-radius: 10px;
    background: #000;
    object-fit: cover;
}

.upload-progress {
    width: 100%;
    height: 4px;
    background: var(--bg-input);
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0;
    display: none;
}

.upload-progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s;
}

.limit-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    margin-bottom: 16px;
}

.limit-badge.premium {
    border-color: var(--premium);
    background: rgba(251, 191, 36, 0.08);
    color: var(--premium);
}

/* ============================================
   КОММЕНТАРИИ
   ============================================ */
.comments-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 16px;
}

.comment-item {
    display: flex;
    gap: 10px;
}

.comment-body {
    flex: 1;
}

.comment-author {
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
}

.comment-time {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
}

.comment-text {
    font-size: 14px;
    line-height: 1.4;
    margin-top: 3px;
}

.comment-form {
    display: flex;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}

.comment-input {
    flex: 1;
    padding: 12px 16px;
    background: var(--bg-input);
    border-radius: 22px;
    color: #fff;
    font-size: 14px;
}

.comment-send {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.comment-send svg {
    width: 20px;
    height: 20px;
    fill: #fff;
}

/* ============================================
   ПРЕМИУМ
   ============================================ */
.premium-card {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(245, 158, 11, 0.04));
    border: 2px solid var(--premium);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
}

.premium-price {
    font-size: 34px;
    font-weight: 900;
    color: var(--premium);
    margin: 14px 0;
}

.premium-features {
    text-align: left;
    margin: 18px 0;
}

.premium-feature {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 14px;
}

.premium-badge-inline {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid var(--premium);
    color: var(--premium);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.telegram-box {
    background: rgba(42, 171, 238, 0.08);
    border: 1px solid rgba(42, 171, 238, 0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
}

/* ============================================
   TOAST
   ============================================ */
.toast {
    position: fixed;
    bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card-alt);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 600;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    animation: toastIn 0.3s ease;
    white-space: pre-line;
}

.toast.success {
    border-color: var(--success);
}

.toast.error {
    border-color: var(--error);
}

.toast.premium {
    border-color: var(--premium);
}

/* ============================================
   ПУСТЫЕ СОСТОЯНИЯ
   ============================================ */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    text-align: center;
}

.empty-icon {
    font-size: 56px;
    margin-bottom: 16px;
    opacity: 0.6;
}

.empty-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
}

.empty-text {
    font-size: 14px;
    color: var(--text-sec);
    max-width: 280px;
    line-height: 1.5;
}

.ban-icon {
    font-size: 80px;
    margin-bottom: 20px;
}

.ban-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--error);
    margin-bottom: 12px;
}

.spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

/* ============================================
   АДМИН
   ============================================ */
.admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--bg-card-alt);
    border-radius: 10px;
    margin-bottom: 8px;
    gap: 10px;
}

.admin-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-sec);
    margin: 16px 0 8px;
    text-transform: uppercase;
}

.promo-code-box {
    background: var(--bg-input);
    border: 1px dashed var(--primary);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: monospace;
    font-size: 16px;
    letter-spacing: 2px;
    text-align: center;
    margin: 10px 0;
}

.admin-tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: var(--bg-card-alt);
    border-radius: 10px;
    padding: 4px;
}

.admin-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sec);
    cursor: pointer;
    transition: all 0.2s;
}

.admin-tab.active {
    background: var(--primary);
    color: #fff;
}

/* ============================================
   ВЫБОР АВАТАРА
   ============================================ */
.avatar-picker {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 8px;
}

.avatar-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    overflow: hidden;
    flex-shrink: 0;
    border: 3px solid var(--border);
}

.avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
}

.avatar-option {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-input);
    border: 2px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-sec);
    transition: all 0.15s;
}

.avatar-option.selected {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
    transform: scale(1.05);
}

.avatar-option svg,
.avatar-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-option.photo-opt {
    font-size: 22px;
}

/* ============================================
   ПРИВЕТСТВИЕ
   ============================================ */
.welcome-title {
    font-size: clamp(52px, 13vw, 76px);
    font-weight: 900;
    background: linear-gradient(135deg, #a855f7, #c084fc, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: -2px;
}

.welcome-subtitle {
    color: var(--text-sec);
    font-size: 15px;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
}

.welcome-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    margin-top: 40px;
}

/* ============================================
   АНИМАЦИИ
   ============================================ */
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        transform: translateY(60px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes toastIn {
    from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes heartPop {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    15% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
    }
    30% {
        transform: translate(-50%, -50%) scale(0.95);
    }
    45%, 80% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0;
    }
}

.heart-pop {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 110px;
    height: 110px;
    pointer-events: none;
    z-index: 50;
    animation: heartPop 0.9s ease forwards;
}

.heart-pop svg {
    width: 100%;
    height: 100%;
    fill: var(--primary);
    filter: drop-shadow(0 4px 20px rgba(168, 85, 247, 0.8));
}
</style>

/* ============================================

var Utils = {
    toast: function(msg, type) {
        type = type || '';
        document.querySelectorAll('.toast').forEach(function(x) {
            x.remove();
        });
        var e = document.createElement('div');
        e.className = 'toast ' + type;
        e.textContent = msg;
        document.body.appendChild(e);
        setTimeout(function() {
            e.remove();
        }, 3200);
    },
    esc: function(t) {
        var d = document.createElement('div');
        d.textContent = t || '';
        return d.innerHTML;
    },
    timeAgo: function(ts) {
        if (!ts) return '';
        var m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
        if (m < 1) return 'только что';
        if (m < 60) return m + ' мин';
        var h = Math.floor(m / 60);
        if (h < 24) return h + ' ч';
        var d = Math.floor(h / 24);
        return d < 7 ? d + ' дн' : new Date(ts).toLocaleDateString('ru-RU');
    },
    genId: function() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    },
    fmtNum: function(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return String(n || 0);
    },
    genPromo: function() {
        var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var s = 'SHDW-';
        for (var i = 0; i < 6; i++) {
            s += c[Math.floor(Math.random() * c.length)];
        }
        return s;
    },
    hash: function(str) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(h) {
            return Array.from(new Uint8Array(h)).map(function(x) {
                return x.toString(16).padStart(2, '0');
            }).join('');
        });
    },
    compressImage: function(file, sz) {
        sz = sz || 400;
        return new Promise(function(res, rej) {
            var r = new FileReader();
            r.onload = function(e) {
                var i = new Image();
                i.onload = function() {
                    var c = document.createElement('canvas');
                    c.width = sz;
                    c.height = sz;
                    var ctx = c.getContext('2d');
                    var s = Math.min(i.width, i.height);
                    ctx.drawImage(i, (i.width - s) / 2, (i.height - s) / 2, s, s, 0, 0, sz, sz);
                    c.toBlob(function(b) {
                        res(b);
                    }, 'image/jpeg', 0.85);
                };
                i.onerror = rej;
                i.src = e.target.result;
            };
            r.onerror = rej;
            r.readAsDataURL(file);
        });
    },
    _pc: new Map(),
    getProfile: function(uid) {
        if (this._pc.has(uid)) return Promise.resolve(this._pc.get(uid));
        var self = this;
        return sb.from('profiles').select('*').eq('id', uid).single().then(function(r) {
            if (r.data) self._pc.set(uid, r.data);
            return r.data;
        }).catch(function() {
            return null;
        });
    },
    clearPC: function() {
        this._pc.clear();
    }
};
