<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Shadow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  height: 100%;
  overflow: hidden;
}

body {
  height: 100dvh;
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: manipulation;
  position: fixed;
  width: 100%;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

input, textarea {
  font-family: inherit;
  outline: none;
  border: none;
}

video, img {
  display: block;
  max-width: 100%;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a0a; }
::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }

:root {
  --primary: #a855f7;
  --primary-dark: #7c3aed;
  --primary-light: #c084fc;
  --text-sec: #a1a1aa;
  --text-muted: #52525b;
  --border: #27272a;
  --bg-card: #0a0a0a;
  --bg-card-alt: #121212;
  --bg-input: #1a1a1a;
  --error: #ef4444;
  --success: #22c55e;
  --premium: #fbbf24;
  --premium-dark: #f59e0b;
  --nav-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.screen.active {
  display: flex;
  opacity: 1;
}

.screen.no-pad {
  padding: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  transition: all 0.15s ease;
  min-height: 48px;
  user-select: none;
}

.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
}

.btn-premium {
  background: linear-gradient(135deg, var(--premium), var(--premium-dark));
  color: #000;
  font-weight: 700;
}

.btn-telegram {
  background: linear-gradient(135deg, #2AABEE, #1E96D1);
  color: #fff;
  font-weight: 700;
}

.btn-secondary {
  background: var(--bg-card-alt);
  color: #fff;
  border: 1px solid var(--border);
}

.btn-ghost {
  background: transparent;
  color: var(--text-sec);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.12);
  color: var(--error);
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.btn-small {
  padding: 8px 14px;
  font-size: 13px;
  min-height: 36px;
}

.btn-block {
  width: 100%;
  max-width: 320px;
}

.form-group {
  width: 100%;
  max-width: 360px;
  margin-bottom: 18px;
  text-align: left;
}

.form-label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: var(--text-sec);
  font-weight: 500;
}

.form-input, .form-textarea {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  transition: border-color 0.2s;
}

.form-input:focus, .form-textarea:focus {
  border-color: var(--primary);
}

.form-textarea {
  resize: none;
  min-height: 80px;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 48px;
}

.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  border: 2px solid var(--border);
  overflow: hidden;
}

.avatar.small { width: 32px; height: 32px; font-size: 13px; }
.avatar.big { width: 44px; height: 44px; font-size: 16px; cursor: pointer; }
.avatar.xxl { width: 110px; height: 110px; font-size: 42px; }

.avatar.premium {
  background: linear-gradient(135deg, var(--premium), var(--premium-dark));
  color: #000;
  border-color: var(--premium);
}

.avatar.regular {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
}

.avatar.banned {
  background: #333;
  color: #666;
  border-color: var(--error);
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-picker-simple {
  display: flex;
  gap: 16px;
  align-items: center;
}

.avatar-preview {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 800;
  overflow: hidden;
  flex-shrink: 0;
  border: 3px solid var(--border);
}

.avatar-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-upload-btn {
  flex: 1;
  padding: 16px;
  border: 2px dashed var(--border);
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-sec);
  font-size: 14px;
}

.avatar-upload-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.welcome-title {
  font-size: clamp(52px, 13vw, 76px);
  font-weight: 900;
  background: linear-gradient(135deg, #a855f7, #c084fc, #7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
  letter-spacing: -2px;
}

.welcome-subtitle {
  color: var(--text-sec);
  font-size: 15px;
  text-align: center;
  max-width: 300px;
  line-height: 1.5;
}

.welcome-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin-top: 40px;
}

.main-scroll {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding-bottom: calc(var(--nav-h) + var(--safe-b) + 10px);
}

.main-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(12px);
  padding: 10px 14px calc(10px + var(--safe-t));
  border-bottom: 1px solid var(--border);
}

.search-bar {
  position: relative;
}

.search-bar input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: #fff;
  font-size: 14px;
}

.search-bar svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  fill: var(--text-muted);
}

.search-results-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 0 0 12px 12px;
  max-height: 300px;
  overflow-y: auto;
  z-index: 20;
  display: none;
}

.search-results-dropdown.active {
  display: block;
}

.search-result-item {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
}

.search-result-item:hover {
  background: var(--bg-card-alt);
}

.stories-row {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}

.stories-row::-webkit-scrollbar {
  display: none;
}

.story-circle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  cursor: pointer;
  width: 68px;
}

.story-ring {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--premium), var(--primary), var(--primary-dark));
}

.story-ring.no-story {
  background: var(--border);
  padding: 2px;
}

.story-ring .avatar {
  width: 100%;
  height: 100%;
  border: 2px solid #000;
}

.story-name {
  font-size: 11px;
  color: var(--text-sec);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 68px;
  text-align: center;
}

.story-viewer {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 300;
  display: none;
  flex-direction: column;
}

.story-viewer.active {
  display: flex;
}

.story-viewer-media {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.story-viewer-media img,
.story-viewer-media video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.story-progress {
  position: absolute;
  top: calc(var(--safe-t) + 4px);
  left: 14px;
  right: 14px;
  height: 3px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 2px;
  z-index: 10;
}

.story-progress-bar {
  height: 100%;
  background: #fff;
  border-radius: 2px;
  transition: width 0.1s linear;
}

.story-close {
  position: absolute;
  top: calc(var(--safe-t) + 10px);
  right: 14px;
  z-index: 11;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
}

.story-close svg {
  width: 20px;
  height: 20px;
  fill: #fff;
}

.story-header {
  position: absolute;
  top: calc(var(--safe-t) + 14px);
  left: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
}

.post-card {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
}

.post-image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: var(--bg-card-alt);
}

.post-caption {
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.5;
}

.post-caption b {
  font-weight: 700;
}

.post-comments-link {
  padding: 4px 14px 12px;
  font-size: 13px;
  color: var(--text-sec);
  cursor: pointer;
}

.post-reactions {
  display: flex;
  gap: 6px;
  padding: 4px 14px 12px;
  flex-wrap: wrap;
}

.reaction-btn {
  padding: 4px 10px;
  border-radius: 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  font-size: 16px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.reaction-btn:active {
  transform: scale(0.9);
}

.reaction-btn.active {
  background: rgba(168, 85, 247, 0.2);
  border-color: var(--primary);
}

.reaction-count {
  font-size: 12px;
  color: var(--text-sec);
}

.add-reaction-btn {
  padding: 4px 10px;
  border-radius: 16px;
  background: var(--bg-input);
  border: 1px dashed var(--border);
  font-size: 14px;
  cursor: pointer;
  color: var(--text-muted);
}

.reaction-picker {
  display: flex;
  gap: 8px;
  padding: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.reaction-pick {
  font-size: 28px;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  transition: background 0.15s;
}

.reaction-pick:hover {
  background: var(--bg-card-alt);
}

.feed-container {
  width: 100%;
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

.feed-container::-webkit-scrollbar {
  display: none;
}

.video-card {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  background: #000;
  overflow: hidden;
}

.video-element {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.video-gradient {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 35%);
}

.video-info {
  position: absolute;
  bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  left: 14px;
  right: 76px;
  z-index: 5;
}

.video-author-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.video-author-name {
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 4px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  cursor: pointer;
}

.video-desc {
  font-size: 14px;
  line-height: 1.4;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  margin-bottom: 6px;
}

.video-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.video-tag {
  font-size: 13px;
  color: var(--primary-light);
  font-weight: 600;
}

.play-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 84px;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 6;
}

.play-indicator svg {
  width: 100%;
  height: 100%;
  fill: rgba(255, 255, 255, 0.95);
  filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
}

.play-indicator.visible {
  opacity: 1;
}

.video-actions {
  position: absolute;
  right: 10px;
  bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.video-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.video-action-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  transition: transform 0.15s;
}

.video-action-btn:active {
  transform: scale(0.85);
}

.video-action-btn svg {
  width: 26px;
  height: 26px;
  fill: #fff;
}

.video-action.liked .video-action-btn svg {
  fill: var(--primary);
}

.video-action.saved .video-action-btn svg {
  fill: var(--premium);
}

.video-action-count {
  font-size: 12px;
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

.avatar-follow-wrap {
  position: relative;
  margin-bottom: 6px;
}

.follow-plus {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  border: 2px solid #000;
}

.follow-plus.followed {
  background: var(--success);
}

.video-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #121212, #000);
  gap: 12px;
}

#bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-muted);
  transition: color 0.2s;
}

.nav-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.nav-btn span {
  font-size: 10px;
}

.nav-btn.active {
  color: var(--primary);
}

.upload-nav-btn {
  width: 44px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 12px rgba(168, 85, 247, 0.4);
}

.upload-nav-btn svg {
  width: 22px;
  height: 22px;
  fill: #fff;
}

.profile-header {
  text-align: center;
  margin-bottom: 20px;
}

.profile-name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
}

.profile-name {
  font-size: 21px;
  font-weight: 800;
}

.profile-username {
  color: var(--text-sec);
  font-size: 14px;
  margin-top: 4px;
}

.profile-bio {
  color: var(--text-sec);
  font-size: 14px;
  margin-top: 10px;
  max-width: 300px;
}

.profile-stats {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 18px;
  flex-wrap: wrap;
}

.stat-val {
  font-size: 20px;
  font-weight: 800;
}

.stat-label {
  font-size: 12px;
  color: var(--text-sec);
}

.back-to-feed-btn {
  position: fixed;
  top: calc(var(--safe-t) + 10px);
  left: 14px;
  z-index: 50;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
}

.back-to-feed-btn svg {
  width: 24px;
  height: 24px;
  fill: #fff;
}

.profile-tabs {
  display: flex;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  margin: 20px 0 16px;
  padding: 0 8px;
}

.profile-tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-sec);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  cursor: pointer;
}

.profile-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.videos-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  width: 100%;
}

.grid-video {
  aspect-ratio: 9/16;
  background: var(--bg-card-alt);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

.grid-video video,
.grid-video img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-video-views {
  position: absolute;
  bottom: 6px;
  left: 6px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 3px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

.grid-video-menu-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  z-index: 3;
}

.promo-tab-content {
  padding: 10px 0;
}

.promo-status {
  background: var(--bg-card-alt);
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  margin-bottom: 16px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);

/* ============================================
   УТИЛИТЫ
   ============================================ */
var Utils = {
  toast: function(m, t) {
    t = t || '';
    document.querySelectorAll('.toast').forEach(function(x) { x.remove(); });
    var e = document.createElement('div');
    e.className = 'toast ' + t;
    e.textContent = m;
    document.body.appendChild(e);
    setTimeout(function() { e.remove(); }, 3200);
  },

  esc: function(t) {
    var d = document.createElement('div');
    d.textContent = t || '';
    return d.innerHTML;
  },

  timeAgo: function(ts) {
    if (!ts) return '';
    var m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
    if (m < 1) return 'только что';
    if (m < 60) return m + ' мин';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' ч';
    return Math.floor(h / 24) + ' дн';
  },

  fmtNum: function(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n || 0);
  },

  hash: async function(s) {
    var b = new TextEncoder().encode(s);
    var h = await crypto.subtle.digest('SHA-256', b);
    return Array.from(new Uint8Array(h)).map(function(x) {
      return x.toString(16).padStart(2, '0');
    }).join('');
  },

  compressImage: function(file, max) {
    max = max || 400;
    return new Promise(function(res, rej) {
      var r = new FileReader();
      r.onload = function(e) {
        var i = new Image();
        i.onload = function() {
          var c = document.createElement('canvas');
          c.width = max;
          c.height = max;
          var ctx = c.getContext('2d');
          var s = Math.min(i.width, i.height);
          ctx.drawImage(i, (i.width - s) / 2, (i.height - s) / 2, s, s, 0, 0, max, max);
          c.toBlob(function(b) { res(b); }, 'image/jpeg', 0.85);
        };
        i.onerror = rej;
        i.src = e.target.result;
      };
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  },

  togglePw: function(id, btn) {
    var inp = document.getElementById(id);
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.textContent = '🙈';
    } else {
      inp.type = 'password';
      btn.textContent = '👁';
    }
  }
};

var DB = {
  createUser: async function(p) {
    if (!sb) return { ok: false, error: 'Нет соединения' };
    var ph = await Utils.hash(p.password);
    var au = '';
    if (p.avatar_type === 'photo' && p.avatar_blob) {
      var fn = Date.now() + '.jpg';
      var up = await sb.storage.from('avatars').upload(fn, p.avatar_blob, { contentType: 'image/jpeg' });
      if (up.error) return { ok: false, error: 'Ошибка фото' };
      var ud = sb.storage.from('avatars').getPublicUrl(fn);
      au = ud.data.publicUrl;
    }
    var res = await sb.from('profiles').insert({
      username: p.username,
      password_hash: ph,
      display_name: p.display_name,
      bio: p.bio || '',
      avatar_type: p.avatar_type || 'default',
      avatar_index: 0,
      avatar_url: au
    }).select().single();
    if (res.error) {
      if (res.error.code === '23505') return { ok: false, error: 'Имя занято' };
      return { ok: false, error: res.error.message };
    }
    return { ok: true, user: res.data };
  },

  findUser: async function(username, password) {
    if (!sb) return { ok: false, error: 'Нет соединения' };
    var ph = await Utils.hash(password);
    var res = await sb.from('profiles').select('*')
      .eq('username', username)
      .eq('password_hash', ph)
      .single();
    if (res.error || !res.data) return { ok: false, error: 'Неверное имя или пароль' };
    return { ok: true, user: res.data };
  },

  getUserById: async function(id) {
    if (!sb || !id) return null;
    var res = await sb.from('profiles').select('*').eq('id', id).single();
    return res.data;
  },

  updateUser: async function(id, u) {
    if (!sb) return;
    await sb.from('profiles').update(u).eq('id', id);
  },

  getFeed: async function(uid) {
    if (!sb) return [];
    var v = await sb.from('videos')
      .select('*,profiles!inner(id,username,display_name,avatar_type,avatar_index,avatar_url,premium_until,banned)')
      .eq('profiles.banned', false)
      .order('created_at', { ascending: false })
      .limit(50);
    var r = [];
    for (var i = 0; i < (v.data || []).length; i++) {
      var x = v.data[i];
      var lc = await sb.from('likes').select('*', { count: 'exact', head: true }).eq('video_id', x.id);
      var cc = await sb.from('comments').select('*', { count: 'exact', head: true }).eq('video_id', x.id);
      var lm = false;
      var sm = false;
      if (uid) {
        var la = await sb.from('likes').select('id').eq('video_id', x.id).eq('user_id', uid).maybeSingle();
        var sa = await sb.from('saves').select('id').eq('video_id', x.id).eq('user_id', uid).maybeSingle();
        lm = !!la.data;
        sm = !!sa.data;
      }
      r.push({
        id: x.id,
        user_id: x.user_id,
        author: x.profiles,
        title: x.title,
        description: x.description,
        video_url: x.video_url,
        thumbnail_url: x.thumbnail_url,
        duration: x.duration,
        tags: x.tags || [],
        views: x.views || 0,
        likes: lc.count || 0,
        comment_count: cc.count || 0,
        liked_by_me: lm,
        saved_by_me: sm,
        created_at: x.created_at
      });
    }
    return r;
  },

  getUserVideos: async function(uid) {
    if (!sb) return [];
    var v = await sb.from('videos').select('*').eq('user_id', uid).order('created_at', { ascending: false });
    var r = [];
    for (var i = 0; i < (v.data || []).length; i++) {
      var x = v.data[i];
      var lc = await sb.from('likes').select('*', { count: 'exact', head: true }).eq('video_id', x.id);
      var obj = {};
      for (var k in x) obj[k] = x[k];
      obj.likes = lc.count || 0;
      r.push(obj);

    return r;
  },

  uploadVideo: async function(p) {
    if (!sb) return { ok: false, error: 'Нет соединения' };
    var vid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var vn = vid + '.mp4';
    var tn = vid + '.jpg';
    var ve = await sb.storage.from('videos').upload(vn, p.videoBlob, { contentType: p.videoBlob.type || 'video/mp4' });
    if (ve.error) return { ok: false, error: 'Ошибка загрузки видео' };
    var vu = sb.storage.from('videos').getPublicUrl(vn);
    var tu = '';
    if (p.thumbBlob) {
      await sb.storage.from('thumbnails').upload(tn, p.thumbBlob, { contentType: 'image/jpeg' });
      var td = sb.storage.from('thumbnails').getPublicUrl(tn);
      tu = td.data.publicUrl;
    }
    var me = await sb.from('videos').insert({
      user_id: p.userId,
      username: p.username,
      title: p.title,
      description: p.description,
      tags: p.tags,
      duration: p.duration,
      video_url: vu.data.publicUrl,
      thumbnail_url: tu
    });
    if (me.error) return { ok: false, error: 'Ошибка сохранения' };
    await sb.from('uploads').upsert({ user_id: p.userId, uploaded_at: new Date().toISOString() });
    return { ok: true };
  },

  deleteVideo: async function(videoId) {
    if (!sb) return;
    var v = await sb.from('videos').select('video_url,thumbnail_url').eq('id', videoId).single();
    if (v.data) {
      if (v.data.video_url) {
        var n = v.data.video_url.split('/').pop();
        await sb.storage.from('videos').remove([n]);
      }
      if (v.data.thumbnail_url) {
        var n2 = v.data.thumbnail_url.split('/').pop();
        await sb.storage.from('thumbnails').remove([n2]);
      }
    }
    await sb.from('videos').delete().eq('id', videoId);
  },

  toggleLike: async function(vid, uid) {

    var e = await sb.from('likes').select('id').eq('video_id', vid).eq('user_id', uid).maybeSingle();
    if (e.data) {
      await sb.from('likes').delete().eq('id', e.data.id);
      return { liked: false };
    }
    await sb.from('likes').insert({ video_id: vid, user_id: uid });
    return { liked: true };

  toggleSave: async function(vid, uid) {

  getComments: async function(vid) {

      .select('*,profiles(id,display_name,avatar_type,avatar_index,avatar_url,premium_until)')

  redeemPromo: async function(code, uid) {
    if (!sb) return { ok: false, error: 'Нет соединения' };
    var cl = (code || '').trim().toUpperCase().replace(/\s/g, '');
    var nd = cl.replace(/-/g, '');
    var ps = await sb.from('promos').select('*');
    var promo = null;
    for (var i = 0; i < (ps.data || []).length; i++) {
      var p = ps.data[i];
      var s = p.code.trim().toUpperCase().replace(/\s/g, '');
      if (s === cl || s.replace(/-/g, '') === nd) {
        promo = p;
        break;
      }
    }
    if (!promo) return { ok: false, error: 'Промокод не найден 😕' };
    if (promo.used) return { ok: false, error: 'Уже использован' };
    await sb.from('promos').update({ used: true, used_by: uid, used_at: new Date().toISOString() }).eq('id', promo.id);
    await Premium.activate(uid, promo.days);
    return { ok: true, days: promo.days };
  },

      .select('*,profiles(id,display_name,avatar_type,avatar_index,avatar_url,premium_until)')
      .eq('post_id', postId)
      .order('created_at');

      .select('*,profiles(id,display_name,avatar_type,avatar_index,avatar_url,premium_until)')
      .single();

  getStories: async function() {

      .select('*,profiles(id,display_name,avatar_type,avatar_index,avatar_url,premium_until)')
      .gt('expires_at', new Date().toISOString())
      .order('created_at', { ascending: false });

  createStory: async function(userId, username, mediaBlob, type) {

/* ============================================
   ПРЕМИУМ
   ============================================ */
var Premium = {
  isActive: function(u) {
    if (!u) return false;
    return u.premium_until && new Date(u.premium_until).getTime() > Date.now();
  },

  activate: async function(uid, days) {
    days = days || 30;
    if (!sb) return;
    var c = await DB.getUserById(uid);
    var base = c && c.premium_until && new Date(c.premium_until).getTime() > Date.now()
      ? new Date(c.premium_until).getTime()
      : Date.now();
    var nu = new Date(base + days * 24 * 60 * 60 * 1000).toISOString();
    await DB.updateUser(uid, { premium_until: nu });
    if (Auth.user && Auth.user.id === uid) Auth.user.premium_until = nu;
  },

  badge: function(u) {
    if (!this.isActive(u)) return '';
    return '<span title="Премиум">' + Icons.verified() + '</span>';
  },

  open: function() {
    var u = Auth.user;
    var a = u && this.isActive(u);
    var b = '';
    if (!u || Auth.isGuest) {
      b = '<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">Нужен аккаунт</div>'
        + '<button class="btn btn-primary" style="margin-top:16px" onclick="App.closeModal();App.go(\'register\')">Создать</button></div>';
    } else if (a) {
      var dl = Math.ceil((new Date(u.premium_until).getTime() - Date.now()) / 86400000);
      b = '<div class="premium-card"><div style="font-size:48px;margin-bottom:10px">👑</div>'
        + '<div style="font-size:20px;font-weight:800">Премиум активен</div>'
        + '<div style="color:var(--text-sec);margin-top:8px">до ' + new Date(u.premium_until).toLocaleDateString('ru-RU') + '</div>'
        + '<div style="margin-top:12px;color:var(--premium)">Осталось: ' + dl + ' дн.</div></div>'
        + '<div style="margin-top:16px;display:flex;gap:8px">'
        + '<input type="text" class="form-input" id="promo-input" placeholder="SHDW-XXXXXX" style="text-transform:uppercase;letter-spacing:1px;flex:1">'
        + '<button class="btn btn-premium btn-small" onclick="Premium.redeem()" style="min-height:48px">ОК</button></div>';
    } else {
      b = '<div class="premium-card">'
        + '<div style="font-size:22px;font-weight:800">' + Icons.crown() + ' Shadow Premium</div>'
        + '<div class="premium-price">' + CONFIG.PREMIUM_PRICE + ' ₽/мес</div>'
        + '<div class="premium-features">'
        + '<div class="premium-feature">✅ Золотая галочка</div>'
        + '<div class="premium-feature">✨ Истории (сторис)</div>'
        + '<div class="premium-feature">🚀 Видео выше в рекомендациях</div>'
        + '<div class="premium-feature">📤 ' + CONFIG.PREMIUM_LIMIT + ' видео/нед (вместо ' + CONFIG.FREE_LIMIT + ')</div>'
        + '</div>'
        + '<div class="telegram-box"><div style="font-size:14px;font-weight:600;margin-bottom:10px">📱 Купить промокод</div>'
        + '<button class="btn btn-telegram" style="width:100%" onclick="Premium.openTelegram()">✈️ Перейти в Telegram</button></div>'
        + '<div style="display:flex;gap:8px">'
        + '<input type="text" class="form-input" id="promo-input" placeholder="SHDW-XXXXXX" style="text-transform:uppercase;letter-spacing:1px;flex:1">'
        + '<button class="btn btn-premium" onclick="Premium.redeem()" style="min-height:48px">OK</button></div></div>';
    }
    App.modal('<div class="modal-header"><div class="modal-title">💎 Премиум</div>'
      + '<button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div>' + b);
  },

  openTelegram: function() {
    if (CONFIG.TELEGRAM_LINK) window.open(CONFIG.TELEGRAM_LINK, '_blank');
  },

  redeem: async function() {

/* ============================================
   АУТЕНТИФИКАЦИЯ
   ============================================ */
var Auth = {
  user: null,
  isGuest: false,
  session: null,

  register: async function() {
    var username = document.getElementById('reg-username').value.trim();
    var password = document.getElementById('reg-password').value;
    var display = document.getElementById('reg-displayname').value.trim();
    var bio = document.getElementById('reg-bio').value.trim();
    if (username.length < 3) { Utils.toast('Имя минимум 3 символа', 'error'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) { Utils.toast('Только латиница, цифры и _', 'error'); return; }
    if (password.length < 6) { Utils.toast('Пароль минимум 6 символов', 'error'); return; }
    if (!display) { Utils.toast('Введи имя', 'error'); return; }
    var btn = document.getElementById('reg-submit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    try {
      var r = await DB.createUser({
        username: username,
        password: password,
        display_name: display,
        bio: bio,
        avatar_type: Reg.avatarType,
        avatar_blob: Reg.avatarBlob
      });
      if (!r.ok) { Utils.toast(r.error, 'error'); return; }
      Auth.user = r.user;
      Auth.session = { user_id: r.user.id, username: username, password: password };
      localStorage.setItem('shadow_session', JSON.stringify(Auth.session));
      Utils.toast('Аккаунт создан! 🎉', 'success');
      App.startApp();
    } catch (e) {
      Utils.toast('Ошибка: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Создать аккаунт';
    }
  },

  login: async function() {
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;
    if (!username || !password) { Utils.toast('Введи имя и пароль', 'error'); return; }
    var btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    try {
      var r = await DB.findUser(username, password);
      if (!r.ok) { Utils.toast(r.error, 'error'); return; }
      if (r.user.banned) { App.showBanScreen(r.user); return; }
      Auth.user = r.user;
      Auth.session = { user_id: r.user.id, username: username, password: password };
      localStorage.setItem('shadow_session', JSON.stringify(Auth.session));
      Utils.toast('С возвращением, ' + r.user.display_name + '!', 'success');
      App.startApp();
    } catch (e) {
      Utils.toast('Ошибка: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  },

  restoreSession: async function() {
    var raw = localStorage.getItem('shadow_session');
    if (!raw) return false;
    try {
      Auth.session = JSON.parse(raw);
      if (!Auth.session.user_id) return false;
      var u = await DB.getUserById(Auth.session.user_id);
      if (!u) return false;
      if (u.banned) { App.showBanScreen(u); return false; }
      var ch = await DB.findUser(u.username, Auth.session.password);
      if (!ch.ok) { localStorage.removeItem('shadow_session'); return false; }
      Auth.user = u;
      return true;
    } catch (e) {
      return false;
    }
  },

  logout: function() {
    if (!confirm('Выйти?')) return;
    Auth.user = null;
    Auth.session = null;
    Auth.isGuest = false;
    localStorage.removeItem('shadow_session');
    App.go('welcome');
  }
};

var Limits = {
  weekUploads: async function(uid) {
    var u = await DB.getUploads(uid);
    var w = Date.now() - CONFIG.WEEK_MS;
    return u.filter(function(t) { return t > w; }).length;
  },

  canUpload: async function(u) {
    var l = Premium.isActive(u) ? CONFIG.PREMIUM_LIMIT : CONFIG.FREE_LIMIT;
    var c = await this.weekUploads(u.id);
    return c < l;
  },

  remaining: async function(u) {
    var l = Premium.isActive(u) ? CONFIG.PREMIUM_LIMIT : CONFIG.FREE_LIMIT;
    var c = await this.weekUploads(u.id);
    return Math.max(0, l - c);
  }
};

      + '<button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div>'
      + '<div class="comments-list">' + list + '</div>' + form);

  sendPostComment: async function(e, postId) {

    var inp = document.getElementById('post-comment-input');

var Stories = {
  timer: null,

  view: async function(userId) {
    var stories = await DB.getStories();
    var userStories = stories.filter(function(s) { return s.user_id === userId; });
    if (!userStories.length) return;
    var viewer = document.getElementById('story-viewer');
    viewer.classList.add('active');
    var idx = 0;
    var show = function() {
      if (idx >= userStories.length) { Stories.close(); return; }
      var s = userStories[idx];
      var u = s.profiles || {};
      viewer.innerHTML = '<div class="story-progress"><div class="story-progress-bar" id="story-bar"></div></div>'
        + '<div class="story-header"><div class="avatar small ' + (Premium.isActive(u) ? 'premium' : 'regular') + '">'
        + avatarContent(u) + '</div>'
        + '<div style="font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.8)">'
        + Utils.esc(u.display_name || '?') + '</div></div>'
        + '<button class="story-close" onclick="Stories.close()">' + Icons.close() + '</button>'
        + '<div class="story-viewer-media">'
        + (s.media_type === 'video'
          ? '<video src="' + s.media_url + '" autoplay muted playsinline></video>'
          : '<img src="' + s.media_url + '" alt="">')
        + '</div>';
      var bar = document.getElementById('story-bar');
      var progress = 0;
      if (Stories.timer) clearInterval(Stories.timer);
      Stories.timer = setInterval(function() {
        progress += 2;
        bar.style.width = progress + '%';
        if (progress >= 100) {
          clearInterval(Stories.timer);
          idx++;
          show();
        }
      }, 100);
    };
    show();
  },

  close: function() {
    if (Stories.timer) clearInterval(Stories.timer);
    document.getElementById('story-viewer').classList.remove('active');
  }
};

/* ============================================
   ЛЕНТА ВИДЕО
   ============================================ */
var Feed = {
  videos: [],
  observer: null,
  currentCard: null,

  load: async function() {
    Feed.videos = await DB.getFeed(Auth.user ? Auth.user.id : null);
    Feed.videos.sort(function(a, b) {
      var sa = Math.random() * 25;
      var sb2 = Math.random() * 25;
      if (Premium.isActive(a.author)) sa += 25;
      if (Premium.isActive(b.author)) sb2 += 25;
      var aa = (Date.now() - new Date(a.created_at).getTime()) / 86400000;
      var bb = (Date.now() - new Date(b.created_at).getTime()) / 86400000;
      sa += Math.max(0, 60 - aa * 15);
      sb2 += Math.max(0, 60 - bb * 15);
      return sb2 - sa;
    });
  },

  render: async function() {
    var c = document.getElementById('feed-container');
    c.innerHTML = '<div class="video-card"><div class="video-empty">'
      + '<div class="spinner" style="width:40px;height:40px;border-width:4px"></div>'
      + '<div style="margin-top:16px;color:var(--text-sec)">Загрузка...</div></div></div>';
    try {
      await Feed.load();
    } catch (e) {
      c.innerHTML = '<div class="video-card"><div class="video-empty">'
        + '<div style="font-size:48px">😞</div><div>' + Utils.esc(e.message) + '</div></div></div>';
      return;
    }
    c.innerHTML = '';
    if (!Feed.videos.length) {
      c.innerHTML = '<div class="video-card"><div class="video-empty">'
        + '<div style="font-size:56px">🎬</div>'
        + '<div style="font-size:18px;font-weight:700">Лента пуста</div></div></div>';
      return;
    }
    for (var vi = 0; vi < Feed.videos.length; vi++) {
      var v = Feed.videos[vi];
      var a = v.author || {};
      var isFol = await DB.isFollowing(v.user_id, Auth.user ? Auth.user.id : null);
      var showF = Auth.user && !Auth.isGuest && Auth.user.id !== v.user_id;
      var card = document.createElement('div');
      card.className = 'video-card';
      card.dataset.id = v.id;
      var vh = v.video_url
        ? '<video class="video-element" src="' + v.video_url + '" loop playsinline preload="metadata" '
          + (v.thumbnail_url ? 'poster="' + v.thumbnail_url + '"' : '') + '></video>'
        : '<div class="video-empty"><div style="font-size:48px">🎬</div></div>';
      card.innerHTML = vh
        + '<div class="video-gradient"></div>'
        + '<div class="play-indicator">' + Icons.play() + '</div>'
        + '<div class="video-info">'
        + '<div class="video-author-row">'
        + '<div class="avatar small ' + (Premium.isActive(a) ? 'premium' : 'regular') + '">' + avatarContent(a) + '</div>'
        + '<div class="video-author-name" onclick="App.viewProfile(\'' + v.user_id + '\')">@'
        + Utils.esc(a.username || v.username) + ' ' + Premium.badge(a) + '</div></div>'
        + '<div class="video-desc">' + Utils.esc(v.title) + '</div>'
        + '<div class="video-tags">' + (v.tags || []).map(function(t) {
            return '<span class="video-tag">#' + Utils.esc(t) + '</span>';
          }).join('') + '</div></div>'
        + '<div class="video-actions">'
        + '<div class="avatar-follow-wrap">'
        + '<div class="avatar big ' + (Premium.isActive(a) ? 'premium' : 'regular') + '"'
        + ' onclick="App.viewProfile(\'' + v.user_id + '\')">' + avatarContent(a) + '</div>'
        + (showF ? '<button class="follow-plus ' + (isFol ? 'followed' : '') + '"'
          + ' data-follow-btn="' + v.user_id + '"'
          + ' onclick="event.stopPropagation();Feed.toggleFollow(\'' + v.user_id + '\')">'
          + (isFol ? '✓' : '+') + '</button>' : '')
        + '</div>'
        + '<div class="video-action ' + (v.liked_by_me ? 'liked' : '') + '"'
        + ' onclick="Feed.like(\'' + v.id + '\')">'
        + '<div class="video-action-btn">' + Icons.heart(v.liked_by_me) + '</div>'
        + '<span class="video-action-count" id="likes-' + v.id + '">' + Utils.fmtNum(v.likes) + '</span></div>'
        + '<div class="video-action" onclick="Comments.open(\'' + v.id + '\')">'
        + '<div class="video-action-btn">' + Icons.comment() + '</div>'
        + '<span class="video-action-count">' + Utils.fmtNum(v.comment_count) + '</span></div>'
        + '<div class="video-action" onclick="Feed.share()">'
        + '<div class="video-action-btn">' + Icons.share() + '</div></div>'
        + '<div class="video-action ' + (v.saved_by_me ? 'saved' : '') + '"'
        + ' onclick="Feed.save(\'' + v.id + '\')">'
        + '<div class="video-action-btn">' + Icons.bookmark() + '</div></div>'
        + '</div>';
      (function(cardRef) {
        cardRef.addEventListener('click', function(e) {
          if (e.target.closest('.video-action') || e.target.closest('.video-info') || e.target.closest('.avatar-follow-wrap')) return;
          Feed.togglePlay(cardRef);
        });
      })(card);
      c.appendChild(card);
    }
    Feed.setupAutoplay();
  },

  toggleFollow: async function(uid) {
    if (!Auth.user) { Utils.toast('Войди в аккаунт', 'error'); return; }
    var r = await DB.toggleFollow(uid, Auth.user.id);
    if (!r) return;
    document.querySelectorAll('[data-follow-btn="' + uid + '"]').forEach(function(b) {
      b.textContent = r.following ? '✓' : '+';
      b.classList.toggle('followed', r.following);
    });
    Utils.toast(r.following ? 'Подписался! 🎯' : 'Отписался', 'success');
  },

  setupAutoplay: function() {
    if (Feed.observer) Feed.observer.disconnect();
    Feed.observer = new IntersectionObserver(function(es) {
      es.forEach(function(e) {
        var v = e.target.querySelector('video');
        if (!v) return;
        if (e.isIntersecting) {
          Feed.currentCard = e.target;
          v.play().catch(function() {});
          Feed.setPlay(e.target, true);
        } else {
          v.pause();
          v.currentTime = 0;
        }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('.video-card').forEach(function(c) {
      Feed.observer.observe(c);
    });
  },

  togglePlay: function(card) {
    var v = card.querySelector('video');
    if (!v) return;
    if (v.paused) {
      v.play().catch(function() {});
      Feed.setPlay(card, true);
    } else {
      v.pause();
      Feed.setPlay(card, false);
    }
  },

  setPlay: function(card, p) {
    var i = card.querySelector('.play-indicator');
    if (i) i.classList.toggle('visible', !p);
  },

  toggleCurrent: function() {
    if (Feed.currentCard) Feed.togglePlay(Feed.currentCard);
  },

  like: async function(id) {
    if (!Auth.user) { Utils.toast('Войди чтобы лайкать', 'error'); return; }
    var v = null;
    for (var i = 0; i < Feed.videos.length; i++) {
      if (Feed.videos[i].id === id) { v = Feed.videos[i]; break; }
    }
    if (!v) return;
    var r = await DB.toggleLike(id, Auth.user.id);
    if (!r) return;
    v.liked_by_me = r.liked;
    v.likes = r.liked ? v.likes + 1 : Math.max(0, v.likes - 1);
    if (r.liked) Feed.showHeart(id);
    var card = document.querySelector('.video-card[data-id="' + id + '"]');
    if (card) {
      var act = card.querySelector('.video-action');
      act.classList.toggle('liked', v.liked_by_me);
      act.querySelector('.video-action-btn').innerHTML = Icons.heart(v.liked_by_me);
      document.getElementById('likes-' + id).textContent = Utils.fmtNum(v.likes);
    }
  },

  showHeart: function(id) {
    var c = document.querySelector('.video-card[data-id="' + id + '"]');
    if (!c) return;
    var h = document.createElement('div');
    h.className = 'heart-pop';
    h.innerHTML = Icons.heart(true);
    c.appendChild(h);
    setTimeout(function() { h.remove(); }, 900);
  },

  save: async function(id) {
    if (!Auth.user) return;
    var v = null;
    for (var i = 0; i < Feed.videos.length; i++) {
      if (Feed.videos[i].id === id) { v = Feed.videos[i]; break; }
    }
    if (!v) return;
    var r = await DB.toggleSave(id, Auth.user.id);
    if (!r) return;

    var c = document.querySelector('.video-card[data-id="' + id + '"]');
    if (c) c.querySelectorAll('.video-action')[3].classList.toggle('saved', v.saved_by_me);
    Utils.toast(v.saved_by_me ? 'Сохранено ✨' : 'Удалено', 'success');
  },

  share: function() {
    if (navigator.share) {
      navigator.share({ title: 'Shadow', url: location.href }).catch(function() {});
    } else {
      Utils.toast('Ссылка скопирована 📋', 'success');
    }
  },

  jumpTo: function(id) {
    App.nav('feed');
    setTimeout(function() {
      var c = document.querySelector('.video-card[data-id="' + id + '"]');
      if (c) c.scrollIntoView({ behavior: 'smooth' });
    }, 100);
  }
};

/* ============================================
   ЗАГРУЗКА

var Upload = {
  file: null,
  duration: null,
  mode: 'video',
  storyFile: null,
  storyType: null,
  photoFile: null,
  _lastRem: 0,
  _lastLim: 2,

  open: async function() {
    if (!Auth.user || Auth.isGuest) { Utils.toast('Войди в аккаунт', 'error'); return; }
    Upload.mode = 'video';
    Upload.file = null;
    Upload.duration = null;
    Upload.photoFile = null;
    Upload.storyFile = null;
    Upload.storyType = null;
    var can = await Limits.canUpload(Auth.user);
    if (!can) {
      Utils.toast('Лимит видео исчерпан 😔', 'error');
      if (!Premium.isActive(Auth.user)) setTimeout(function() { Premium.open(); }, 600);
      return;
    }
    Upload._lastRem = await Limits.remaining(Auth.user);
    Upload._lastLim = Premium.isActive(Auth.user) ? CONFIG.PREMIUM_LIMIT : CONFIG.FREE_LIMIT;
    var ip = Premium.isActive(Auth.user);
    var tabs = '<div style="display:flex;gap:8px;margin-bottom:16px">'
      + '<button class="btn btn-primary btn-small" style="flex:1" id="tab-video" onclick="Upload.switchTab(\'video\')">🎬 Видео</button>'
      + '<button class="btn btn-secondary btn-small" style="flex:1" id="tab-photo" onclick="Upload.switchTab(\'photo\')">📸 Фото</button>'
      + (ip ? '<button class="btn btn-premium btn-small" style="flex:1" id="tab-story" onclick="Upload.switchTab(\'story\')">✨ История</button>' : '')
      + '</div>';
    App.modal('<div class="modal-header"><div class="modal-title">Загрузить</div>'
      + '<button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div>'
      + tabs + '<div id="upload-content"></div>');
    Upload.switchTab('video');
  },

  switchTab: function(tab) {
    Upload.mode = tab;
    ['tab-video', 'tab-photo', 'tab-story'].forEach(function(id) {
      var b = document.getElementById(id);
      if (b) b.className = b.className.replace('btn-primary', 'btn-secondary').replace('btn-premium', 'btn-secondary');
    });
    var activeBtn = document.getElementById('tab-' + tab);
    if (activeBtn) activeBtn.className = activeBtn.className.replace('btn-secondary', tab === 'story' ? 'btn-premium' : 'btn-primary');
    var content = document.getElementById('upload-content');
    if (tab === 'video') {
      content.innerHTML = '<div class="limit-badge ' + (Premium.isActive(Auth.user) ? 'premium' : '') + '">'
        + '📤 Осталось: ' + Upload._lastRem + '/' + Upload._lastLim + '</div>'
        + '<div class="upload-dropzone" id="dropzone" onclick="document.getElementById(\'file-input\').click()">'
        + '<div class="upload-dropzone-icon">📹</div>'
        + '<div style="font-weight:600">Выбери видео</div>'
        + '<div style="font-size:13px;color:var(--text-sec)">Макс ' + CONFIG.MAX_VIDEO_SEC + ' сек</div>'
        + '<input type="file" id="file-input" accept="video/*" style="display:none" onchange="Upload.pickVideo(this)"></div>'
        + '<div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div>'
        + '<div id="video-preview-wrap" style="display:none;margin-bottom:16px">'
        + '<video id="upload-preview" class="upload-preview-video" muted playsinline loop autoplay></video>'
        + '<div style="font-size:12px;color:var(--text-sec);margin-top:6px;text-align:center" id="duration-label"></div></div>'
        + '<div class="form-group"><label class="form-label">Название *</label>'
        + '<input type="text" class="form-input" id="upload-title" maxlength="100"></div>'
        + '<div class="form-group"><label class="form-label">Описание и теги</label>'
        + '<textarea class="form-textarea" id="upload-desc" maxlength="300"></textarea></div>'
        + '<button class="btn btn-primary" style="width:100%" id="upload-btn" onclick="Upload.submitVideo()" disabled>Загрузить</button>';
    } else if (tab === 'photo') {
      content.innerHTML = '<div class="upload-dropzone" id="dropzone" onclick="document.getElementById(\'photo-input\').click()">'
        + '<div class="upload-dropzone-icon">📸</div>'
        + '<div style="font-weight:600">Выбери фото</div>'
        + '<input type="file" id="photo-input" accept="image/*" style="display:none" onchange="Upload.pickPhoto(this)"></div>'
        + '<div id="photo-preview-wrap" style="display:none;margin-bottom:16px">'
        + '<img id="photo-preview-img" class="upload-preview-img" alt=""></div>'
        + '<div class="form-group"><label class="form-label">Подпись</label>'
        + '<textarea class="form-textarea" id="post-caption" placeholder="Подпись к фото... эмодзи тоже можно 😊" maxlength="500"></textarea></div>'
        + '<button class="btn btn-primary" style="width:100%" id="post-btn" onclick="Upload.submitPost()" disabled>Опубликовать</button>';
    } else if (tab === 'story') {
      content.innerHTML = '<div class="upload-dropzone" id="dropzone" onclick="document.getElementById(\'story-input\').click()">'
        + '<div class="upload-dropzone-icon">✨</div>'
        + '<div style="font-weight:600">Фото или видео</div>'
        + '<div style="font-size:13px;color:var(--text-sec)">Исчезнет через 24 часа</div>'
        + '<input type="file" id="story-input" accept="image/*,video/*" style="display:none" onchange="Upload.pickStory(this)"></div>'
        + '<div id="story-preview-wrap" style="display:none;margin-bottom:16px"></div>'
        + '<button class="btn btn-premium" style="width:100%" id="story-btn" onclick="Upload.submitStory()" disabled>Опубликовать историю</button>';
    }
  },

  openStoryMode: function() {
    Upload.open();
    setTimeout(function() { Upload.switchTab('story'); }, 100);
  },

  pickVideo: function(input) {
    var f = input.files[0];
    if (!f) return;
    if (!f.type.startsWith('video/')) { Utils.toast('Выбери видео', 'error'); return; }
    if (f.size > CONFIG.MAX_FILE_MB * 1024 * 1024) { Utils.toast('Файл больше ' + CONFIG.MAX_FILE_MB + ' МБ', 'error'); return; }
    var url = URL.createObjectURL(f);
    var tv = document.createElement('video');
    tv.preload = 'metadata';
    tv.src = url;
    tv.onloadedmetadata = function() {
      URL.revokeObjectURL(url);
      if (tv.duration > CONFIG.MAX_VIDEO_SEC) {
        Utils.toast(Math.round(tv.duration) + ' сек. Макс ' + CONFIG.MAX_VIDEO_SEC + '!', 'error');
        return;
      }
      Upload.file = f;
      Upload.duration = tv.duration;
      document.getElementById('upload-preview').src = URL.createObjectURL(f);
      document.getElementById('video-preview-wrap').style.display = 'block';
      document.getElementById('dropzone').classList.add('has-video');
      document.getElementById('dropzone').querySelector('.upload-dropzone-icon').textContent = '✅';
      document.getElementById('duration-label').textContent = '⏱ ' + Math.round(Upload.duration) + ' сек';
      document.getElementById('upload-btn').disabled = false;
    };
  },

  pickPhoto: function(input) {
    var f = input.files[0];
    if (!f || !f.type.startsWith('image/')) { Utils.toast('Выбери фото', 'error'); return; }
    Upload.photoFile = f;
    var url = URL.createObjectURL(f);
    document.getElementById('photo-preview-img').src = url;
    document.getElementById('photo-preview-wrap').style.display = 'block';
    document.getElementById('dropzone').classList.add('has-video');
    document.getElementById('post-btn').disabled = false;
  },

  pickStory: function(input) {
    var f = input.files[0];
    if (!f) return;
    Upload.storyFile = f;
    Upload.storyType = f.type.startsWith('video/') ? 'video' : 'image';
    var url = URL.createObjectURL(f);
    var wrap = document.getElementById('story-preview-wrap');
    wrap.style.display = 'block';
    if (Upload.storyType === 'video') {
      wrap.innerHTML = '<video src="' + url + '" controls muted playsinline style="width:100%;max-height:280px;border-radius:10px"></video>';
    } else {
      wrap.innerHTML = '<img src="' + url + '" style="width:100%;max-height:280px;object-fit:contain;border-radius:10px">';
    }
    document.getElementById('dropzone').classList.add('has-video');
    document.getElementById('story-btn').disabled = false;
  },

  makeThumbnail: function(file) {
    return new Promise(function(res) {
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.muted = true;
      v.src = URL.createObjectURL(file);
      v.onloadeddata = function() { v.currentTime = Math.min(1, v.duration / 2); };
      v.onseeked = function() {
        var c = document.createElement('canvas');
        c.width = 360;
        c.height = 640;
        var ctx = c.getContext('2d');
        var r = Math.max(c.width / v.videoWidth, c.height / v.videoHeight);
        var w = v.videoWidth * r;
        var h = v.videoHeight * r;
        ctx.drawImage(v, (c.width - w) / 2, (c.height - h) / 2, w, h);
        c.toBlob(function(b) { URL.revokeObjectURL(v.src); res(b); }, 'image/jpeg', 0.7);
      };
      v.onerror = function() { res(null); };
    });
  },

  submitVideo: async function() {
    var title = document.getElementById('upload-title').value.trim();
    var desc = document.getElementById('upload-desc').value.trim();
    if (!Upload.file || !title) { Utils.toast('Заполни название', 'error'); return; }
    var btn = document.getElementById('upload-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    document.getElementById('upload-progress').style.display = 'block';
    document.getElementById('upload-progress-bar').style.width = '30%';
    try {
      var thumb = await Upload.makeThumbnail(Upload.file);
      document.getElementById('upload-progress-bar').style.width = '60%';
      var tags = (desc.match(/#([a-zA-Zа-яА-ЯёЁ0-9_]+)/g) || []).map(function(t) { return t.slice(1); });
      var r = await DB.uploadVideo({
        userId: Auth.user.id,
        username: Auth.user.username,
        title: title,
        description: desc,
        tags: tags,
        duration: Math.round(Upload.duration),
        videoBlob: Upload.file,
        thumbBlob: thumb
      });
      document.getElementById('upload-progress-bar').style.width = '100%';
      if (!r.ok) { Utils.toast(r.error, 'error'); btn.disabled = false; btn.textContent = 'Загрузить'; return; }
      App.closeModal();
      Utils.toast('Видео загружено! 🎬', 'success');
      App.nav('feed');
      Feed.render();
    } catch (e) {
      Utils.toast('Ошибка: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Загрузить';
    }
  },

  submitPost: async function() {
    if (!Upload.photoFile) { Utils.toast('Выбери фото', 'error'); return; }
    var caption = document.getElementById('post-caption').value.trim();
    var btn = document.getElementById('post-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    try {
      var blob = await Utils.compressImage(Upload.photoFile, 800);
      var r = await DB.createPost(Auth.user.id, Auth.user.username, blob, caption);
      if (!r.ok) { Utils.toast(r.error, 'error'); return; }
      App.closeModal();
      Utils.toast('Фото опубликовано! 📸', 'success');
      MainFeed.loadPosts();
    } catch (e) {
      Utils.toast('Ошибка: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Опубликовать';
    }
  },

  submitStory: async function() {
    if (!Upload.storyFile) { Utils.toast('Выбери файл', 'error'); return; }
    var btn = document.getElementById('story-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    try {
      var blob = Upload.storyFile;
      if (Upload.storyType === 'image') blob = await Utils.compressImage(Upload.storyFile, 600);
      var r = await DB.createStory(Auth.user.id, Auth.user.username, blob, Upload.storyType);
      if (!r.ok) { Utils.toast(r.error || 'Ошибка', 'error'); return; }
      App.closeModal();
      Utils.toast('История опубликована! ✨', 'premium');
      MainFeed.loadStories();
    } catch (e) {
      Utils.toast('Ошибка: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Опубликовать историю';
    }
  }
};

      + '<textarea class="form-textarea" id="edit-bio" maxlength="160">' + Utils.esc(u.bio || '') + '</textarea></div>'
      + '<div class="form-group"><label class="form-label">Новое фото</label>'
      + '<input type="file" id="edit-avatar-file" accept="image/*" style="color:var(--text-sec)"></div>'
      + '<button class="btn btn-primary" style="width:100%" onclick="Profile.saveEdit()">Сохранить</button>');
  },

  saveEdit: async function() {
    var name = document.getElementById('edit-name').value.trim();
    var bio = document.getElementById('edit-bio').value.trim();
    var fileInput = document.getElementById('edit-avatar-file');
    var updates = { display_name: name, bio: bio };
    if (fileInput.files[0]) {
      try {
        var blob = await Utils.compressImage(fileInput.files[0], 400);
        var fn = Date.now() + '_edit.jpg';
        await sb.storage.from('avatars').upload(fn, blob, { contentType: 'image/jpeg', upsert: true });
        var d = sb.storage.from('avatars').getPublicUrl(fn);
        updates.avatar_url = d.data.publicUrl;
        updates.avatar_type = 'photo';
      } catch (e) {
        Utils.toast('Ошибка фото', 'error');
        return;
      }
    }
    await DB.updateUser(Auth.user.id, updates);
    var newUser = {};
    for (var k in Auth.user) newUser[k] = Auth.user[k];
    for (var k2 in updates) newUser[k2] = updates[k2];
    Auth.user = newUser;
    App.closeModal();
    Utils.toast('Профиль обновлён ✅', 'success');
    Profile.render();
  },

  deleteVideo: async function(vid) {
    if (!confirm('Удалить видео навсегда?')) return;
    await DB.deleteVideo(vid);
    Utils.toast('Удалено 🗑', 'success');
    Profile.render();
    Feed.render();
  }
};

/* ============================================
   ПОИСК
   ============================================ */
var Search = {
  live: async function(q) {
    var dd = document.getElementById('search-dropdown');
    if (!dd) return;
    if (!q.trim()) { dd.classList.remove('active'); return; }
    dd.classList.add('active');
    var ql = q.trim().toLowerCase();
    var users = await sb.from('profiles')
      .select('id,display_name,username,avatar_type,avatar_url,premium_until')
      .eq('banned', false)
      .or('username.ilike.%' + ql + '%,display_name.ilike.%' + ql + '%')
      .limit(5);
    var videos = await sb.from('videos').select('id,title,username').ilike('title', '%' + ql + '%').limit(5);
    var html = '';
    if (users.data && users.data.length) {
      html += '<div style="padding:8px 12px;font-size:11px;color:var(--text-muted);font-weight:700">ПОЛЬЗОВАТЕЛИ</div>';
      users.data.forEach(function(u) {
        html += '<div class="search-result-item" onmousedown="App.viewProfile(\'' + u.id + '\')">'
          + '<div class="avatar small ' + (Premium.isActive(u) ? 'premium' : 'regular') + '">' + avatarContent(u) + '</div>'
          + '<div><div style="font-weight:600;font-size:14px">' + Utils.esc(u.display_name) + '</div>'
          + '<div style="font-size:12px;color:var(--text-sec)">@' + Utils.esc(u.username) + '</div></div></div>';
      });
    }
    if (videos.data && videos.data.length) {
      html += '<div style="padding:8px 12px;font-size:11px;color:var(--text-muted);font-weight:700">ВИДЕО</div>';
      videos.data.forEach(function(v) {
        html += '<div class="search-result-item" onmousedown="Feed.jumpTo(\'' + v.id + '\')">'
          + '<div style="font-size:20px">🎬</div>'
          + '<div><div style="font-weight:600;font-size:14px">' + Utils.esc(v.title) + '</div>'
          + '<div style="font-size:12px;color:var(--text-sec)">@' + Utils.esc(v.username) + '</div></div></div>';
      });
    }
    if (!html) html = '<div style="padding:20px;text-align:center;color:var(--text-muted)">Ничего не найдено</div>';
    dd.innerHTML = html;
  },

  showDropdown: function() {
    var q = document.getElementById('main-search').value;
    if (q.trim()) Search.live(q);
  },

  hideDropdown: function() {
    var dd = document.getElementById('search-dropdown');
    if (dd) dd.classList.remove('active');
  }
};

/* ============================================
   АДМИН-ПАНЕЛЬ
   ============================================ */
var Admin = {
  loginTaps: 0,
  currentTab: 'users',

  logoTap: function() {
    Admin.loginTaps++;
    if (Admin.loginTaps >= 5) {
      Admin.loginTaps = 0;
      Admin.openLogin();
    }
  },

  openLogin: function() {
    App.modal('<div class="modal-header"><div class="modal-title">🔐 Код админа</div>'
      + '<button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div>'
      + '<div class="form-group"><input type="password" class="form-input" id="admin-pass" placeholder="Код"></div>'
      + '<button class="btn btn-primary" style="width:100%" onclick="Admin.check()">Войти</button>');
  },

  check: function() {
    if (document.getElementById('admin-pass').value === CONFIG.ADMIN_PASSWORD) {
      Admin.panel();
    } else {
      Utils.toast('Неверный код', 'error');
    }
  },

  panel: async function() {
    var c = '';
    if (Admin.currentTab === 'users') {
      var users = await sb.from('profiles').select('*');
      c = (users.data || []).map(function(u) {
        return '<div class="admin-row"><div style="display:flex;align-items:center;gap:10px;min-width:0">'
          + '<div class="avatar small ' + (u.banned ? 'banned' : (Premium.isActive(u) ? 'premium' : 'regular')) + '">' + avatarContent(u) + '</div>'
          + '<div style="min-width:0"><div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
          + Utils.esc(u.display_name) + ' ' + (u.banned ? '🚫' : Premium.badge(u)) + '</div>'
          + '<div style="font-size:12px;color:var(--text-sec)">@' + Utils.esc(u.username) + '</div></div></div>'
          + (u.banned
            ? '<button class="btn btn-secondary btn-small" onclick="Admin.unban(\'' + u.id + '\')">Разбан</button>'
            : '<button class="btn btn-danger btn-small" onclick="Admin.ban(\'' + u.id + '\')">🚫</button>')
          + '</div>';
      }).join('');
    } else if (Admin.currentTab === 'videos') {
      var vids = await sb.from('videos').select('*').order('created_at', { ascending: false });
      c = (vids.data || []).map(function(v) {
        return '<div class="admin-row"><div style="min-width:0">'
          + '<div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + Utils.esc(v.title) + '</div>'
          + '<div style="font-size:12px;color:var(--text-sec)">@' + Utils.esc(v.username) + '</div></div>'
          + '<button class="btn btn-danger btn-small" onclick="Admin.delVideo(\'' + v.id + '\')">🗑</button></div>';
      }).join('');
    } else {
      var promos = await DB.getAllPromos();
      var active = promos.filter(function(p) { return !p.used; });
      var used = promos.filter(function(p) { return p.used; });
      c = '<button class="btn btn-premium" style="width:100%;margin-bottom:12px" onclick="Admin.newPromo()">+ Создать</button>'
        + '<div id="new-promo-slot"></div>'
        + '<div class="admin-section-title">Активные (' + active.length + ')</div>'
        + active.map(function(p) {
            return '<div class="admin-row"><div style="font-family:monospace;font-weight:700">' + p.code + '</div>'
              + '<button class="btn btn-secondary btn-small" onclick="navigator.clipboard.writeText(\'' + p.code + '\');Utils.toast(\'📋\',\'success\')">📋</button></div>';
          }).join('')
        + '<div class="admin-section-title">Использованные (' + used.length + ')</div>'
        + used.map(function(p) {
            return '<div class="admin-row" style="opacity:.5"><div style="font-family:monospace;text-decoration:line-through">' + p.code + '</div></div>';
          }).join('');
    }
    App.modal('<div class="modal-header"><div class="modal-title">⚙️ Админ</div>'
      + '<button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div>'
      + '<div class="admin-tab-bar">'
      + '<div class="admin-tab ' + (Admin.currentTab === 'users' ? 'active' : '') + '" onclick="Admin.tab(\'users\')">👥</div>'
      + '<div class="admin-tab ' + (Admin.currentTab === 'videos' ? 'active' : '') + '" onclick="Admin.tab(\'videos\')">🎬</div>'
      + '<div class="admin-tab ' + (Admin.currentTab === 'promos' ? 'active' : '') + '" onclick="Admin.tab(\'promos\')">🎁</div>'
      + '</div><div style="max-height:60vh;overflow-y:auto">' + c + '</div>');
  },

  tab: function(t) {
    Admin.currentTab = t;
    Admin.panel();
  },

  ban: async function(uid) {
    if (Auth.user && Auth.user.id === uid) { Utils.toast('Нельзя себя!', 'error'); return; }
    var r = prompt('Причина:') || 'Нарушение';
    await DB.banUser(uid, r);
    Utils.toast('Забанен 🚫', 'error');
    Admin.panel();
  },

  unban: async function(uid) {
    await DB.unbanUser(uid);
    Utils.toast('Разбанен ✅', 'success');
    Admin.panel();
  },

  delVideo: async function(vid) {
    if (!confirm('Удалить?')) return;
    await DB.deleteVideo(vid);
    Utils.toast('Удалено 🗑', 'success');
    Admin.panel();
  },

  newPromo: async function() {
    var code = await DB.createPromo();
    document.getElementById('new-promo-slot').innerHTML = '<div class="promo-code-box">' + code + '</div>'
      + '<button class="btn btn-secondary btn-small" style="width:100%" onclick="navigator.clipboard.writeText(\'' + code + '\');Utils.toast(\'📋\',\'success\')">📋 Скопировать</button>';
    Utils.toast('Создан! 🎉', 'premium');
  }
};

/* ============================================
   ПРИЛОЖЕНИЕ
   ============================================ */
var App = {
  current: 'welcome',
  profileBack: 'main',

  go: function(name) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    var s = document.getElementById('screen-' + name);
    if (s) s.classList.add('active');
    App.current = name;
  },

  nav: function(name) {
    if (name === 'main') {
      App.go('main');
      App.setNav('main');
      MainFeed.loadAll();
    } else if (name === 'feed') {
      App.go('feed');
      App.setNav('feed');
      Feed.render();
    } else if (name === 'inbox') {
      App.go('inbox');
      App.setNav('inbox');
    } else if (name === 'profile') {
      if (!Auth.user) {
        Utils.toast('Войди в аккаунт', 'error');
        setTimeout(function() { App.go('welcome'); }, 500);
        return;
      }
      App.profileBack = 'main';
      App.go('profile');
      App.setNav('profile');
      Profile.currentTab = 'videos';
      Profile.render();
    }
  },

  setNav: function(n) {
    document.querySelectorAll('.nav-btn[data-nav]').forEach(function(b) {
      b.classList.toggle('active', b.dataset.nav === n);
    });
  },

  viewProfile: function(uid) {
    App.profileBack = App.current;
    App.go('profile');
    Profile.render(uid);
  },

  backFromProfile: function() {
    App.go(App.profileBack === 'profile' ? 'main' : App.profileBack);
    if (App.profileBack === 'main') MainFeed.loadAll();
  },

  enterGuest: function() {
    Auth.user = null;
    Auth.isGuest = true;
    Utils.toast('Гостевой режим 👀', 'success');
    App.startApp();
  },

  modal: function(html) {
    document.getElementById('modals').innerHTML = '<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)App.closeModal()"><div class="modal">' + html + '</div></div>';
  },

  closeModal: function() {
    document.getElementById('modals').innerHTML = '';
  },

  showBanScreen: function(u) {
    App.go('banned');
    var r = document.getElementById('ban-reason');
    if (u.ban_reason) {
      r.style.display = 'block';
      r.innerHTML = '<b>Причина:</b> ' + Utils.esc(u.ban_reason);
    } else {
      r.style.display = 'none';
    }
  },

  startApp: function() {
    App.go('main');
    App.setNav('main');
    MainFeed.loadAll();
  },

  init: function() {
    document.getElementById('welcome-logo').addEventListener('click', function() { Admin.logoTap(); });
    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        var t = document.activeElement.tagName;
        if (t === 'INPUT' || t === 'TEXTAREA') return;
        e.preventDefault();
        Feed.toggleCurrent();
      }
    });
  }
};

/* ============================================
   ЗАПУСК
   ============================================ */
(async function() {
  if (!sb) {
    Utils.toast('Ошибка Supabase. Проверь интернет.', 'error');
    return;
  }
  App.init();
  var ok = await Auth.restoreSession();
  if (ok && Auth.user && !Auth.user.banned) {
    App.startApp();
  } else {
    App.go('welcome');
  }
})();
</script>
</body>
