<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shadow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =============================================
   СБРОС
   ============================================= */
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    height: 100%;
    overflow: hidden;
}

body {
    height: 100dvh;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
    position: fixed;
    width: 100%;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
}

input,
textarea {
    font-family: inherit;
    outline: none;
    border: none;
}

video,
img {
    display: block;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: #0a0a0a;
}

::-webkit-scrollbar-thumb {
    background: #27272a;
    border-radius: 3px;
}

/* =============================================
   ПЕРЕМЕННЫЕ
   ============================================= */
:root {
    --primary: #a855f7;
    --primary-dark: #7c3aed;
    --primary-light: #c084fc;
    --text-sec: #a1a1aa;
    --text-muted: #52525b;
    --border: #27272a;
    --bg-card: #0a0a0a;
    --bg-card-alt: #121212;
    --bg-input: #1a1a1a;
    --error: #ef4444;
    --success: #22c55e;
    --premium: #fbbf24;
    --premium-dark: #f59e0b;
    --nav-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}

/* =============================================
   ПРИЛОЖЕНИЕ И ЭКРАНЫ
   ============================================= */
#app {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
}

.screen.active {
    display: flex;
    opacity: 1;
}

/* =============================================
   КНОПКИ
   ============================================= */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.15s ease;
    min-height: 48px;
    user-select: none;
}

.btn:active {
    transform: scale(0.96);
}

.btn:disabled {
    opacity: 0.5;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
}

.btn-premium {
    background: linear-gradient(135deg, var(--premium), var(--premium-dark));
    color: #000;
    font-weight: 700;
}

.btn-telegram {
    background: linear-gradient(135deg, #2AABEE, #1E96D1);
    color: #fff;
    font-weight: 700;
}

.btn-secondary {
    background: var(--bg-card-alt);
    color: #fff;
    border: 1px solid var(--border);
}

.btn-ghost {
    background: transparent;
    color: var(--text-sec);
}

.btn-danger {
    background: rgba(239, 68, 68, 0.12);
    color: var(--error);
    border: 1px solid rgba(239, 68, 68, 0.3);
}

.btn-small {
    padding: 8px 14px;
    font-size: 13px;
    min-height: 36px;
}

.btn-block {
    width: 100%;
    max-width: 320px;
}

/* =============================================
   ФОРМЫ
   ============================================= */
.form-group {
    width: 100%;
    max-width: 360px;
    margin-bottom: 18px;
    text-align: left;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-sec);
    font-weight: 500;
}

.form-input,
.form-textarea {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    transition: border-color 0.2s;
}

.form-input:focus,
.form-textarea:focus {
    border-color: var(--primary);
}

.form-textarea {
    resize: none;
    min-height: 80px;
}

/* =============================================
   АВАТАРЫ
   ============================================= */
.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    border: 2px solid var(--border);
    overflow: hidden;
    position: relative;
}

.avatar.small {
    width: 32px;
    height: 32px;
    font-size: 13px;
}

.avatar.big {
    width: 44px;
    height: 44px;
    font-size: 16px;
    cursor: pointer;
}

.avatar.xxl {
    width: 110px;
    height: 110px;
    font-size: 42px;
}

.avatar.premium {
    background: linear-gradient(135deg, var(--premium), var(--premium-dark));
    color: #000;
    border-color: var(--premium);
}

.avatar.regular {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
}

.avatar.banned {
    background: #333;
    color: #666;
    border-color: var(--error);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar.has-story {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary);
}

.avatar.has-story.premium {
    border-color: var(--premium);
    box-shadow: 0 0 0 2px var(--premium);
}

/* =============================================
   STORIES BAR
   ============================================= */
.stories-bar {
    display: flex;
    gap: 8px;
    padding: 6px 4px;
    overflow-x: auto;
    scrollbar-width: none;
    background: #000;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.stories-bar::-webkit-scrollbar {
    display: none;
}

.story-avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    flex-shrink: 0;
}

.story-avatar-wrap .avatar {
    width: 50px;
    height: 50px;
    font-size: 18px;
}

.story-avatar-name {
    font-size: 9px;
    color: var(--text-sec);
    max-width: 52px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
}

.story-add-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--text-sec);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
}

.story-add-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

/* =============================================
   STORY VIEWER
   ============================================= */
.story-viewer {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #000;
    display: none;
    flex-direction: column;
}

.story-viewer.active {
    display: flex;
}

.story-progress-bar {
    display: flex;
    gap: 3px;
    padding: 8px 6px 0;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
}

.story-progress-segment {
    flex: 1;
    height: 3px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    overflow: hidden;
}

.story-progress-fill {
    height: 100%;
    background: #fff;
    width: 0%;
    transition: width 0.1s linear;
}

.story-progress-segment.done .story-progress-fill {
    width: 100%;
}

.story-progress-segment.active .story-progress-fill {
    width: 0%;
    animation: storyProgress linear forwards;
}

@keyframes storyProgress {
    from {
        width: 0%;
    }
    to {
        width: 100%;
    }
}

.story-header {
    position: absolute;
    top: 20px;
    left: 6px;
    right: 44px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
}

.story-header .avatar {
    width: 30px;
    height: 30px;
    font-size: 12px;
}

.story-header-name {
    font-weight: 700;
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

.story-header-time {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
}

.story-close {
    position: absolute;
    top: 18px;
    right: 6px;
    z-index: 10;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
}

.story-close svg {
    width: 16px;
    height: 16px;
    fill: #fff;
}

.story-content {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.story-content img,
.story-content video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.story-nav-zone {
    position: absolute;
    top: 60px;
    bottom: 60px;
    width: 30%;
    z-index: 8;
}

.story-nav-left {
    left: 0;
}

.story-nav-right {
    right: 0;
}

/* =============================================
   STORY UPLOAD
   ============================================= */
.story-upload-slides {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 0;
    scrollbar-width: none;
}

.story-upload-slides::-webkit-scrollbar {
    display: none;
}

.story-slide-preview {
    width: 80px;
    height: 120px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    border: 2px solid var(--border);
    background: var(--bg-card-alt);
}

.story-slide-preview img,
.story-slide-preview video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.story-slide-remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
}

.story-slide-add {
    width: 80px;
    height: 120px;
    border-radius: 8px;
    border: 2px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--text-sec);
    font-size: 12px;
    transition: all 0.2s;
}

.story-slide-add:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.story-slide-number {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =============================================
   ПОСТЫ (ГЛАВНАЯ)
   ============================================= */
.home-feed {
    flex: 1;
    overflow-y: auto;
    padding-bottom: calc(var(--nav-h) + var(--safe-b));
}

.post-card {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 14px;
}

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.post-author-name {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
}

.post-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
}

.post-text {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 10px;
    white-space: pre-wrap;
}

.post-image {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    max-height: 500px;
    object-fit: cover;
}

.post-actions {
    display: flex;
    gap: 20px;
    align-items: center;
}

.post-action {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text-sec);
    font-size: 14px;
    transition: color 0.15s;
}

.post-action:active {
    transform: scale(0.95);
}

.post-action.liked {
    color: var(--primary);
}

.post-action svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

/* =============================================
   ВИДЕО ЛЕНТА
   ============================================= */
.feed-container {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

.feed-container::-webkit-scrollbar {
    display: none;
}

.video-card {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: #000;
    overflow: hidden;
}

.video-element {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
}

.video-gradient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 35%);
}

.video-info {
    position: absolute;
    bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
    left: 14px;
    right: 76px;
    z-index: 5;
}

.video-author-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.video-author-name {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 4px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    cursor: pointer;
}

.video-desc {
    font-size: 14px;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    margin-bottom: 6px;
}

.video-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.video-tag {
    font-size: 13px;
    color: var(--primary-light);
    font-weight: 600;
}

.play-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 6;
}

.play-indicator svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.95);
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
}

.play-indicator.visible {
    opacity: 1;
}

.video-actions {
    position: absolute;
    right: 10px;
    bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.video-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.video-action-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
}

.video-action-btn:active {
    transform: scale(0.85);
}

.video-action-btn svg {
    width: 26px;
    height: 26px;
    fill: #fff;
}

.video-action.liked .video-action-btn svg {
    fill: var(--primary);
}

.video-action.saved .video-action-btn svg {
    fill: var(--premium);
}

.video-action-count {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

.avatar-follow-wrap {
    position: relative;
    margin-bottom: 6px;
}

.follow-plus {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid #000;
    transition: background 0.15s;
}

.follow-plus.followed {
    background: var(--success);
}

.video-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #121212, #000);
    gap: 12px;
}

/* =============================================
   НАВИГАЦИЯ
   ============================================= */
.bottom-nav-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--nav-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
}

.nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-muted);
    transition: color 0.2s;
}

.nav-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

.nav-btn span {
    font-size: 10px;
}

.nav-btn.active {
    color: var(--primary);
}

.upload-nav-btn {
    width: 44px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(168, 85, 247, 0.4);
}

.upload-nav-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
}

/* =============================================
   ПРОФИЛЬ
   ============================================= */
.profile-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
}

.profile-header {
    text-align: center;
    margin-bottom: 20px;
}

.profile-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
}

.profile-name {
    font-size: 21px;
    font-weight: 800;
}

.profile-username {
    color: var(--text-sec);
    font-size: 14px;
    margin-top: 4px;
}

.profile-bio {
    color: var(--text-sec);
    font-size: 14px;
    margin-top: 10px;
    max-width: 300px;
}

.profile-stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.stat-val {
    font-size: 20px;
    font-weight: 800;
}

.stat-label {
    font-size: 12px;
    color: var(--text-sec);
}

.profile-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin: 20px 0 16px;
}

.profile-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sec);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    cursor: pointer;
}

.profile-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.videos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    width: 100%;
}

.grid-video {
    aspect-ratio: 9 / 16;
    background: var(--bg-card-alt);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
}

.grid-video video,
.grid-video img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.grid-video-views {
    position: absolute;
    bottom: 6px;
    left: 6px;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

.grid-video-menu-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    z-index: 3;
}

.promo-tab-content {
    padding: 10px 0;
}

.promo-status {
    background: var(--bg-card-alt);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    margin-bottom: 16px;
}

/* =============================================
   МОДАЛКИ
   ============================================= */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
    backdrop-filter: blur(3px);
}

.modal {
    background: var(--bg-card);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px 20px calc(20px + var(--safe-b));
    animation: slideUp 0.3s ease;
    border-top: 1px solid var(--border);
}

@media (min-width: 768px) {
    .modal-overlay {
        align-items: center;
    }
    .modal {
        max-width: 520px;
        border-radius: 20px;
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
}

.modal-close {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-input);
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-close svg {
    width: 18px;
    height: 18px;
    fill: var(--text-sec);
}

/* =============================================
   ЗАГРУЗКА
   ============================================= */
.upload-dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    transition: all 0.2s;
    margin-bottom: 18px;
    cursor: pointer;
}

.upload-dropzone.has-video {
    border-color: var(--success);
    background: rgba(34, 197, 94, 0.05);
}

.upload-dropzone-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.upload-preview-video,
.upload-preview-img {
    width: 100%;
    max-height: 280px;
    border-radius: 10px;
    background: #000;
    object-fit: cover;
}

.upload-progress {
    width: 100%;
    height: 4px;
    background: var(--bg-input);
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0;
    display: none;
}

.upload-progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s;
}

.limit-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    margin-bottom: 16px;
}

.limit-badge.premium {
    border-color: var(--premium);
    background: rgba(251, 191, 36, 0.08);
    color: var(--premium);
}

/* =============================================
   КОММЕНТАРИИ
   ============================================= */
.comments-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 16px;
}

.comment-item {
    display: flex;
    gap: 10px;
}

.comment-body {
    flex: 1;
}

.comment-author {
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
}

.comment-time {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
}

.comment-text {
    font-size: 14px;
    line-height: 1.4;
    margin-top: 3px;
}

.comment-form {
    display: flex;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}

.comment-input {
    flex: 1;
    padding: 12px 16px;
    background: var(--bg-input);
    border-radius: 22px;
    color: #fff;
    font-size: 14px;
}

.comment-send {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.comment-send svg {
    width: 20px;
    height: 20px;
    fill: #fff;
}

/* =============================================
   ПРЕМИУМ
   ============================================= */
.premium-card {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(245, 158, 11, 0.04));
    border: 2px solid var(--premium);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
}

.premium-price {
    font-size: 34px;
    font-weight: 900;
    color: var(--premium);
    margin: 14px 0;
}

.premium-features {
    text-align: left;
    margin: 18px 0;
}

.premium-feature {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 14px;
}

.premium-badge-inline {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid var(--premium);
    color: var(--premium);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.telegram-box {
    background: rgba(42, 171, 238, 0.08);
    border: 1px solid rgba(42, 171, 238, 0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
}

/* =============================================
   TOAST
   ============================================= */
.toast {
    position: fixed;
    bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card-alt);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 600;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    animation: toastIn 0.3s ease;
    white-space: pre-line;
}

.toast.success {
    border-color: var(--success);
}

.toast.error {
    border-color: var(--error);
}

.toast.premium {
    border-color: var(--premium);
}

/* =============================================
   ПУСТЫЕ СОСТОЯНИЯ
   ============================================= */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    text-align: center;
}

.empty-icon {
    font-size: 56px;
    margin-bottom: 16px;
    opacity: 0.6;
}

.empty-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
}

.empty-text {
    font-size: 14px;
    color: var(--text-sec);
    max-width: 280px;
    line-height: 1.5;
}

.ban-icon {
    font-size: 80px;
    margin-bottom: 20px;
}

.ban-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--error);
    margin-bottom: 12px;
}

.spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

/* =============================================
   АДМИН
   ============================================= */
.admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--bg-card-alt);
    border-radius: 10px;
    margin-bottom: 8px;
    gap: 10px;
}

.admin-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-sec);
    margin: 16px 0 8px;
    text-transform: uppercase;
}

.promo-code-box {
    background: var(--bg-input);
    border: 1px dashed var(--primary);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: monospace;
    font-size: 16px;
    letter-spacing: 2px;
    text-align: center;
    margin: 10px 0;
}

.admin-tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: var(--bg-card-alt);
    border-radius: 10px;
    padding: 4px;
}

.admin-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sec);
    cursor: pointer;
    transition: all 0.2s;
}

.admin-tab.active {
    background: var(--primary);
    color: #fff;
}

/* =============================================
   ВЫБОР АВАТАРА
   ============================================= */
.avatar-picker {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 8px;
}

.avatar-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    overflow: hidden;
    flex-shrink: 0;
    border: 3px solid var(--border);
}

.avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
}

.avatar-option {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-input);
    border: 2px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-sec);
    transition: all 0.15s;
}

.avatar-option.selected {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
    transform: scale(1.05);
}

.avatar-option svg,
.avatar-option img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-option.photo-opt {
    font-size: 22px;
}

/* =============================================
   ПРИВЕТСТВИЕ
   ============================================= */
.welcome-title {
    font-size: clamp(52px, 13vw, 76px);
    font-weight: 900;
    background: linear-gradient(135deg, #a855f7, #c084fc, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: -2px;
}

.welcome-subtitle {
    color: var(--text-sec);
    font-size: 15px;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
}

.welcome-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    margin-top: 40px;
}

/* =============================================
   АНИМАЦИИ
   ============================================= */
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        transform: translateY(60px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes toastIn {
    from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes heartPop {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    15% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
    }
    30% {
        transform: translate(-50%, -50%) scale(0.95);
    }
    45%, 80% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0;
    }
}

.heart-pop {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 110px;
    height: 110px;
    pointer-events: none;
    z-index: 50;
    animation: heartPop 0.9s ease forwards;
}

.heart-pop svg {
    width: 100%;
    height: 100%;
    fill: var(--primary);
    filter: drop-shadow(0 4px 20px rgba(168, 85, 247, 0.8));
}
</style>
</head>

        type = type || '';

            x.remove();

        e.className = 'toast ' + type;

    timeAgo: function(ts) {
        if (!ts) return '';
        var m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
        if (m < 1) return 'только что';
        if (m < 60) return m + ' мин';
        var h = Math.floor(m / 60);
        if (h < 24) return h + ' ч';
        var d = Math.floor(h / 24);
        return d < 7 ? d + ' дн' : new Date(ts).toLocaleDateString('ru-RU');

        for (var i = 0; i < 6; i++) {

    hash: function(str) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(h) {
            return Array.from(new Uint8Array(h)).map(function(x) {
                return x.toString(16).padStart(2, '0');
            }).join('');
        });
    },

    compressImage: function(file, sz) {
        sz = sz || 400;
        return new Promise(function(res, rej) {
            var r = new FileReader();
            r.onload = function(e) {
                var i = new Image();
                i.onload = function() {
                    var c = document.createElement('canvas');
                    c.width = sz;
                    c.height = sz;
                    var ctx = c.getContext('2d');
                    var s = Math.min(i.width, i.height);
                    ctx.drawImage(i, (i.width - s) / 2, (i.height - s) / 2, s, s, 0, 0, sz, sz);
                    c.toBlob(function(b) {
                        res(b);
                    }, 'image/jpeg', 0.85);
                };
                i.onerror = rej;
                i.src = e.target.result;
            };
            r.onerror = rej;
            r.readAsDataURL(file);
        });
    },

        }).catch(function() {
            return null;
        });
    },

                }).then(function(tr) {
                    if (!tr.error) thumbUrl = storageUrl('thumbnails', tn);
                });
            }
            return Promise.resolve();
        }).then(function() {
            return sb.from('videos').insert({
                user_id: p.userId,
                username: p.username,
                title: p.title,
                description: p.description,
                tags: p.tags,
                duration: p.duration,
                video_url: videoUrl,
                thumbnail_url: thumbUrl
            });

            if (mr.error) throw new Error('Ошибка сохранения');
            return sb.from('uploads').upsert({
                user_id: p.userId,
                uploaded_at: new Date().toISOString()
            });
        }).then(function() {
            return { ok: true };
        }).catch(function(e) {
            return { ok: false, error: e.message };

    deleteVideo: function(videoId) {

    redeemPromo: function(code, userId) {
        if (!sb) return Promise.resolve({ ok: false, error: 'Нет соединения' });
        var cl = (code || '').trim().toUpperCase().replace(/\s/g, '');
        var clnd = cl.replace(/-/g, '');
        return sb.from('promos').select('*').then(function(pr) {
            var promos = pr.data || [];
            var found = null;
            for (var i = 0; i < promos.length; i++) {
                var s = promos[i].code.trim().toUpperCase().replace(/\s/g, '');
                if (s === cl || s.replace(/-/g, '') === clnd) {
                    found = promos[i];
                    break;
                }
            }
            if (!found) return { ok: false, error: 'Промокод не найден' };
            if (found.used) return { ok: false, error: 'Уже использован' };
            return sb.from('promos').update({
                used: true,
                used_by: userId,
                used_at: new Date().toISOString()
            }).eq('id', found.id).then(function() {
                return Premium.activate(userId, found.days).then(function() {
                    return { ok: true, days: found.days };
                });
            });
        }).catch(function(e) {
            return { ok: false, error: e.message };

        });

    getAllPromos: function() {
        if (!sb) return Promise.resolve([]);
        return sb.from('promos').select('*').order('created_at', { ascending: false }).then(function(r) {
            return r.data || [];
        }).catch(function() {
            return [];
        });
    },

    getActiveStories: function() {
        if (!sb) return Promise.resolve([]);
        var cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        return sb.from('stories').select('*, profiles(id,username,display_name,avatar_type,avatar_index,avatar_url,premium_until)').gte('created_at', cutoff).order('created_at', { ascending: false }).then(function(sr) {
            var stories = sr.data || [];
            var result = [];
            var chain = Promise.resolve();
            stories.forEach(function(s) {
                chain = chain.then(function() {
                    return sb.from('story_slides').select('*').eq('story_id', s.id).order('slide_order', { ascending: true }).then(function(slr) {
                        if (slr.data && slr.data.length > 0) {
                            s.slides = slr.data;
                            s.author = s.profiles;
                            result.push(s);
                        }
                    });
                });
            });
            return chain.then(function() {
                return result;
            });
        }).catch(function(e) {
            console.error(e);
            return [];
        });
    },

    createStory: function(p) {
        if (!sb) return Promise.resolve({ ok: false, error: 'Нет соединения' });
        return sb.from('stories').insert({
            user_id: p.userId,
            username: p.username
        }).select().single().then(function(storyResult) {
            if (storyResult.error) throw new Error(storyResult.error.message);
            var story = storyResult.data;
            var chain = Promise.resolve();
            p.slides.forEach(function(sl, i) {
                chain = chain.then(function() {
                    var ext = sl.type === 'video' ? 'mp4' : 'jpg';
                    var fname = story.id + '_' + i + '.' + ext;
                    var ct = sl.type === 'video' ? (sl.blob.type || 'video/mp4') : 'image/jpeg';
                    return sb.storage.from('stories').upload(fname, sl.blob, {
                        contentType: ct,
                        upsert: true
                    }).then(function(uploadResult) {
                        if (uploadResult.error) throw new Error('Ошибка слайда ' + (i + 1) + ': ' + uploadResult.error.message);
                        var publicUrl = storageUrl('stories', fname);
                        var slideDuration = sl.type === 'video' ? sl.duration : 5;
                        return sb.from('story_slides').insert({
                            story_id: story.id,
                            slide_order: i,
                            media_type: sl.type,
                            media_url: publicUrl,
                            duration: slideDuration
                        });
                    }).then(function(slideInsert) {
                        if (slideInsert.error) throw new Error('Ошибка сохранения слайда ' + (i + 1) + ': ' + slideInsert.error.message);
                    });
                });
            });
            return chain.then(function() {
                return { ok: true };
            });
        }).catch(function(e) {
            return { ok: false, error: e.message };
        });
    }
};

/* =============================================
   РЕГИСТРАЦИЯ АВАТАРОВ
   ============================================= */
var Reg = {
    avatarType: 'letter',
    avatarIndex: 0,
    avatarBlob: null,

    buildPicker: function() {
        var opts = document.getElementById('avatar-options');
        if (!opts) return;
        var html = '<div class="avatar-option selected" data-type="letter" onclick="Reg.select(\'letter\')">A</div>';
        for (var i = 0; i < CLASSIC_AVATARS.length; i++) {
            html += '<div class="avatar-option" data-type="classic" data-index="' + i + '" onclick="Reg.select(\'classic\',' + i + ')">' + CLASSIC_AVATARS[i] + '</div>';
        }
        html += '<div class="avatar-option photo-opt" data-type="photo" onclick="Reg.openPhotoPicker()">📷</div>';
        opts.innerHTML = html;
        this.avatarType = 'letter';
        this.avatarIndex = 0;
        this.avatarBlob = null;
        this.updatePreview();
    },

    select: function(type, idx) {
        if (type === 'photo') {
            this.openPhotoPicker();
            return;
        }
        this.avatarType = type;
        this.avatarIndex = idx || 0;
        if (type === 'classic') this.avatarBlob = null;
        var self = this;
        document.querySelectorAll('.avatar-option').forEach(function(o) {
            var isSelected = (o.dataset.type === type) && (type !== 'classic' || parseInt(o.dataset.index) === self.avatarIndex);
            o.classList.toggle('selected', isSelected);
        });
        this.updatePreview();
    },

    openPhotoPicker: function() {
        document.getElementById('avatar-file').click();
    },

    pickPhoto: function(input) {
        var self = this;
        var f = input.files[0];
        if (!f) return;
        Utils.compressImage(f, 400).then(function(blob) {
            self.avatarBlob = blob;
            self.avatarType = 'photo';
            document.querySelectorAll('.avatar-option').forEach(function(o) {
                o.classList.toggle('selected', o.dataset.type === 'photo');
            });
            self.updatePreview();
            Utils.toast('Фото загружено! 📸', 'success');
        }).catch(function() {
            Utils.toast('Ошибка', 'error');
        });
        input.value = '';
    },

    onNameChange: function() {
        if (this.avatarType === 'letter') this.updatePreview();
    },

    updatePreview: function() {
        var p = document.getElementById('avatar-preview');
        if (!p) return;
        if (this.avatarType === 'photo' && this.avatarBlob) {
            p.innerHTML = '<img src="' + URL.createObjectURL(this.avatarBlob) + '" alt="">';
        } else if (this.avatarType === 'classic') {
            p.innerHTML = CLASSIC_AVATARS[this.avatarIndex] || CLASSIC_AVATARS[0];
        } else {
            var n = document.getElementById('reg-displayname');
            p.textContent = (n && n.value.trim() ? n.value.trim()[0] : '?').toUpperCase();
        }
    }
};

/* =============================================
   АУТЕНТИФИКАЦИЯ
   ============================================= */
var Auth = {
    user: null,
    isGuest: false,
    session: null,

    register: function() {
        var username = document.getElementById('reg-username').value.trim();
        var password = document.getElementById('reg-password').value;
        var display = document.getElementById('reg-displayname').value.trim();
        var bio = document.getElementById('reg-bio').value.trim();
        if (username.length < 3) { Utils.toast('Имя минимум 3 символа', 'error'); return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { Utils.toast('Только латиница, цифры и _', 'error'); return; }
        if (password.length < 6) { Utils.toast('Пароль минимум 6 символов', 'error'); return; }
        if (!display) { Utils.toast('Введи отображаемое имя', 'error'); return; }
        var btn = document.getElementById('reg-submit');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        var self = this;
        DB.createUser({
            username: username,
            password: password,
            display_name: display,
            bio: bio,
            avatar_type: Reg.avatarType,
            avatar_index: Reg.avatarIndex,
            avatar_blob: Reg.avatarBlob
        }).then(function(res) {
            if (!res.ok) {
                Utils.toast(res.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Создать аккаунт';
                return;
            }
            self.user = res.user;
            self.session = { user_id: res.user.id, username: username, password: password };
            localStorage.setItem('shadow_session', JSON.stringify(self.session));
            Utils.toast('Аккаунт создан! 🎉', 'success');
            App.startApp();
        }).catch(function(e) {
            Utils.toast('Ошибка: ' + e.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Создать аккаунт';
        });
    },

    login: function() {
        var username = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        if (!username || !password) { Utils.toast('Введи имя и пароль', 'error'); return; }
        var btn = document.getElementById('login-submit');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        var self = this;
        DB.findUser(username, password).then(function(res) {
            if (!res.ok) {
                Utils.toast(res.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Войти';
                return;
            }
            if (res.user.banned) {
                App.showBanScreen(res.user);
                return;
            }
            self.user = res.user;
            self.session = { user_id: res.user.id, username: username, password: password };
            localStorage.setItem('shadow_session', JSON.stringify(self.session));
            Utils.toast('С возвращением, ' + res.user.display_name + '!', 'success');
            App.startApp();
        }).catch(function(e) {
            Utils.toast('Ошибка: ' + e.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Войти';
        });
    },

    restoreSession: function() {
        var raw = localStorage.getItem('shadow_session');
        if (!raw) return Promise.resolve(false);
        try {
            this.session = JSON.parse(raw);
            if (!this.session.user_id) return Promise.resolve(false);
            var self = this;
            return DB.getUserById(this.session.user_id).then(function(u) {
                if (!u) return false;
                if (u.banned) {
                    App.showBanScreen(u);
                    return false;
                }
                return DB.findUser(u.username, self.session.password).then(function(chk) {
                    if (!chk.ok) {
                        localStorage.removeItem('shadow_session');
                        return false;
                    }
                    self.user = u;
                    return true;
                });
            }).catch(function() {
                return false;
            });
        } catch (e) {
            return Promise.resolve(false);
        }
    },

    logout: function() {
        if (!confirm('Выйти?')) return;
        this.user = null;
        this.session = null;
        this.isGuest = false;
        localStorage.removeItem('shadow_session');
        App.go('welcome');
    }
};

var Limits = {
    weekUploads: function(uid) {
        return DB.getUploads(uid).then(function(uploads) {
            var weekAgo = Date.now() - CONFIG.WEEK_MS;
            return uploads.filter(function(t) { return t > weekAgo; }).length;
        });
    },
    canUpload: function(user) {
        var limit = Premium.isActive(user) ? CONFIG.PREMIUM_LIMIT : CONFIG.FREE_LIMIT;
        return this.weekUploads(user.id).then(function(count) { return count < limit; });
    },
    remaining: function(user) {
        var limit = Premium.isActive(user) ? CONFIG.PREMIUM_LIMIT : CONFIG.FREE_LIMIT;
        return this.weekUploads(user.id).then(function(count) { return Math.max(0, limit - count); });
    },
    maxMB: function(user) {
        return Premium.isActive(user) ? CONFIG.PREMIUM_MAX_MB : CONFIG.FREE_MAX_MB;
    }
};

/* =============================================
   STORIES

var Stories = {
    allStories: [],
    currentStoryIdx: 0,
    currentSlideIdx: 0,
    timer: null,
    _vs: null,
    _vu: null,
    slides: [],

    loadBar: function() {
        var container = document.getElementById('stories-bar-container');
        if (!container) return;
        var self = this;
        DB.getActiveStories().then(function(stories) {
            self.allStories = stories;
            var html = '<div class="stories-bar">';
            if (Auth.user && !Auth.isGuest) {
                html += '<div class="story-avatar-wrap" onclick="Stories.openUpload()"><div class="story-add-btn">+</div><div class="story-avatar-name">Моя история</div></div>';
            }
            var seen = {};
            for (var i = 0; i < self.allStories.length; i++) {
                var s = self.allStories[i];
                if (seen[s.user_id]) continue;
                seen[s.user_id] = true;
                var author = s.author || {};
                var isMe = Auth.user && Auth.user.id === s.user_id;
                html += '<div class="story-avatar-wrap" onclick="Stories.openViewer(\'' + s.user_id + '\')">';
                html += '<div class="avatar has-story ' + (Premium.isActive(author) ? 'premium' : 'regular') + '">' + avatarContent(author) + '</div>';
                html += '<div class="story-avatar-name">' + Utils.esc(isMe ? 'Вы' : (author.display_name || '?')) + '</div>';
                html += '</div>';
            }
            html += '</div>';
            container.innerHTML = html;
        });
    },

    openViewer: function(userId) {
        var stories = this.allStories.filter(function(s) { return s.user_id === userId; });
        if (!stories.length) { Utils.toast('История не найдена', 'error'); return; }
        this.currentStoryIdx = 0;
        this.currentSlideIdx = 0;
        this._vs = stories;
        var self = this;
        var authorPromise = stories[0].author ? Promise.resolve(stories[0].author) : Utils.getProfile(userId);
        authorPromise.then(function(author) {
            self._vu = author;
            document.getElementById('story-viewer').classList.add('active');
            self.renderSlide();
        });
    },

    renderSlide: function() {
        var story = this._vs[this.currentStoryIdx];
        if (!story) { this.closeViewer(); return; }
        var slide = story.slides[this.currentSlideIdx];
        if (!slide) { this.closeViewer(); return; }
        var prog = document.getElementById('story-progress');
        var progHtml = '';
        for (var i = 0; i < story.slides.length; i++) {
            var cls = 'story-progress-segment';
            if (i < this.currentSlideIdx) cls += ' done';
            else if (i === this.currentSlideIdx) cls += ' active';
            var dur = slide.duration || 5;
            progHtml += '<div class="' + cls + '" style="' + (i === this.currentSlideIdx ? 'animation-duration:' + dur + 's' : '') + '"><div class="story-progress-fill"></div></div>';
        }
        prog.innerHTML = progHtml;
        var user = this._vu || {};
        document.getElementById('story-header').innerHTML = '<div class="avatar ' + (Premium.isActive(user) ? 'premium' : 'regular') + '">' + avatarContent(user) + '</div><div><div class="story-header-name">' + Utils.esc(user.display_name || '?') + ' ' + Premium.badge(user) + '</div><div class="story-header-time">' + Utils.timeAgo(story.created_at) + '</div></div>';
        var content = document.getElementById('story-content');
        if (slide.media_type === 'video') {
            content.innerHTML = '<video src="' + slide.media_url + '" autoplay muted playsinline style="max-width:100%;max-height:100%;object-fit:contain;"></video>';
        } else {
            content.innerHTML = '<img src="' + slide.media_url + '" alt="" style="max-width:100%;max-height:100%;object-fit:contain;">';
        }
        var self = this;
        clearTimeout(this.timer);
        this.timer = setTimeout(function() { self.nextSlide(); }, (slide.duration || 5) * 1000);
    },

    nextSlide: function() {
        clearTimeout(this.timer);
        var story = this._vs[this.currentStoryIdx];
        if (this.currentSlideIdx < story.slides.length - 1) {
            this.currentSlideIdx++;
            this.renderSlide();
        } else if (this.currentStoryIdx < this._vs.length - 1) {
            this.currentStoryIdx++;
            this.currentSlideIdx = 0;
            this.renderSlide();
        } else {
            this.closeViewer();
        }
    },

    prevSlide: function() {
        clearTimeout(this.timer);
        if (this.currentSlideIdx > 0) {
            this.currentSlideIdx--;
            this.renderSlide();
        } else if (this.currentStoryIdx > 0) {
            this.currentStoryIdx--;
            this.currentSlideIdx = 0;
            this.renderSlide();
        } else {
            this.renderSlide();
        }
    },

    closeViewer: function() {
        clearTimeout(this.timer);
        document.getElementById('story-viewer').classList.remove('active');
        document.getElementById('story-content').innerHTML = '';
    },

    openUpload: function() {
        if (!Auth.user || Auth.isGuest) { Utils.toast('Войди в аккаунт', 'error'); return; }
        this.slides = [];
        this.renderUploadModal();
    },

    renderUploadModal: function() {
        var max = CONFIG.MAX_STORY_SLIDES;
        var slidesHtml = '';
        for (var i = 0; i < this.slides.length; i++) {
            var sl = this.slides[i];
            var url = URL.createObjectURL(sl.blob);
            var preview = sl.type === 'video'
                ? '<video src="' + url + '" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>'
                : '<img src="' + url + '" style="width:100%;height:100%;object-fit:cover;">';
            slidesHtml += '<div class="story-slide-preview"><div class="story-slide-number">' + (i + 1) + '</div>' + preview + '<button class="story-slide-remove" onclick="Stories.removeSlide(' + i + ')">✕</button></div>';
        }
        if (this.slides.length < max) {
            slidesHtml += '<div class="story-slide-add" onclick="document.getElementById(\'story-file-input\').click()"><div style="font-size:24px;">+</div><div>Добавить</div></div>';
        }
        App.modal('<div class="modal-header"><div class="modal-title">📸 Новая история</div><button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div><div style="font-size:13px;color:var(--text-sec);margin-bottom:12px;">Максимум ' + max + ' слайда · живут 24 часа</div><input type="file" id="story-file-input" accept="image/*,video/*" multiple style="display:none;" onchange="Stories.pickFiles(this)"><div class="story-upload-slides">' + slidesHtml + '</div><button class="btn btn-primary" style="width:100%;margin-top:16px;" id="story-submit" onclick="Stories.submit()" ' + (this.slides.length === 0 ? 'disabled' : '') + '>Опубликовать (' + this.slides.length + '/' + max + ')</button>');
    },

    pickFiles: function(input) {
        var self = this;
        var files = Array.from(input.files);
        var maxMB = Limits.maxMB(Auth.user);
        var chain = Promise.resolve();
        files.forEach(function(file) {
            chain = chain.then(function() {
                if (self.slides.length >= CONFIG.MAX_STORY_SLIDES) {
                    Utils.toast('Максимум ' + CONFIG.MAX_STORY_SLIDES + ' слайда', 'error');
                    return Promise.resolve();
                }
                if (file.size > maxMB * 1024 * 1024) {
                    Utils.toast('Файл слишком большой', 'error');
                    return Promise.resolve();
                }
                var isVideo = file.type.startsWith('video/');
                var duration = 5;
                if (isVideo) {
                    return new Promise(function(resolve) {
                        var url = URL.createObjectURL(file);
                        var v = document.createElement('video');
                        v.preload = 'metadata';
                        v.src = url;
                        v.onloadedmetadata = function() {
                            duration = Math.min(Math.round(v.duration), CONFIG.MAX_VIDEO_SEC);
                            URL.revokeObjectURL(url);
                            self.slides.push({ blob: file, type: 'video', duration: duration });
                            resolve();
                        };
                        v.onerror = function() {
                            URL.revokeObjectURL(url);
                            resolve();
                        };
                    });
                } else {
                    self.slides.push({ blob: file, type: 'photo', duration: 5 });
                    return Promise.resolve();
                }
            });
        });
        chain.then(function() {
            input.value = '';
            self.renderUploadModal();
        });
    },

    removeSlide: function(idx) {
        this.slides.splice(idx, 1);
        this.renderUploadModal();
    },

    submit: function() {
        if (!this.slides.length) return;
        var btn = document.getElementById('story-submit');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        DB.createStory({
            userId: Auth.user.id,
            username: Auth.user.username,
            slides: this.slides
        }).then(function(res) {
            if (!res.ok) {
                Utils.toast(res.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Опубликовать';
                return;
            }
            App.closeModal();
            Utils.toast('История опубликована! 📸', 'success');
            Stories.loadBar();
        });
    }
};

   ВИДЕО ЛЕНТА

var Feed = {
    videos: [],
    observer: null,
    currentCard: null,

    load: function() {
        var self = this;
        return DB.getFeed(Auth.user ? Auth.user.id : null).then(function(videos) {
            self.videos = videos;
            var following = {};
            var followPromise = Promise.resolve();
            if (Auth.user) {
                followPromise = sb.from('follows').select('following_id').eq('follower_id', Auth.user.id).then(function(r) {
                    (r.data || []).forEach(function(f) { following[f.following_id] = true; });
                }).catch(function() {});
            }
            return followPromise.then(function() {
                for (var i = 0; i < self.videos.length; i++) {
                    var v = self.videos[i];
                    var score = Math.random() * 25;
                    if (following[v.user_id]) score += 40;
                    if (Premium.isActive(v.author)) score += 25;
                    var ageDays = (Date.now() - new Date(v.created_at).getTime()) / 86400000;
                    score += Math.max(0, 60 - ageDays * 15);
                    v._score = score;
                }
                self.videos.sort(function(a, b) { return b._score - a._score; });
            });
        });
    },

    renderInto: function(containerId) {
        var container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '<div class="video-card"><div class="video-empty"><div class="spinner" style="width:40px;height:40px;border-width:4px;"></div></div></div>';
        var self = this;
        this.load().then(function() {
            container.innerHTML = '';
            if (!self.videos.length) {
                container.innerHTML = '<div class="video-card"><div class="video-empty"><div style="font-size:56px;">🎬</div><div style="font-size:18px;font-weight:700;">Лента пуста</div></div></div>';
                return;
            }
            var chain = Promise.resolve();
            self.videos.forEach(function(v) {
                chain = chain.then(function() { return self.createCard(v, container); });
            });
            return chain.then(function() { self.setupAutoplay(container); });
        }).catch(function() {
            container.innerHTML = '<div class="video-card"><div class="video-empty"><div style="font-size:48px;">😞</div></div></div>';
        });
    },

    createCard: function(v, container) {
        var author = v.author || {};
        var self = this;
        return DB.isFollowing(v.user_id, Auth.user ? Auth.user.id : null).then(function(isFollowing) {
            var showFollow = Auth.user && !Auth.isGuest && Auth.user.id !== v.user_id;
            var card = document.createElement('div');
            card.className = 'video-card';
            card.dataset.id = v.id;
            var videoHtml = v.video_url
                ? '<video class="video-element" src="' + v.video_url + '" loop playsinline preload="metadata"' + (v.thumbnail_url ? ' poster="' + v.thumbnail_url + '"' : '') + '></video>'
                : '<div class="video-empty"><div style="font-size:48px;">🎬</div></div>';
            var html = videoHtml;
            html += '<div class="video-gradient"></div>';
            html += '<div class="play-indicator">' + Icons.play() + '</div>';
            html += '<div class="video-info"><div class="video-author-row">';
            html += '<div class="avatar small ' + (Premium.isActive(author) ? 'premium' : 'regular') + '">' + avatarContent(author) + '</div>';
            html += '<div class="video-author-name" onclick="App.viewProfile(\'' + v.user_id + '\')">@' + Utils.esc(author.username || v.username) + ' ' + Premium.badge(author) + '</div>';
            html += '</div><div class="video-desc">' + Utils.esc(v.title) + '</div>';
            html += '<div class="video-tags">' + (v.tags || []).map(function(t) { return '<span class="video-tag">#' + Utils.esc(t) + '</span>'; }).join('') + '</div></div>';
            html += '<div class="video-actions"><div class="avatar-follow-wrap">';
            html += '<div class="avatar big ' + (Premium.isActive(author) ? 'premium' : 'regular') + '" onclick="App.viewProfile(\'' + v.user_id + '\')">' + avatarContent(author) + '</div>';
            if (showFollow) {
                html += '<button class="follow-plus ' + (isFollowing ? 'followed' : '') + '" data-follow-btn="' + v.user_id + '" onclick="event.stopPropagation();Feed.toggleFollow(\'' + v.user_id + '\')">' + (isFollowing ? '✓' : '+') + '</button>';
            }
            html += '</div>';
            html += '<div class="video-action ' + (v.liked_by_me ? 'liked' : '') + '" onclick="Feed.like(\'' + v.id + '\')"><div class="video-action-btn">' + Icons.heart() + '</div><span class="video-action-count" id="likes-' + v.id + '">' + Utils.fmtNum(v.likes) + '</span></div>';
            html += '<div class="video-action" onclick="Comments.open(\'' + v.id + '\')"><div class="video-action-btn">' + Icons.comment() + '</div><span class="video-action-count">' + Utils.fmtNum(v.comment_count) + '</span></div>';
            html += '<div class="video-action" onclick="Feed.share()"><div class="video-action-btn">' + Icons.share() + '</div></div>';
            html += '<div class="video-action ' + (v.saved_by_me ? 'saved' : '') + '" onclick="Feed.save(\'' + v.id + '\')"><div class="video-action-btn">' + Icons.bookmark() + '</div></div>';
            html += '</div>';
            card.innerHTML = html;
            card.addEventListener('click', function(e) {
                if (e.target.closest('.video-action') || e.target.closest('.video-info') || e.target.closest('.avatar-follow-wrap')) return;
                self.togglePlayVideo(this);
            });
            container.appendChild(card);
        });
    },

    toggleFollow: function(userId) {
        if (!Auth.user) { Utils.toast('Войди', 'error'); return; }
        DB.toggleFollow(userId, Auth.user.id).then(function(res) {
            if (!res) return;
            document.querySelectorAll('[data-follow-btn="' + userId + '"]').forEach(function(btn) {
                btn.textContent = res.following ? '✓' : '+';
                btn.classList.toggle('followed', res.following);
            });
            Utils.toast(res.following ? 'Подписался! 🎯' : 'Отписался', 'success');
        });
    },

    setupAutoplay: function(container) {
        var self = this;
        if (this.observer) this.observer.disconnect();
        this.observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                var video = entry.target.querySelector('video');
                if (!video) return;
                if (entry.isIntersecting) {
                    self.currentCard = entry.target;
                    video.play().catch(function() {});
                    self.setPS(entry.target, true);
                } else {
                    video.pause();
                    video.currentTime = 0;
                }
            });
        }, { threshold: 0.6, root: container });
        container.querySelectorAll('.video-card').forEach(function(c) { self.observer.observe(c); });
    },

    togglePlayVideo: function(card) {
        var video = card.querySelector('video');
        if (!video) return;
        if (video.paused) {
            video.play().catch(function() {});
            this.setPS(card, true);
        } else {
            video.pause();
            this.setPS(card, false);
        }
    },

    setPS: function(card, isPlaying) {
        var indicator = card.querySelector('.play-indicator');
        if (indicator) indicator.classList.toggle('visible', !isPlaying);
    },

    toggleCurrent: function() {
        if (this.currentCard) this.togglePlayVideo(this.currentCard);
    },

    like: function(videoId) {
        if (!Auth.user) { Utils.toast('Войди', 'error'); return; }
        var v = this.videos.find(function(x) { return x.id === videoId; });
        if (!v) return;
        var self = this;
        DB.toggleLike(videoId, Auth.user.id).then(function(res) {
            if (!res) return;
            v.liked_by_me = res.liked;
            v.likes = res.liked ? v.likes + 1 : Math.max(0, v.likes - 1);
            if (res.liked) self.showHeart(videoId);
            var card = document.querySelector('.video-card[data-id="' + videoId + '"]');
            if (card) {
                var action = card.querySelector('.video-action');
                action.classList.toggle('liked', v.liked_by_me);
                document.getElementById('likes-' + videoId).textContent = Utils.fmtNum(v.likes);
            }
        });
    },

    showHeart: function(videoId) {
        var card = document.querySelector('.video-card[data-id="' + videoId + '"]');
        if (!card) return;
        var heart = document.createElement('div');
        heart.className = 'heart-pop';
        heart.innerHTML = Icons.heart();
        card.appendChild(heart);
        setTimeout(function() { heart.remove(); }, 900);
    },

    save: function(videoId) {
        if (!Auth.user) { Utils.toast('Войди', 'error'); return; }
        var v = this.videos.find(function(x) { return x.id === videoId; });
        if (!v) return;
        DB.toggleSave(videoId, Auth.user.id).then(function(res) {
            if (!res) return;
            v.saved_by_me = res.saved;
            var card = document.querySelector('.video-card[data-id="' + videoId + '"]');
            if (card) card.querySelectorAll('.video-action')[3].classList.toggle('saved', v.saved_by_me);
            Utils.toast(v.saved_by_me ? 'Сохранено ✨' : 'Удалено', 'success');
        });
    },

    share: function() {
        if (navigator.share) {
            navigator.share({ title: 'Shadow', url: location.href }).catch(function() {});
        } else {
            Utils.toast('Ссылка скопирована 📋', 'success');
        }
    },

    jumpTo: function(videoId) {
        App.nav('feed');
        setTimeout(function() {
            var card = document.querySelector('.video-card[data-id="' + videoId + '"]');
            if (card) card.scrollIntoView({ behavior: 'smooth' });
        }, 200);
    }
};

/* =============================================
   КОММЕНТАРИИ
   ============================================= */
var Comments = {
    open: function(videoId) {
        App.modal('<div class="modal-header"><div class="modal-title">Загрузка...</div><button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div><div class="spinner" style="margin:20px auto;"></div>');
        DB.getComments(videoId).then(function(comments) {
            var list = '';
            if (!comments.length) {
                list = '<div class="empty-state" style="padding:30px;"><div class="empty-text">Комментариев пока нет 💬</div></div>';
            } else {
                for (var i = 0; i < comments.length; i++) {

    openVideo: function() {
        if (!Auth.user || Auth.isGuest) { Utils.toast('Войди в аккаунт', 'error'); return; }

        Limits.canUpload(Auth.user).then(function(canUpload) {

            self.file = null;
            self.duration = 0;
            Limits.remaining(Auth.user).then(function(rem) {
                var lim = Premium.isActive(Auth.user) ? CONFIG.PREMIUM_LIMIT : CONFIG.FREE_LIMIT;
                var maxMB = Limits.maxMB(Auth.user);
                var isPrem = Premium.isActive(Auth.user);
                App.modal('<div class="modal-header"><div class="modal-title">Загрузить видео</div><button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div><div class="limit-badge ' + (isPrem ? 'premium' : '') + '">📤 Осталось: ' + rem + '/' + lim + ' · Макс ' + maxMB + ' МБ</div><div class="upload-dropzone" id="dropzone" onclick="document.getElementById(\'file-input\').click()"><div class="upload-dropzone-icon">📹</div><div style="font-weight:600;margin-bottom:4px;">Выбери видео</div><div style="font-size:13px;color:var(--text-sec);">До ' + CONFIG.MAX_VIDEO_SEC + ' сек · до ' + maxMB + ' МБ</div><input type="file" id="file-input" accept="video/*" style="display:none;" onchange="Upload.pickFile(this)"></div><div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div><div id="video-preview-wrap" style="display:none;margin-bottom:16px;"><video id="upload-preview" class="upload-preview-video" muted playsinline loop autoplay></video><div style="font-size:12px;color:var(--text-sec);margin-top:6px;text-align:center;" id="duration-label"></div></div><div class="form-group"><label class="form-label">Название *</label><input type="text" class="form-input" id="upload-title" maxlength="100"></div><div class="form-group"><label class="form-label">Описание и теги</label><textarea class="form-textarea" id="upload-desc" maxlength="300"></textarea></div><button class="btn btn-primary" style="width:100%;" id="upload-btn" onclick="Upload.submit()" disabled>Загрузить</button>');
            });
        });
    },

    pickFile: function(input) {
        var self = this;
        var f = input.files[0];
        if (!f) return;
        if (!f.type.startsWith('video/')) { Utils.toast('Выбери видеофайл', 'error'); return; }
        var maxMB = Limits.maxMB(Auth.user);
        if (f.size > maxMB * 1024 * 1024) { Utils.toast('Файл больше ' + maxMB + ' МБ', 'error'); return; }
        var url = URL.createObjectURL(f);
        var testVideo = document.createElement('video');
        testVideo.preload = 'metadata';
        testVideo.src = url;
        testVideo.onloadedmetadata = function() {
            URL.revokeObjectURL(url);
            if (testVideo.duration > CONFIG.MAX_VIDEO_SEC) {
                Utils.toast('Видео ' + Math.round(testVideo.duration) + ' сек. Макс ' + CONFIG.MAX_VIDEO_SEC + '!', 'error');
                return;
            }
            self.file = f;
            self.duration = testVideo.duration;
            document.getElementById('upload-preview').src = URL.createObjectURL(f);
            document.getElementById('video-preview-wrap').style.display = 'block';
            document.getElementById('dropzone').classList.add('has-video');
            document.getElementById('dropzone').querySelector('.upload-dropzone-icon').textContent = '✅';
            document.getElementById('duration-label').textContent = '⏱ ' + Math.round(self.duration) + ' сек';
            document.getElementById('upload-btn').disabled = false;
        };
    },

    makeThumbnail: function(file) {
        return new Promise(function(resolve) {
            var video = document.createElement('video');
            video.preload = 'metadata';
            video.muted = true;
            video.src = URL.createObjectURL(file);
            video.onloadeddata = function() {
                video.currentTime = Math.min(1, video.duration / 2);
            };
            video.onseeked = function() {
                var canvas = document.createElement('canvas');
                canvas.width = 360;
                canvas.height = 640;
                var ctx = canvas.getContext('2d');
                var ratio = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
                var w = video.videoWidth * ratio;
                var h = video.videoHeight * ratio;
                ctx.drawImage(video, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                canvas.toBlob(function(blob) {
                    URL.revokeObjectURL(video.src);
                    resolve(blob);
                }, 'image/jpeg', 0.8);
            };
            video.onerror = function() { resolve(null); };
        });
    },

    submit: function() {
        var title = document.getElementById('upload-title').value.trim();
        var desc = document.getElementById('upload-desc').value.trim();
        if (!this.file || !title) { Utils.toast('Заполни название', 'error'); return; }
        var btn = document.getElementById('upload-btn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        var prog = document.getElementById('upload-progress');
        var bar = document.getElementById('upload-progress-bar');
        prog.style.display = 'block';
        bar.style.width = '30%';
        var self = this;
        this.makeThumbnail(this.file).then(function(thumb) {
            bar.style.width = '60%';
            var tagsMatch = desc.match(/#([a-zA-Zа-яА-ЯёЁ0-9_]+)/g) || [];
            var tags = tagsMatch.map(function(t) { return t.slice(1); });
            return DB.uploadVideo({
                userId: Auth.user.id,
                username: Auth.user.username,
                title: title,
                description: desc,
                tags: tags,
                duration: Math.round(self.duration),
                videoBlob: self.file,
                thumbBlob: thumb
            });
        }).then(function(res) {
            bar.style.width = '100%';
            if (!res.ok) {
                Utils.toast(res.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Загрузить';
                return;
            }
            App.closeModal();
            Utils.toast('Видео загружено! 🌍', 'success');
            App.nav('feed');
        }).catch(function(err) {
            Utils.toast('Ошибка: ' + err.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Загрузить';
        });
    }
};
