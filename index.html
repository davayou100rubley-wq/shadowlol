<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПУЛЬС</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #020617; /* Очень темный синий */
            color: #f8fafc;
            font-family: sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Styles */
        .premium-ring {
            background: linear-gradient(45deg, #ff00cc, #333399, #00ccff);
            padding: 2px;
            border-radius: 50%;
        }
        
        .neon-check {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 50%;
            padding: 2px;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.8);
            border: 2px solid #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* TikTok Style Video Container */
        .tiktok-container {
            height: calc(100vh - 80px); /* Высота минус навигация */
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
        }
        .tiktok-item {
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- БАЗА ДАННЫХ (LocalStorage для демо) ---
        const initDB = () => {
            if (!localStorage.getItem('pulse_db')) {
                const codes = {};
                for(let i=0; i<100; i++) codes['PULSE'+i] = { days: 30, used: false };
                codes['GOD_PULSE'] = { days: Infinity, used: false };

                localStorage.setItem('pulse_db', JSON.stringify({
                    users: [],
                    posts: [], // Фото
                    videos: [], // Для ленты (TikTok)
                    stories: [],
                    promoCodes: codes
                }));
            }
        };
        initDB();
        const getDB = () => JSON.parse(localStorage.getItem('pulse_db'));
        const saveDB = (data) => localStorage.setItem('pulse_db', JSON.stringify(data));

        // SVG "Голова и плечи"
        const DefaultAvatarSVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E`;

        // --- КОМПОНЕНТЫ ---

        const Icon = ({ name, size = 24, className }) => {
            useEffect(() => lucide.createIcons(), [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Avatar = ({ url, isPremium, size = "w-10 h-10" }) => (
            <div className={`relative ${isPremium ? 'premium-ring' : ''}`}>
                <div className={`${size} rounded-full bg-slate-800 overflow-hidden border-2 border-[#020617]`}>
                    <img src={url || DefaultAvatarSVG} className="w-full h-full object-cover" />
                </div>
                {isPremium && (
                    <div className="neon-check w-4 h-4">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4" className="w-2.5 h-2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                )}
            </div>
        );

        // --- ЭКРАН АВТОРИЗАЦИИ ---
        const AuthScreen = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [mode, setMode] = useState('login');
            const [useCustomAv, setUseCustomAv] = useState(false);
            const [file, setFile] = useState(null);

            const handleAuth = () => {
                const db = getDB();
                if (mode === 'register') {
                    if (db.users.find(u => u.username === username)) return alert("Ник занят");
                    
                    let av = DefaultAvatarSVG;
                    const finish = (finalAv) => {
                        const newUser = {
                            id: Date.now().toString(),
                            username, password, avatar: finalAv,
                            isPremium: false, premiumUntil: 0,
                            postCount: 0, lastReset: Date.now()
                        };
                        db.users.push(newUser);
                        saveDB(db);
                        onLogin(newUser);
                    };

                    if (useCustomAv && file) {
                        const r = new FileReader();
                        r.onload = (e) => finish(e.target.result);
                        r.readAsDataURL(file);
                    } else {
                        finish(av);
                    }
                } else {
                    const user = db.users.find(u => u.username === username && u.password === password);
                    if (user) onLogin(user);
                    else alert("Ошибка входа");
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-[#020617]">
                    <h1 className="text-5xl font-black text-blue-500 mb-8 tracking-widest">ПУЛЬС</h1>
                    <div className="w-full max-w-sm space-y-4">
                        <input type="text" placeholder="Никнейм" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-3 bg-slate-900 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500" />
                        <input type="password" placeholder="Пароль" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 bg-slate-900 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500" />
                        
                        {mode === 'register' && (
                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                                <div className="flex gap-2 mb-2">
                                    <button onClick={()=>setUseCustomAv(false)} className={`flex-1 text-xs py-1 rounded ${!useCustomAv?'bg-blue-600':'bg-slate-800'}`}>Стандарт</button>
                                    <button onClick={()=>setUseCustomAv(true)} className={`flex-1 text-xs py-1 rounded ${useCustomAv?'bg-blue-600':'bg-slate-800'}`}>Свое фото</button>
                                </div>
                                {useCustomAv && <input type="file" onChange={e=>setFile(e.target.files[0])} className="text-xs text-slate-400 w-full" />}
                                {!useCustomAv && <img src={DefaultAvatarSVG} className="w-10 h-10 mx-auto opacity-50" />}
                            </div>
                        )}

                        <button onClick={handleAuth} className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">{mode==='login'?'Войти':'Регистрация'}</button>
                        <p onClick={()=>setMode(mode==='login'?'register':'login')} className="text-center text-slate-500 text-sm cursor-pointer">
                            {mode==='login'?'Нет аккаунта?':'Есть аккаунт?'}
                        </p>
                    </div>
                </div>
            );
        };

        // --- ПРИЛОЖЕНИЕ ---
        const App = ({ user, onLogout }) => {
            const [activeTab, setActiveTab] = useState('main'); // main, feed, create, inbox, profile
            const [db, setDb] = useState(getDB());
            const [searchQuery, setSearchQuery] = useState('');
            
            // Sync DB
            useEffect(() => {
                const i = setInterval(() => setDb(getDB()), 1000);
                return () => clearInterval(i);
            }, []);

            const currentUser = db.users.find(u => u.id === user.id) || user;
            const isPremium = currentUser.isPremium || (currentUser.premiumUntil && currentUser.premiumUntil > Date.now());

            // --- ЛОГИКА СОЗДАНИЯ ---
            const handleCreate = (type, text, file) => {
                if (!file) return alert("Файл не выбран");
                
                // Проверка лимитов для постов
                if (type === 'post') {
                    const limit = isPremium ? 4 : 2;
                    if (currentUser.postCount >= limit) return alert("Лимит постов исчерпан");
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const dbData = getDB();
                    const item = {
                        id: Date.now(),
                        authorId: user.id,
                        authorName: user.username,
                        authorAvatar: user.avatar,
                        authorPremium: isPremium,
                        text: text,
                        media: e.target.result,
                        createdAt: Date.now()
                    };

                    if (type === 'post') {
                        dbData.posts.unshift(item);
                        const uIdx = dbData.users.findIndex(u => u.id === user.id);
                        dbData.users[uIdx].postCount += 1;
                    } else if (type === 'story') {
                        dbData.stories.unshift(item);
                    } else if (type === 'video') {
                        dbData.videos.unshift(item);
                    }
                    
                    saveDB(dbData);
                    setActiveTab('main');
                };
                reader.readAsDataURL(file);
            };

            const applyPromo = (code) => {
                const dbData = getDB();
                const p = dbData.promoCodes[code];
                if (p && !p.used) {
                    p.used = true;
                    const uIdx = dbData.users.findIndex(u => u.id === user.id);
                    dbData.users[uIdx].isPremium = true;
                    dbData.users[uIdx].premiumUntil = p.days === Infinity ? Infinity : Date.now() + (p.days * 86400000);
                    saveDB(dbData);
                    alert("Премиум активирован!");
                } else {
                    alert("Неверный код");
                }
            };

            // --- ВКЛАДКИ ---

            // 1. ГЛАВНАЯ
            const MainTab = () => {
                const filteredPosts = db.posts.filter(p => 
                    p.text.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    p.authorName.toLowerCase().includes(searchQuery.toLowerCase())
                );

                return (
                    <div className="pb-20 min-h-screen">
                        {/* Поиск */}
                        <div className="sticky top-0 z-30 bg-[#020617]/95 backdrop-blur p-4 border-b border-slate-800">
                            <div className="relative">
                                <Icon name="search" className="absolute left-3 top-2.5 text-slate-500" size={18} />
                                <input 
                                    type="text" 
                                    placeholder="Поиск видео, людей..." 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full bg-slate-900 text-white pl-10 pr-4 py-2 rounded-xl border border-slate-800 focus:border-blue-500 outline-none"
                                />
                            </div>
                        </div>

                        {/* Stories */}
                        {!searchQuery && (
                            <div className="py-4 border-b border-slate-800">
                                <div className="flex space-x-4 overflow-x-auto no-scrollbar px-4">
                                    <div className="flex flex-col items-center space-y-1 min-w-[70px]">
                                        <div className="w-16 h-16 rounded-full border-2 border-dashed border-slate-600 flex items-center justify-center bg-slate-800">
                                            <Icon name="plus" className="text-slate-400" />
                                        </div>
                                        <span className="text-xs text-slate-400">История</span>
                                    </div>
                                    {db.stories.map(s => (
                                        <div key={s.id} className="flex flex-col items-center space-y-1 min-w-[70px]">
                                            <Avatar url={s.authorAvatar} isPremium={s.authorPremium} size="w-16 h-16" />
                                            <span className="text-xs text-slate-300 truncate w-16 text-center">{s.authorName}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Posts */}
                        <div className="space-y-4 mt-2 px-2">
                            {filteredPosts.length === 0 && !searchQuery && (
                                <div className="text-center text-slate-600 py-10">Постов пока нет</div>
                            )}
                            {filteredPosts.map(post => (
                                <div key={post.id} className="bg-slate-900 rounded-xl overflow-hidden border border-slate-800">
                                    <div className="flex items-center p-3 space-x-3">
                                        <Avatar url={post.authorAvatar} isPremium={post.authorPremium} />
                                        <div>
                                            <p className="font-bold text-sm text-white">{post.authorName}</p>
                                            <p className="text-xs text-slate-500">Только что</p>
                                        </div>
                                    </div>
                                    {post.media && <img src={post.media} className="w-full aspect-square object-cover bg-black" />}
                                    <div className="p-3">
                                        <p className="text-sm text-slate-300"><span className="font-bold text-white mr-2">{post.authorName}</span>{post.text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // 2. ЛЕНТА (TIKTOK STYLE)
            const FeedTab = () => (
                <div className="tiktok-container bg-black pb-20">
                    {db.videos.length === 0 ? (
                        <div className="h-full flex items-center justify-center text-slate-500">Нет видео</div>
                    ) : (
                        db.videos.map(v => (
                            <div key={v.id} className="tiktok-item flex items-center justify-center relative">
                                {/* Здесь должно быть видео тег <video>, но для демо используем картинку с оверлеем */}
                                <img src={v.media} className="w-full h-full object-cover opacity-80" />
                                <div className="absolute bottom-20 left-4 text-white drop-shadow-md">
                                    <p className="font-bold">@{v.authorName}</p>
                                    <p className="text-sm">{v.text}</p>
                                </div>
                                <div className="absolute bottom-20 right-4 flex flex-col space-y-4 items-center">
                                    <div className="bg-slate-800/50 p-3 rounded-full"><Icon name="heart" /></div>
                                    <div className="bg-slate-800/50 p-3 rounded-full"><Icon name="message-square" /></div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );

            // 3. СОЗДАНИЕ (+)
            const CreateTab = () => {
                const [type, setType] = useState('post'); // post, story, video
                const [text, setText] = useState('');
                const [file, setFile] = useState(null);
                const [preview, setPreview] = useState(null);

                const handleFile = (e) => {
                    const f = e.target.files[0];
                    if (f) {
                        setFile(f);
                        setPreview(URL.createObjectURL(f));
                    }
                };

                return (
                    <div className="p-4 pb-24 min-h-screen">
                        <h2 className="text-xl font-bold mb-4">Создать</h2>
                        
                        <div className="flex space-x-2 mb-4 bg-slate-900 p-1 rounded-lg">
                            {['post', 'story', 'video'].map(t => (
                                <button 
                                    key={t} 
                                    onClick={() => setType(t)}
                                    className={`flex-1 py-2 text-sm rounded-md capitalize ${type===t ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                >
                                    {t === 'post' ? 'Пост (Фото)' : t === 'story' ? 'История' : 'Видео (Лента)'}
                                </button>
                            ))}
                        </div>

                        <textarea 
                            placeholder="Описание..." 
                            className="w-full bg-slate-900 p-3 rounded-xl border border-slate-800 text-white outline-none mb-4 h-24 resize-none"
                            value={text}
                            onChange={e => setText(e.target.value)}
                        />

                        <div className="mb-6">
                            {!preview ? (
                                <label className="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-700 rounded-xl cursor-pointer hover:bg-slate-900 transition">
                                    <Icon name="upload" size={32} className="text-slate-500 mb-2" />
                                    <span className="text-slate-400 text-sm">Выбрать файл</span>
                                    <input type="file" accept="image/*,video/*" className="hidden" onChange={handleFile} />
                                </label>
                            ) : (
                                <div className="relative w-full h-64 rounded-xl overflow-hidden bg-black">
                                    <img src={preview} className="w-full h-full object-contain" />
                                    <button onClick={() => {setFile(null); setPreview(null)}} className="absolute top-2 right-2 bg-red-500 p-1 rounded-full"><Icon name="x" size={16} /></button>
                                </div>
                            )}
                        </div>

                        <button 
                            onClick={() => text && file && handleCreate(type, text, file)}
                            disabled={!text || !file}
                            className="w-full bg-blue-600 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold py-3 rounded-xl"
                        >
                            Опубликовать
                        </button>
                    </div>
                );
            };

            // 4. ВХОДЯЩИЕ
            const InboxTab = () => (
                <div className="p-4 pb-24 text-center text-slate-500 pt-20">
                    <Icon name="inbox" size={48} className="mx-auto mb-4 opacity-20" />
                    <p>Входящие пусты</p>
                </div>
            );

            // 5. ПРОФИЛЬ
            const ProfileTab = () => {
                const [promoCode, setPromoCode] = useState('');
                const myPosts = db.posts.filter(p => p.authorId === user.id);

                return (
                    <div className="pb-24 min-h-screen bg-[#020617]">
                        {/* Стрелка назад для телефонов */}
                        <div className="p-4 flex items-center border-b border-slate-800">
                            <button onClick={() => setActiveTab('main')} className="p-2 -ml-2 text-slate-400 hover:text-white">
                                <Icon name="arrow-left" size={24} />
                            </button>
                            <h2 className="text-lg font-bold ml-2">Профиль</h2>
                        </div>

                        <div className="p-6 flex flex-col items-center">
                            <Avatar url={user.avatar} isPremium={isPremium} size="w-24 h-24" />
                            <h2 className="text-2xl font-bold mt-4">{user.username}</h2>
                            {isPremium && <span className="text-yellow-500 text-xs font-bold mt-1 border border-yellow-500 px-2 py-0.5 rounded">PREMIUM</span>}
                            
                            <div className="flex space-x-8 mt-6 text-center">
                                <div><p className="font-bold text-lg">{myPosts.length}</p><p className="text-xs text-slate-500">Постов</p></div>
                                <div><p className="font-bold text-lg">0</p><p className="text-xs text-slate-500">Друзей</p></div>
                            </div>
                        </div>

                        {/* Вкладка Промокоды */}
                        <div className="px-4">
                            <div className="bg-slate-900 rounded-xl border border-slate-800 p-4">
                                <h3 className="font-bold text-blue-400 mb-3 flex items-center"><Icon name="ticket" size={16} className="mr-2"/> Промокоды</h3>
                                {!isPremium ? (
                                    <div className="flex space-x-2">
                                        <input 
                                            type="text" 
                                            placeholder="Введите код" 
                                            className="flex-1 bg-[#020617] p-2 rounded border border-slate-700 text-sm text-white outline-none"
                                            value={promoCode}
                                            onChange={e => setPromoCode(e.target.value)}
                                        />
                                        <button onClick={() => applyPromo(promoCode)} className="bg-blue-600 px-4 rounded text-sm font-bold">OK</button>
                                    </div>
                                ) : (
                                    <p className="text-green-500 text-sm">У вас активен Премиум!</p>
                                )}
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-1 p-4 mt-4">
                            {myPosts.map(p => (
                                <div key={p.id} className="aspect-square bg-slate-800 rounded overflow-hidden">
                                    <img src={p.media} className="w-full h-full object-cover" />
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-[#020617]">
                    {activeTab === 'main' && <MainTab />}
                    {activeTab === 'feed' && <FeedTab />}
                    {activeTab === 'create' && <CreateTab />}
                    {activeTab === 'inbox' && <InboxTab />}
                    {activeTab === 'profile' && <ProfileTab />}

                    {/* Нижняя навигация */}
                    <div className="fixed bottom-0 w-full bg-[#020617] border-t border-slate-800 flex justify-around py-3 z-50 pb-safe">
                        {[
                            { id: 'main', icon: 'home', label: 'Главная' },
                            { id: 'feed', icon: 'play-circle', label: 'Лента' },
                            { id: 'create', icon: 'plus-square', label: '+' },
                            { id: 'inbox', icon: 'mail', label: 'Входящие' },
                            { id: 'profile', icon: 'user', label: 'Профиль' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)} 
                                className={`flex flex-col items-center w-1/5 ${activeTab===tab.id ? 'text-blue-500' : 'text-slate-500'}`}
                            >
                                <Icon name={tab.icon} size={24} />
                                <span className="text-[10px] mt-1">{tab.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const Root = () => {
            const [user, setUser] = useState(null);
            return user ? <App user={user} onLogout={() => setUser(null)} /> : <AuthScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
