                    await supabase.rpc('delete_post_and_restore', { p_post_id: postId });
                    refreshProfile();
                    setMyPosts(function(prev) {
                        return prev.filter(function(p) { return p.id !== postId; });
                    });
                } catch (err) {
                    console.error('Ошибка удаления:', err);
                }
            }

            return (
                <div className="animate-fade-in pb-24">

                    {/* Шапка профиля */}
                    <div className="px-5 py-4 flex items-center justify-between border-b border-darkBorder">
                        <h2 className="text-lg font-bold">@{profile ? profile.username : '...'}</h2>
                        <div className="flex gap-1">
                            <button className="p-2 text-slate-400 hover:text-white transition">
                                <Icon name="settings" />
                            </button>
                            <button
                                onClick={logout}
                                className="p-2 text-slate-400 hover:text-red-400 transition"
                                title="Выйти"
                            >
                                <Icon name="logOut" size={20} />
                            </button>
                        </div>
                    </div>

                    {/* Информация о пользователе */}
                    <div className="px-5 py-5 flex items-center gap-5">
                        <Avatar
                            src={profile ? profile.avatar_url : null}
                            size={80}
                            isPremium={profile ? profile.is_premium : false}
                        />
                        <div className="flex-1">
                            <div className="flex items-center gap-2 flex-wrap">
                                <h3 className="font-bold text-lg">
                                    {profile ? profile.username : '...'}
                                </h3>
                                {profile && profile.is_premium && (
                                    <span className="bg-gradient-to-r from-orange-500 to-pink-500 text-white text-xs font-bold px-2 py-0.5 rounded-full flex items-center gap-1 shadow-[0_0_10px_rgba(234,88,12,0.5)]">
                                        <Icon name="crown" size={10} filled /> PREMIUM
                                    </span>
                                )}
                            </div>
                            <p className="text-sm text-slate-400 mt-1">
                                Постов: {myPosts.length} • {profile && profile.is_premium ? '60 FPS • HD' : '30 FPS • SD'}
                            </p>
                        </div>
                    </div>

                    {/* Кнопка редактирования */}
                    <div className="px-5 pb-4">
                        <button className="w-full py-2.5 bg-darkCard border border-darkBorder rounded-lg text-sm font-semibold flex items-center justify-center gap-2">
                            <Icon name="edit" size={14} /> Редактировать профиль
                        </button>
                    </div>

                    {/* Табы */}
                    <div className="flex border-b border-darkBorder">
                        <button
                            onClick={function() { setActiveTab('posts'); }}
                            className={'flex-1 py-3 flex justify-center relative ' + (activeTab === 'posts' ? 'text-white' : 'text-slate-500')}
                        >
                            <Icon name="grid" />
                            {activeTab === 'posts' && (
                                <div className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-white rounded-full" />
                            )}
                        </button>
                        <button
                            onClick={function() { setActiveTab('promo'); }}
                            className={'flex-1 py-3 flex justify-center relative ' + (activeTab === 'promo' ? 'text-yellow-400' : 'text-slate-500')}
                        >
                            <Icon name="gift" />
                            {activeTab === 'promo' && (
                                <div className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-yellow-400 rounded-full" />
                            )}
                        </button>
                    </div>

                    {/* Контент табов */}
                    {activeTab === 'posts' ? (
                        /* Сетка постов */
                        <div className="grid grid-cols-3 gap-0.5 p-0.5">
                            {myPosts.length > 0 ? (
                                myPosts.map(function(post) {
                                    var firstMedia = post.media_items && post.media_items[0];
                                    var mediaCount = post.media_items ? post.media_items.length : 0;

                                    return (
                                        <div key={post.id} className="aspect-square bg-darkCard overflow-hidden relative group cursor-pointer">
                                            {firstMedia && firstMedia.type === 'video' ? (
                                                <video src={firstMedia.url} className="w-full h-full object-cover" />
                                            ) : (
                                                <img src={firstMedia ? firstMedia.url : ''} className="w-full h-full object-cover" alt="" />
                                            )}
                                            {mediaCount > 1 && (
                                                <div className="absolute top-1 right-1 bg-black/60 px-1.5 rounded text-[10px] font-bold">
                                                    {mediaCount}
                                                </div>
                                            )}
                                            <button
                                                onClick={function() { handleDeletePost(post.id); }}
                                                className="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
                                            >
                                                <Icon name="trash" className="text-red-400" />
                                            </button>
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="col-span-3 py-12 text-center text-slate-500">
                                    Нет постов
                                </div>
                            )}
                        </div>
                    ) : (
                        /* Вкладка промокодов */
                        <div className="p-5 space-y-4">

                            {/* Поле ввода промокода */}
                            <div className="bg-darkCard rounded-xl p-4 border border-darkBorder">
                                <h3 className="font-bold mb-3 flex items-center gap-2">
                                    <Icon name="gift" size={18} className="text-primary" /> Активировать код
                                </h3>
                                <div className="flex gap-2">
                                    <input
                                        value={promoCode}
                                        onChange={function(e) { setPromoCode(e.target.value.toUpperCase()); }}
                                        placeholder="ВВЕДИ КОД"
                                        className="flex-1 bg-dark border border-darkBorder rounded-lg px-3 py-2.5 text-sm outline-none focus:border-primary uppercase tracking-wider text-white placeholder-slate-500"
                                    />
                                    <button
                                        onClick={handleApplyPromo}
                                        disabled={isApplying}
                                        className="bg-primary px-5 rounded-lg font-bold active:scale-95 transition flex items-center gap-2 text-white"
                                    >
                                        {isApplying && (
                                            <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full spinner" />
                                        )}
                                        OK
                                    </button>
                                </div>
                            </div>

                            {/* Результат активации */}
                            {promoResult && (
                                <div className={
                                    'rounded-xl p-4 text-sm font-semibold animate-fade-in ' +
                                    (promoResult.success
                                        ? 'bg-green-500/20 text-green-400 border border-green-500/30'
                                        : 'bg-red-500/20 text-red-400 border border-red-500/30')
                                }>
                                    {promoResult.message || promoResult.error}
                                </div>
                            )}

                            {/* Преимущества Premium */}
                            <div className="bg-gradient-to-br from-orange-500/10 to-pink-500/10 rounded-xl p-4 border border-orange-500/20">
                                <h3 className="font-bold text-orange-400 mb-2 flex items-center gap-2">
                                    <Icon name="crown" size={16} filled className="text-orange-400" /> Premium даёт
                                </h3>
                                <ul className="text-sm text-slate-300 space-y-1.5">
                                    <li>• 6 постов в неделю (вместо 2)</li>
                                    <li>• 60 FPS и HD качество</li>
                                    <li>• Неоновая галочка и обводка</li>
                                </ul>
                            </div>

                            {/* Тестовые коды */}
                            <details className="text-xs text-slate-600">
                                <summary className="cursor-pointer">🔧 Тестовые коды</summary>
                                <div className="mt-2 p-3 bg-darkCard rounded-lg">
                                    <p className="text-yellow-400 font-bold">PULSE-GOD — навсегда</p>
                                    <p>PULSE-001 ... PULSE-100 — на месяц</p>
                                </div>
                            </details>
                        </div>
                    )}
                </div>
            );
        }


        // ================================================================
        // 🔔 СТРАНИЦА АКТИВНОСТИ (Уведомления)
        // ================================================================
        function ActivityPage() {
            return (
                <div className="animate-fade-in p-6 text-center mt-20">
                    <Icon name="heart" size={48} className="text-slate-700 mb-4 mx-auto" />
                    <p className="text-slate-500 text-lg font-semibold">Уведомления пусты</p>
                    <p className="text-slate-600 text-sm mt-2">Лайки и комментарии появятся здесь</p>
                </div>
            );
        }


        // ================================================================
        // 🧭 НИЖНЯЯ НАВИГАЦИЯ
        // 5 вкладок: Главная, Лента, Создать, Активность, Профиль
        // ================================================================
        function BottomNav(props) {
            var active = props.active;
            var setActive = props.setActive;
            var auth = useAuth();
            var profile = auth.profile;

            var tabs = [
                { id: 'home', label: 'Главная', icon: 'home' },
                { id: 'feed', label: 'Лента', icon: 'play' },
                { id: 'create', label: '', icon: 'plus' },
                { id: 'activity', label: 'Активность', icon: 'heart' },
                { id: 'profile', label: 'Профиль', icon: 'user' }
            ];

            return (
                <nav className="fixed bottom-0 left-0 right-0 z-40 bg-dark/90 backdrop-blur-xl border-t border-darkBorder safe-area-bottom">
                    <div className="max-w-lg mx-auto flex items-center justify-around h-16">
                        {tabs.map(function(tab) {
                            var isActive = (active === tab.id);

                            // Особый стиль для кнопки создания
                            if (tab.id === 'create') {
                                return (
                                    <button
                                        key={tab.id}
                                        onClick={function() { setActive('create'); }}
                                        className="mx-1"
                                    >
                                        <div className="w-12 h-9 bg-primary rounded-lg flex items-center justify-center active:scale-90 transition shadow-lg shadow-primary/40">
                                            <Icon name="plus" size={22} className="text-white" />
                                        </div>
                                    </button>
                                );
                            }

                            // Обычные вкладки
                            return (
                                <button
                                    key={tab.id}
                                    onClick={function() { setActive(tab.id); }}
                                    className={
                                        'flex flex-col items-center gap-0.5 py-1 px-2 transition ' +
                                        (isActive ? 'text-primary' : 'text-slate-500')
                                    }
                                >
                                    {tab.id === 'profile' && profile && profile.avatar_url ? (
                                        <Avatar
                                            src={profile.avatar_url}
                                            size={24}
                                            isPremium={profile.is_premium}
                                            showCheck={false}
                                        />
                                    ) : (
                                        <Icon name={tab.icon} filled={isActive} size={24} />
                                    )}
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </nav>
            );
        }


        // ================================================================
        // 🚀 ГЛАВНЫЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ
        // Роутинг между страницами, управление состоянием
        // ================================================================
        function AppContent() {
            var auth = useAuth();
            var user = auth.user;
            var isGuest = auth.isGuest;
            var loading = auth.loading;

            var tabState = useState('home');
            var activeTab = tabState[0];
            var setActiveTab = tabState[1];

            // Экран загрузки (проверка сессии)
            if (loading) {
                return (
                    <div className="h-screen flex items-center justify-center bg-dark">
                        <div className="w-10 h-10 border-2 border-primary border-t-transparent rounded-full spinner" />
                    </div>
                );
            }

            // Если Supabase не загрузился — показываем ошибку
            if (!supabase) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-dark p-6 text-center">
                        <Icon name="pulse" size={48} className="text-red-400 mb-4" />
                        <h2 className="text-xl font-bold mb-2">Ошибка подключения</h2>
                        <p className="text-slate-400 text-sm">
                            Не удалось загрузить библиотеку Supabase. Проверь подключение к интернету и обнови страницу.
                        </p>
                    </div>
                );
            }

            // Если не авторизован и не гость — экран входа
            if (!user && !isGuest) {
                return <AuthScreen />;
            }

            // Карта страниц
            var pages = {
                home: HomePage,
                feed: FeedPage,
                create: CreatePage,
                activity: ActivityPage,
                profile: ProfilePage
            };

            var PageComponent = pages[activeTab] || HomePage;
            var isFeedTab = (activeTab === 'feed');

            return (
                <div className="min-h-screen bg-dark">
                    {/* Header скрываем на вкладке Лента для иммерсивного просмотра */}
                    {!isFeedTab && <Header />}

                    <main className={(isFeedTab ? 'h-screen' : 'pb-16') + ' overflow-y-auto'}>
                        <PageComponent />
                    </main>

                    <BottomNav active={activeTab} setActive={setActiveTab} />
                </div>
            );
        }


        // ================================================================
        // 🎯 ТОЧКА ВХОДА — РЕНДЕР ПРИЛОЖЕНИЯ
        // ================================================================
        function App() {
            return (
                <AuthProvider>
                    <AppContent />
                </AuthProvider>
            );
        }

        // Безопасный рендер с обработкой ошибок
        try {
            var rootElement = document.getElementById('root');
            var root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } catch (renderError) {
            document.getElementById('root').innerHTML =
                '<div style="color:white;padding:40px;text-align:center">' +
                '<h2>❌ Ошибка запуска</h2>' +
                '<p style="color:#94a3b8;margin-top:10px">' + renderError.message + '</p>' +
                '<p style="color:#64748b;margin-top:10px;font-size:12px">Открой консоль (F12) для деталей</p>' +
                '</div>';
        }

    </script>
</body>
</html>
