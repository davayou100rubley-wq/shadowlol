<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Shadow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{height:100dvh;font-family:system-ui,-apple-system,sans-serif;background:#000;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;position:fixed;width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:inherit;outline:none;border:none}
video,img{display:block;max-width:100%}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0a0a}::-webkit-scrollbar-thumb{background:#27272a;border-radius:3px}
:root{--primary:#a855f7;--primary-dark:#7c3aed;--primary-light:#c084fc;--text-sec:#a1a1aa;--text-muted:#52525b;--border:#27272a;--bg-card:#0a0a0a;--bg-card-alt:#121212;--bg-input:#1a1a1a;--error:#ef4444;--success:#22c55e;--premium:#fbbf24;--premium-dark:#f59e0b;--nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:20px;opacity:0;transition:opacity .25s ease}
.screen.active{display:flex;opacity:1}.screen.no-pad{padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:8px;font-size:16px;font-weight:600;transition:all .15s ease;min-height:48px;user-select:none}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 20px rgba(168,85,247,.3)}
.btn-premium{background:linear-gradient(135deg,var(--premium),var(--premium-dark));color:#000;font-weight:700}
.btn-telegram{background:linear-gradient(135deg,#2AABEE,#1E96D1);color:#fff;font-weight:700}
.btn-secondary{background:var(--bg-card-alt);color:#fff;border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--text-sec)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--error);border:1px solid rgba(239,68,68,.3)}
.btn-small{padding:8px 14px;font-size:13px;min-height:36px}
.btn-block{width:100%;max-width:320px}
.form-group{width:100%;max-width:360px;margin-bottom:18px;text-align:left}
.form-label{display:block;margin-bottom:8px;font-size:14px;color:var(--text-sec);font-weight:500}
.form-input,.form-textarea{width:100%;padding:14px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:16px;transition:border-color .2s}
.form-input:focus,.form-textarea:focus{border-color:var(--primary)}
.form-textarea{resize:none;min-height:80px}
.password-wrap{position:relative}.password-wrap input{padding-right:48px}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:20px;cursor:pointer;background:none;border:none;padding:4px}
.avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;border:2px solid var(--border);overflow:hidden}
.avatar.small{width:32px;height:32px;font-size:13px}.avatar.big{width:44px;height:44px;font-size:16px;cursor:pointer}.avatar.xxl{width:110px;height:110px;font-size:42px}
.avatar.premium{background:linear-gradient(135deg,var(--premium),var(--premium-dark));color:#000;border-color:var(--premium)}
.avatar.regular{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
.avatar.banned{background:#333;color:#666;border-color:var(--error)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-picker-simple{display:flex;gap:16px;align-items:center}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;overflow:hidden;flex-shrink:0;border:3px solid var(--border)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-upload-btn{flex:1;padding:16px;border:2px dashed var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-sec);font-size:14px}
.avatar-upload-btn:hover{border-color:var(--primary);color:var(--primary)}
.welcome-title{font-size:clamp(52px,13vw,76px);font-weight:900;background:linear-gradient(135deg,#a855f7,#c084fc,#7c3aed);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;letter-spacing:-2px}
.welcome-subtitle{color:var(--text-sec);font-size:15px;text-align:center;max-width:300px;line-height:1.5}
.welcome-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:40px}
.feed-container{width:100%;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed-container::-webkit-scrollbar{display:none}
.video-card{position:relative;width:100%;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.video-element{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.video-gradient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 35%)}
.video-info{position:absolute;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);left:14px;right:76px;z-index:5}
.video-author-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.video-author-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:pointer}
.video-desc{font-size:14px;line-height:1.4;text-shadow:0 1px 3px rgba(0,0,0,.8);margin-bottom:6px}
.video-tags{display:flex;flex-wrap:wrap;gap:6px}
.video-tag{font-size:13px;color:var(--primary-light);font-weight:600}
.play-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:84px;height:84px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
.play-indicator svg{width:100%;height:100%;fill:rgba(255,255,255,.95);filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.play-indicator.visible{opacity:1}
.video-actions{position:absolute;right:10px;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:18px}
.video-action{display:flex;flex-direction:column;align-items:center;gap:4px}
.video-action-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);transition:transform .15s}
.video-action-btn:active{transform:scale(.85)}
.video-action-btn svg{width:26px;height:26px;fill:#fff}
.video-action.liked .video-action-btn svg{fill:var(--primary)}
.video-action.saved .video-action-btn svg{fill:var(--premium)}
.video-action-count{font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.avatar-follow-wrap{position:relative;margin-bottom:6px}
.follow-plus{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid #000}
.follow-plus.followed{background:var(--success)}
.video-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#121212,#000);gap:12px}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(0,0,0,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-muted);transition:color .2s}
.nav-btn svg{width:24px;height:24px;fill:currentColor}.nav-btn span{font-size:10px}.nav-btn.active{color:var(--primary)}
.upload-nav-btn{width:44px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(168,85,247,.4)}
.upload-nav-btn svg{width:22px;height:22px;fill:#fff}
.profile-header{text-align:center;margin-bottom:20px}
.profile-name-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px}
.profile-name{font-size:21px;font-weight:800}
.profile-username{color:var(--text-sec);font-size:14px;margin-top:4px}
.profile-bio{color:var(--text-sec);font-size:14px;margin-top:10px;max-width:300px}
.profile-stats{display:flex;justify-content:center;gap:22px;margin-top:18px;flex-wrap:wrap}
.stat-val{font-size:20px;font-weight:800}.stat-label{font-size:12px;color:var(--text-sec)}
.back-to-feed-btn{position:fixed;top:calc(var(--safe-t) + 10px);left:14px;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.back-to-feed-btn svg{width:24px;height:24px;fill:#fff}
.profile-tabs{display:flex;gap:12px;border-bottom:1px solid var(--border);margin:20px 0 16px;padding:0 8px}
.profile-tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:600;color:var(--text-sec);border-bottom:2px solid transparent;transition:all .2s;cursor:pointer}
.profile-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.videos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%}
.grid-video{aspect-ratio:9/16;background:var(--bg-card-alt);border-radius:3px;overflow:hidden;position:relative;cursor:pointer}
.grid-video video,.grid-video img{width:100%;height:100%;object-fit:cover}
.grid-video-views{position:absolute;bottom:6px;left:6px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.grid-video-menu-btn{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;z-index:3}
.promo-tab-content{padding:10px 0}
.promo-status{background:var(--bg-card-alt);border-radius:12px;padding:18px;text-align:center;margin-bottom:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;backdrop-filter:blur(3px)}
.modal{background:var(--bg-card);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + var(--safe-b));animation:slideUp .3s ease;border-top:1px solid var(--border)}
@media(min-width:768px){.modal-overlay{align-items:center}.modal{max-width:520px;border-radius:20px}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:34px;height:34px;border-radius:50%;background:var(--bg-input);display:flex;align-items:center;justify-content:center}
.modal-close svg{width:18px;height:18px;fill:var(--text-sec)}
.upload-dropzone{border:2px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;transition:all .2s;margin-bottom:18px;cursor:pointer}
.upload-dropzone.has-video{border-color:var(--success);background:rgba(34,197,94,.05)}
.upload-dropzone-icon{font-size:42px;margin-bottom:10px}
.upload-preview-video{width:100%;max-height:280px;border-radius:10px;background:#000}
.upload-progress{width:100%;height:4px;background:var(--bg-input);border-radius:2px;overflow:hidden;margin:10px 0;display:none}
.upload-progress-bar{height:100%;background:var(--primary);width:0%;transition:width .3s}
.limit-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg-input);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;margin-bottom:16px}
.limit-badge.premium{border-color:var(--premium);background:rgba(251,191,36,.08);color:var(--premium)}
.comments-list{display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
.comment-item{display:flex;gap:10px}.comment-body{flex:1}
.comment-author{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.comment-time{font-size:11px;color:var(--text-muted);font-weight:400}
.comment-text{font-size:14px;line-height:1.4;margin-top:3px}
.comment-form{display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--border)}
.comment-input{flex:1;padding:12px 16px;background:var(--bg-input);border-radius:22px;color:#fff;font-size:14px}
.comment-send{width:44px;height:44px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comment-send svg{width:20px;height:20px;fill:#fff}
.premium-card{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(245,158,11,.04));border:2px solid var(--premium);border-radius:16px;padding:24px;text-align:center}
.premium-price{font-size:34px;font-weight:900;color:var(--premium);margin:14px 0}
.premium-features{text-align:left;margin:18px 0}
.premium-feature{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.premium-badge-inline{display:inline-flex;align-items:center;gap:5px;background:rgba(251,191,36,.1);border:1px solid var(--premium);color:var(--premium);padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600}
.telegram-box{background:rgba(42,171,238,.08);border:1px solid rgba(42,171,238,.4);border-radius:12px;padding:16px;margin-bottom:16px}
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);left:50%;transform:translateX(-50%);background:var(--bg-card-alt);border:1px solid var(--border);padding:12px 20px;border-radius:10px;font-size:14px;z-index:400;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:toastIn .3s ease;white-space:pre-line}
.toast.success{border-color:var(--success)}.toast.error{border-color:var(--error)}.toast.premium{border-color:var(--premium)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.6}
.empty-title{font-size:17px;font-weight:700;margin-bottom:6px}
.empty-text{font-size:14px;color:var(--text-sec);max-width:280px;line-height:1.5}
.ban-icon{font-size:80px;margin-bottom:20px}
.ban-title{font-size:24px;font-weight:900;color:var(--error);margin-bottom:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.admin-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bg-card-alt);border-radius:10px;margin-bottom:8px;gap:10px}
.admin-section-title{font-size:13px;font-weight:700;color:var(--text-sec);margin:16px 0 8px;text-transform:uppercase}
.promo-code-box{background:var(--bg-input);border:1px dashed var(--primary);border-radius:8px;padding:10px 14px;font-family:monospace;font-size:16px;letter-spacing:2px;text-align:center;margin:10px 0}
.admin-tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--bg-card-alt);border-radius:10px;padding:4px}
.admin-tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .2s}
.admin-tab.active{background:var(--primary);color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) scale(.95)}45%,80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
.heart-pop{position:absolute;top:50%;left:50%;width:110px;height:110px;pointer-events:none;z-index:50;animation:heartPop .9s ease forwards}
.heart-pop svg{width:100%;height:100%;fill:var(--primary);filter:drop-shadow(0 4px 20px rgba(168,85,247,.8))}
</style>
</head>
<body>
<div id="app">
<div class="screen active" id="screen-welcome">
<div id="welcome-logo" style="margin-bottom:32px"><svg width="110" height="110" viewBox="0 0 120 120"><defs><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs><circle cx="60" cy="60" r="56" fill="#0a0a0a" stroke="#27272a" stroke-width="2"/><path d="M60 18 C40 18 26 34 26 60 C26 86 40 102 60 102 C60 90 50 80 50 60 C50 40 60 30 60 18 Z" fill="url(#sg)"/><circle cx="72" cy="52" r="5" fill="#c084fc"/><circle cx="78" cy="72" r="3" fill="#c084fc"/></svg></div>
<h1 class="welcome-title">Shadow</h1>
<p class="welcome-subtitle">Социальная сеть коротких видео</p>
<div class="welcome-actions">
<button class="btn btn-primary btn-block" onclick="App.go('register')">Создать аккаунт</button>
<button class="btn btn-secondary btn-block" onclick="App.go('login')">Войти</button>
<button class="btn btn-ghost btn-block" onclick="App.enterGuest()">Продолжить как гость</button>
</div>
</div>
  <div class="screen" id="screen-register">
<div style="width:100%;max-width:400px">
<button class="btn btn-ghost btn-small" onclick="App.go('welcome')" style="margin-bottom:20px">← Назад</button>
<h2 style="font-size:26px;font-weight:800;margin-bottom:6px">Создать аккаунт</h2>
<p style="color:var(--text-sec);margin-bottom:24px">Регистрация глобальная 🌍</p>
<div class="form-group"><label class="form-label">Имя пользователя *</label><input type="text" class="form-input" id="reg-username" placeholder="латиница и цифры" maxlength="20"></div>
<div class="form-group"><label class="form-label">Пароль *</label><div class="password-wrap"><input type="password" class="form-input" id="reg-password" placeholder="минимум 6 символов"><button class="password-toggle" onclick="Utils.togglePw('reg-password',this)">👁</button></div></div>
<div class="form-group"><label class="form-label">Отображаемое имя *</label><input type="text" class="form-input" id="reg-displayname" placeholder="Как тебя будут видеть" maxlength="30" oninput="Reg.onNameChange()"></div>
<div class="form-group" style="max-width:none"><label class="form-label">Аватар</label>
<div class="avatar-picker-simple">
<div class="avatar-preview" id="avatar-preview">?</div>
<div class="avatar-upload-btn" onclick="document.getElementById('avatar-file').click()">📷 Загрузить фото<br><span style="font-size:11px;color:var(--text-muted)">или оставь стандартный</span></div>
</div>
<input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="Reg.pickPhoto(this)">
<button class="btn btn-ghost btn-small" id="avatar-reset-btn" style="margin-top:8px;display:none" onclick="Reg.resetAvatar()">✕ Убрать фото</button>
</div>
<div class="form-group"><label class="form-label">О себе</label><textarea class="form-textarea" id="reg-bio" placeholder="Расскажи о себе..." maxlength="160"></textarea></div>
<button class="btn btn-primary btn-block" id="reg-submit" onclick="Auth.register()" style="width:100%;max-width:none">Создать аккаунт</button>
</div>
</div>

<div class="screen" id="screen-login">
<div style="width:100%;max-width:400px">
<button class="btn btn-ghost btn-small" onclick="App.go('welcome')" style="margin-bottom:20px">← Назад</button>
<h2 style="font-size:26px;font-weight:800;margin-bottom:24px">Вход</h2>
<div class="form-group"><label class="form-label">Имя пользователя</label><input type="text" class="form-input" id="login-username" placeholder="твой username"></div>
<div class="form-group"><label class="form-label">Пароль</label><div class="password-wrap"><input type="password" class="form-input" id="login-password" placeholder="твой пароль"><button class="password-toggle" onclick="Utils.togglePw('login-password',this)">👁</button></div></div>
<button class="btn btn-primary btn-block" id="login-submit" onclick="Auth.login()" style="width:100%;max-width:none">Войти</button>
</div>
</div>

<div class="screen" id="screen-banned">
<div style="text-align:center;max-width:340px">
<div class="ban-icon">🚫</div><div class="ban-title">Аккаунт заблокирован</div>
