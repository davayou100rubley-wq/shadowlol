<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПУСЬ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0f172a; /* Темно-синий */
            color: #e2e8f0;
            font-family: sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Styles */
        .premium-ring {
            background: linear-gradient(45deg, #ff00cc, #333399, #00ccff);
            padding: 2px;
            border-radius: 50%;
        }
        
        .neon-check {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 50%;
            padding: 2px;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.8);
            border: 2px solid #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- БАЗА ДАННЫХ ---
        const initDB = () => {
            if (!localStorage.getItem('pussy_db_v3')) {
                const codes = {};
                for(let i=0; i<100; i++) codes['PROMO'+i] = { days: 30, used: false };
                codes['GOD_MODE'] = { days: Infinity, used: false };

                localStorage.setItem('pussy_db_v3', JSON.stringify({
                    users: [],
                    posts: [],
                    stories: [],
                    promoCodes: codes
                }));
            }
        };
        initDB();

        const getDB = () => JSON.parse(localStorage.getItem('pussy_db_v3'));
        const saveDB = (data) => localStorage.setItem('pussy_db_v3', JSON.stringify(data));

        // SVG для "Голова и плечи" (Unknown User)
        const DefaultAvatarSVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E`;

        // --- КОМПОНЕНТЫ ---

        const Icon = ({ name, size = 24, className }) => {
            useEffect(() => lucide.createIcons(), [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Avatar = ({ url, isPremium, size = "w-10 h-10" }) => (
            <div className={`relative ${isPremium ? 'premium-ring' : ''}`}>
                <div className={`${size} rounded-full bg-slate-700 overflow-hidden border-2 border-[#0f172a]`}>
                    <img 
                        src={url || DefaultAvatarSVG} 
                        className="w-full h-full object-cover" 
                        onError={(e) => { e.target.src = DefaultAvatarSVG; }}
                    />
                </div>
                {isPremium && (
                    <div className="neon-check w-4 h-4">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4" className="w-2.5 h-2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                )}
            </div>
        );

        // --- ЭКРАН АВТОРИЗАЦИИ ---
        const AuthScreen = ({ onLogin }) => {
            const [mode, setMode] = useState('login'); // login, register, guest
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [useCustomAvatar, setUseCustomAvatar] = useState(false);
            const [avatarFile, setAvatarFile] = useState(null);
            const [error, setError] = useState('');

            const handleRegister = () => {
                const db = getDB();
                if (!username || username.length < 3) return setError("Никнейм слишком короткий");
                if (db.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
                    return setError("Этот никнейм уже занят!");
                }

                let finalAvatar = DefaultAvatarSVG;
                
                const finishReg = (av) => {
                    const newUser = {
                        id: Date.now().toString(),
                        username, password,
                        avatar: av,
                        isPremium: false,
                        premiumUntil: 0,
                        postCountThisWeek: 0,
                        lastReset: Date.now()
                    };
                    db.users.push(newUser);
                    saveDB(db);
                    onLogin(newUser);
                };

                if (useCustomAvatar && avatarFile) {
                    const reader = new FileReader();
                    reader.onload = (e) => finishReg(e.target.result);
                    reader.readAsDataURL(avatarFile);
                } else {
                    finishReg(finalAvatar);
                }
            };

            const handleLogin = () => {
                const db = getDB();
                const user = db.users.find(u => u.username === username && u.password === password);
                if (user) onLogin(user);
                else setError("Неверный логин или пароль");
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-900">
                    <h1 className="text-5xl font-black text-blue-500 mb-8 tracking-tighter">ПУСЬ</h1>
                    <div className="w-full max-w-sm space-y-4">
                        <input type="text" placeholder="Никнейм" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:border-blue-500 outline-none text-white" />
                        
                        {mode !== 'guest' && (
                            <input type="password" placeholder="Пароль" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:border-blue-500 outline-none text-white" />
                        )}

                        {mode === 'register' && (
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <p className="text-sm text-slate-400 mb-2">Аватарка:</p>
                                <div className="flex space-x-2 mb-3">
                                    <button 
                                        onClick={() => setUseCustomAvatar(false)}
                                        className={`flex-1 py-2 text-xs rounded-lg ${!useCustomAvatar ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}
                                    >
                                        Стандарт (Голова/Плечи)
                                    </button>
                                    <button 
                                        onClick={() => setUseCustomAvatar(true)}
                                        className={`flex-1 py-2 text-xs rounded-lg ${useCustomAvatar ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}
                                    >
                                        Свое фото
                                    </button>
                                </div>
                                
                                {useCustomAvatar && (
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        onChange={e => setAvatarFile(e.target.files[0])}
                                        className="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-blue-400 hover:file:bg-slate-600"
                                    />
                                )}
                                
                                {!useCustomAvatar && (
                                    <div className="flex justify-center py-2">
                                        <img src={DefaultAvatarSVG} className="w-12 h-12 opacity-50" />
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {error && <p className="text-red-500 text-sm text-center">{error}</p>}

                        <button onClick={mode === 'register' ? handleRegister : handleLogin} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">
                            {mode === 'login' ? 'Войти' : 'Зарегистрироваться'}
                        </button>
                        
                        <div className="flex justify-between text-sm text-slate-400 mt-4">
                            <button onClick={() => setMode(mode==='login'?'register':'login')} className="hover:text-white">
                                {mode === 'login' ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}
                            </button>
                            <button onClick={() => setMode('guest')} className="hover:text-white">Гость</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ОСНОВНОЕ ПРИЛОЖЕНИЕ ---
        const App = ({ user, onLogout }) => {
            const [activeTab, setActiveTab] = useState('feed');
            const [db, setDb] = useState(getDB());
            const [searchQuery, setSearchQuery] = useState('');
            
            useEffect(() => {
                const interval = setInterval(() => setDb(getDB()), 1000);
                return () => clearInterval(interval);
            }, []);

            const currentUser = db.users.find(u => u.id === user.id) || user;
            const isPremium = currentUser.isPremium || (currentUser.premiumUntil && currentUser.premiumUntil > Date.now());

            // --- СОЗДАНИЕ ПОСТА ---
            const handleCreatePost = (text, file) => {
                if (user.id === 'guest') return alert("Гости не могут постить");
                
                const limit = isPremium ? 4 : 2;
                if (currentUser.postCountThisWeek >= limit) {
                    return alert(`Лимит постов исчерпан! (${limit}/неделю)`);
                }

                if (!file) return alert("Выберите фото!");

                const reader = new FileReader();
                reader.onload = (e) => {
                    const db = getDB();
                    const newPost = {
                        id: Date.now(),
                        authorId: user.id,
                        authorName: user.username,
                        authorAvatar: user.avatar,
                        authorIsPremium: isPremium,
                        text: text,
                        image: e.target.result,
                        likes: 0,
                        createdAt: Date.now()
                    };
                    
                    const userIdx = db.users.findIndex(u => u.id === user.id);
                    db.users[userIdx].postCountThisWeek += 1;
                    
                    db.posts.unshift(newPost);
                    saveDB(db);
                    setActiveTab('feed');
                };
                reader.readAsDataURL(file);
            };

            // --- ПРОМОКОДЫ ---
            const applyPromo = (code) => {
                const db = getDB();
                const promo = db.promoCodes[code];
                if (!promo) return alert("Неверный код");
                if (promo.used) return alert("Код использован");

                const days = promo.days;
                const until = days === Infinity ? Infinity : Date.now() + (days * 24 * 60 * 60 * 1000);
                
                const userIdx = db.users.findIndex(u => u.id === user.id);
                db.users[userIdx].isPremium = true;
                db.users[userIdx].premiumUntil = until;
                
                promo.used = true;
                saveDB(db);
                alert(`Премиум активирован!`);
            };

            // --- ВКЛАДКИ ---

            const FeedTab = () => {
                const filteredPosts = db.posts.filter(p => 
                    p.text.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    p.authorName.toLowerCase().includes(searchQuery.toLowerCase())
                );

                return (
                    <div className="pb-20">
                        {/* Поиск сверху */}
                        <div className="sticky top-0 z-30 bg-[#0f172a]/95 backdrop-blur p-4 border-b border-slate-800">
                            <div className="relative">
                                <Icon name="search" className="absolute left-3 top-2.5 text-slate-500" size={18} />
                                <input 
                                    type="text" 
                                    placeholder="Поиск..." 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full bg-slate-800 text-white pl-10 pr-4 py-2 rounded-xl border border-slate-700 focus:border-blue-500 outline-none"
                                />
                            </div>
                        </div>

                        {/* Истории */}
                        {!searchQuery && (
                            <div className="py-4 border-b border-slate-800">
                                <div className="flex space-x-4 overflow-x-auto no-scrollbar px-4">
                                    <div className="flex flex-col items-center space-y-1 min-w-[70px]">
                                        <div className="w-16 h-16 rounded-full border-2 border-dashed border-slate-600 flex items-center justify-center bg-slate-800">
                                            <Icon name="plus" className="text-slate-400" />
                                        </div>
                                        <span className="text-xs text-slate-400">История</span>
                                    </div>
                                    {db.stories.map(s => (
                                        <div key={s.id} className="flex flex-col items-center space-y-1 min-w-[70px]">
                                            <Avatar url={s.avatar} isPremium={s.isPremium} size="w-16 h-16" />
                                            <span className="text-xs text-slate-300 truncate w-16 text-center">{s.username}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Посты */}
                        <div className="space-y-4 mt-2">
                            {filteredPosts.map(post => (
                                <div key={post.id} className="bg-slate-900 border-b border-slate-800 pb-4">
                                    <div className="flex items-center p-3 space-x-3">
                                        <Avatar url={post.authorAvatar} isPremium={post.authorIsPremium} />
                                        <div>
                                            <p className="font-bold text-sm text-white">{post.authorName}</p>
                                            <p className="text-xs text-slate-500">Только что</p>
                                        </div>
                                    </div>
                                    {post.image && <img src={post.image} className="w-full aspect-square object-cover bg-slate-800" />}
                                    <div className="px-3 pt-3">
                                        <div className="flex space-x-4 mb-2">
                                            <Icon name="heart" className="text-white" />
                                            <Icon name="message-circle" className="text-white" />
                                        </div>
                                        <p className="text-sm text-slate-300"><span className="font-bold text-white mr-2">{post.authorName}</span>{post.text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const SearchTab = () => (
                <div className="p-4 pb-24">
                    <h2 className="text-2xl font-bold mb-4">Поиск</h2>
                    <input type="text" placeholder="Найти друзей..." className="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white outline-none mb-4" />
                    <p className="text-slate-500 text-center">Здесь будет поиск людей</p>
                </div>
            );

            const CreateTab = () => {
                const [text, setText] = useState('');
                const [file, setFile] = useState(null);
                const [preview, setPreview] = useState(null);

                const handleFile = (e) => {
                    const f = e.target.files[0];
                    if (f) {
                        setFile(f);
                        setPreview(URL.createObjectURL(f));
                    }
                };

                return (
                    <div className="p-4 pb-24 min-h-screen">
                        <h2 className="text-xl font-bold mb-6">Новый пост</h2>
                        <textarea 
                            placeholder="Описание..." 
                            className="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white outline-none mb-4 h-32 resize-none"
                            value={text}
                            onChange={e => setText(e.target.value)}
                        />
                        <div className="mb-6">
                            {!preview ? (
                                <label className="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-600 rounded-xl cursor-pointer hover:bg-slate-800 transition">
                                    <Icon name="image" size={32} className="text-slate-500 mb-2" />
                                    <span className="text-slate-400 text-sm">Выбрать фото</span>
                                    <input type="file" accept="image/*" className="hidden" onChange={handleFile} />
                                </label>
                            ) : (
                                <div className="relative w-full h-64 rounded-xl overflow-hidden">
                                    <img src={preview} className="w-full h-full object-cover" />
                                    <button onClick={() => {setFile(null); setPreview(null)}} className="absolute top-2 right-2 bg-red-500 p-1 rounded-full"><Icon name="x" size={16} /></button>
                                </div>
                            )}
                        </div>
                        <button 
                            onClick={() => text && file && handleCreatePost(text, file)}
                            disabled={!text || !file}
                            className="w-full bg-blue-600 disabled:bg-slate-700 text-white font-bold py-3 rounded-xl"
                        >
                            Опубликовать
                        </button>
                    </div>
                );
            };

            const ProfileTab = () => {
                const [promo, setPromo] = useState('');
                const myPosts = db.posts.filter(p => p.authorId === user.id);
                return (
                    <div className="pb-24">
                        <div className="p-6 flex flex-col items-center border-b border-slate-800">
                            <Avatar url={user.avatar} isPremium={isPremium} size="w-24 h-24" />
                            <h2 className="text-2xl font-bold mt-4">{user.username}</h2>
                            {isPremium && <span className="text-yellow-500 text-sm font-bold mt-1">PREMIUM</span>}
                        </div>
                        {!isPremium && (
                            <div className="p-4 m-4 bg-slate-800 rounded-xl">
                                <div className="flex space-x-2">
                                    <input type="text" placeholder="Промокод" className="flex-1 bg-slate-900 p-2 rounded text-sm text-white" value={promo} onChange={e=>setPromo(e.target.value)} />
                                    <button onClick={()=>applyPromo(promo)} className="bg-blue-600 px-4 rounded text-sm font-bold">OK</button>
                                </div>
                            </div>
                        )}
                        <div className="grid grid-cols-3 gap-1 p-1">
                            {myPosts.map(p => <div key={p.id} className="aspect-square bg-slate-800"><img src={p.image} className="w-full h-full object-cover"/></div>)}
                        </div>
                    </div>
                );
            };

            const ActivityTab = () => (
                <div className="p-4 pb-24 text-center text-slate-500">
                    <Icon name="bell" size={48} className="mx-auto mb-4 opacity-20" />
                    <p>Уведомлений нет</p>
                </div>
            );

            return (
                <div className="min-h-screen bg-[#0f172a]">
                    {activeTab === 'feed' && <FeedTab />}
                    {activeTab === 'search' && <SearchTab />}
                    {activeTab === 'create' && <CreateTab />}
                    {activeTab === 'activity' && <ActivityTab />}
                    {activeTab === 'profile' && <ProfileTab />}

                    {/* Нижняя навигация (5 вкладок) */}
                    <div className="fixed bottom-0 w-full bg-[#0f172a] border-t border-slate-800 flex justify-around py-2 z-50 pb-safe">
                        {[
                            { id: 'feed', icon: 'layout-grid', label: 'Лента' },
                            { id: 'search', icon: 'search', label: 'Поиск' },
                            { id: 'create', icon: 'plus-square', label: 'Пост' },
                            { id: 'activity', icon: 'heart', label: 'Активность' },
                            { id: 'profile', icon: 'user', label: 'Профиль' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)} 
                                className={`flex flex-col items-center p-2 rounded-lg transition-colors ${activeTab===tab.id ? 'text-blue-500' : 'text-slate-500'}`}
                            >
                                <Icon name={tab.icon} size={24} />
                                <span className="text-[10px] mt-1">{tab.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const Root = () => {
            const [user, setUser] = useState(null);
            return user ? <App user={user} onLogout={() => setUser(null)} /> : <AuthScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
