        // ================================================================
        // 🔧 УТИЛИТЫ

        /**
         * Сжатие изображения через Canvas API.
         * Уменьшает размер файла перед загрузкой в Supabase Storage.
         * Возвращает Blob (не base64), чтобы можно было напрямую
         * отправить в storage.from().upload()
         */
        function compressImage(file, maxWidth, quality) {
            maxWidth = maxWidth || 1080;
            quality = quality || 0.7;

            return new Promise(function(resolve, reject) {
                var reader = new FileReader();

                reader.onload = function(event) {
                    var img = new Image();

                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var width = img.width;
                        var height = img.height;

                        // Пропорционально уменьшаем если шире maxWidth
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Конвертируем в Blob
                        canvas.toBlob(function(blob) {
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error('Не удалось сжать изображение'));
                            }
                        }, 'image/jpeg', quality);
                    };

                    img.onerror = function() {
                        reject(new Error('Не удалось загрузить изображение'));
                    };

                    img.src = event.target.result;
                };

                reader.onerror = function() {
                    reject(new Error('Не удалось прочитать файл'));
                };

                reader.readAsDataURL(file);
            });
        }

        /**
         * Получение длительности видеофайла в секундах.
         * Используется для проверки лимита 60 секунд.
         */
        function getVideoDuration(file) {
            return new Promise(function(resolve) {
                var video = document.createElement('video');
                video.preload = 'metadata';

                video.onloadedmetadata = function() {
                    URL.revokeObjectURL(video.src);
                    resolve(video.duration);
                };

                video.onerror = function() {
                    resolve(0);
                };

                video.src = URL.createObjectURL(file);
            });
        }

        /**
         * Форматирование даты в относительное время.
         * "только что", "5 мин", "3 ч", "2 д"
         */
        function formatTimeAgo(dateString) {
            var now = Date.now();
            var then = new Date(dateString).getTime();
            var diffMs = now - then;
            var diffMinutes = Math.floor(diffMs / 60000);

            if (diffMinutes < 1) {
                return 'только что';
            }
            if (diffMinutes < 60) {
                return diffMinutes + ' мин';
            }

            var diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) {
                return diffHours + ' ч';
            }

            var diffDays = Math.floor(diffHours / 24);
            if (diffDays < 30) {
                return diffDays + ' д';
            }

            return new Date(dateString).toLocaleDateString('ru-RU');
        }

        /**
         * Форматирование числа для отображения.
         * 1234 → "1.2K", 1234567 → "1.2M"
         */
        function formatCount(num) {
            if (!num || num === 0) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return String(num);
        }


        // ================================================================
        // 🔐 AUTH CONTEXT
        // Управление состоянием авторизации через Supabase Auth
        // ================================================================
        var AuthContext = createContext(null);

        /**
         * Провайдер авторизации.
         * Обёртывает всё приложение и предоставляет:
         * - user: объект пользователя Supabase Auth (или null)
         * - profile: данные из таблицы profiles (или null)
         * - isGuest: флаг гостевого режима
         * - loading: флаг начальной загрузки
         * - register(), login(), logout(), guest(), refreshProfile()
         */
        function AuthProvider(props) {
            var children = props.children;

            var userState = useState(null);
            var user = userState[0];
            var setUser = userState[1];

            var profileState = useState(null);
            var profile = profileState[0];
            var setProfile = profileState[1];

            var guestState = useState(false);
            var isGuest = guestState[0];
            var setIsGuest = guestState[1];

            var loadingState = useState(true);
            var loading = loadingState[0];
            var setLoading = loadingState[1];

            /**
             * Загрузка профиля из таблицы profiles по ID пользователя.
             * Вызывается после входа, регистрации и при обновлении данных.
             */
            var loadProfile = useCallback(async function(userId) {
                if (!supabase) return;
                try {
                    var result = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', userId)
                        .single();

                    if (result.data && !result.error) {
                        setProfile(result.data);
                    }
                } catch (err) {
                    console.error('Ошибка загрузки профиля:', err);
                }
            }, []);

            // При монтировании: проверяем существующую сессию (авто-вход)
            useEffect(function() {
                if (!supabase) {
                    setLoading(false);
                    return;
                }

                // Проверяем сохранённую сессию
                supabase.auth.getSession().then(function(result) {
                    var session = result.data ? result.data.session : null;
                    if (session && session.user) {
                        setUser(session.user);
                        loadProfile(session.user.id);
                    }
                    setLoading(false);
                }).catch(function() {
                    setLoading(false);
                });

                // Слушаем изменения состояния auth (вход/выход)
                var listener = supabase.auth.onAuthStateChange(function(event, session) {
                    if (session && session.user) {
                        setUser(session.user);
                        loadProfile(session.user.id);
                    } else {
                        setUser(null);
                        setProfile(null);
                    }
                });

                // Очищаем подписку при размонтировании
                return function() {
                    if (listener && listener.data && listener.data.subscription) {
                        listener.data.subscription.unsubscribe();
                    }
                };
            }, [loadProfile]);

            /**
             * Регистрация нового пользователя.
             * 1. Создаёт аккаунт в Supabase Auth (email + password)
             * 2. Триггер handle_new_user автоматически создаёт запись в profiles
             * 3. Если выбрана аватарка — сжимает, загружает в Storage, обновляет профиль
             */
            async function register(email, password, username, avatarFile) {
                if (!supabase) throw new Error('Supabase не подключён');

                var result = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { username: username }
                    }
                });

                if (result.error) {
                    throw result.error;
                }

                // Загрузка аватарки если пользователь выбрал файл
                if (avatarFile && result.data && result.data.user) {
                    try {
                        var extension = avatarFile.name.split('.').pop() || 'jpg';
                        var avatarPath = result.data.user.id + '/avatar.' + extension;
                        var compressedBlob = await compressImage(avatarFile, 400, 0.8);

                        await supabase.storage.from('avatars').upload(avatarPath, compressedBlob, {
                            upsert: true,
                            contentType: 'image/jpeg'
                        });

                        var urlResult = supabase.storage.from('avatars').getPublicUrl(avatarPath);
                        var publicUrl = urlResult.data.publicUrl;

                        await supabase.from('profiles').update({
                            avatar_url: publicUrl
                        }).eq('id', result.data.user.id);
                    } catch (avatarErr) {
                        console.error('Ошибка загрузки аватарки:', avatarErr);
                        // Не блокируем регистрацию если аватарка не загрузилась
                    }
                }

                // Загружаем свежий профиль
                if (result.data && result.data.user) {
                    await loadProfile(result.data.user.id);
                }

                return result.data;
            }

            /**
             * Вход по email и паролю.
             */
            async function login(email, password) {
                if (!supabase) throw new Error('Supabase не подключён');

                var result = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (result.error) {
                    throw result.error;
                }

                return result.data;
            }

            /**
             * Выход из аккаунта.
             */
            async function logout() {
                if (supabase) {
                    await supabase.auth.signOut();
                }
                setUser(null);
                setProfile(null);
                setIsGuest(false);
            }

            /**
             * Переключение в гостевой режим.
             * Гость может только смотреть контент и ставить лайки.
             */
            function enterGuestMode() {
                setIsGuest(true);
                setUser(null);
                setProfile(null);
            }

            /**
             * Обновление данных профиля из БД.
             * Вызывается после активации промокода, удаления поста и т.д.
             */
            var refreshProfile = useCallback(async function() {
                if (user) {
                    await loadProfile(user.id);
                }
            }, [user, loadProfile]);

            // Значение контекста
            var contextValue = {
                user: user,
                profile: profile,
                isGuest: isGuest,
                loading: loading,
                register: register,
                login: login,
                logout: logout,
                guest: enterGuestMode,
                refreshProfile: refreshProfile
            };

            return (
                <AuthContext.Provider value={contextValue}>
                    {children}
                </AuthContext.Provider>
            );
        }

        /**
         * Хук для получения данных авторизации из контекста.
         */
        function useAuth() {
            return useContext(AuthContext);
        }


        // ================================================================
        // 🎨 КОМПОНЕНТ АВATARA
        // Градиентная обводка + неоновая галочка для премиум.
        // Синяя обводка для обычных пользователей.
        // ================================================================
        function Avatar(props) {
            var src = props.src;
            var size = props.size || 40;
            var isPremium = props.isPremium || false;
            var showCheck = props.showCheck !== undefined ? props.showCheck : true;
            var extraClass = props.className || '';

            // Выбираем класс обводки
            var ringClass = isPremium ? 'ring-premium' : (src ? 'ring-free' : '');

            return (
                <div className={'relative inline-block ' + extraClass}>
                    <div className={ringClass}>
                        <div
                            className="bg-dark rounded-full overflow-hidden"
                            style={{ width: size + 'px', height: size + 'px' }}
                        >
                            {src ? (
                                <img
                                    src={src}
                                    alt=""
                                    className="w-full h-full object-cover"
                                />
                            ) : (
                                <div className="w-full h-full flex items-center justify-center bg-darkCard">
                                    <Icon name="user" size={Math.round(size * 0.5)} />
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Неоновая градиентная галочка для премиум */}
                    {showCheck && isPremium && (
                        <div className="absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full badge-premium flex items-center justify-center border-2 border-dark">
                            <Icon name="check" size={12} className="text-white" />
                        </div>
                    )}
                </div>
            );
        }


        // ================================================================
        // 🚪 ЭКРАН АВТОРИЗАЦИИ
        // Приветствие → Регистрация / Вход / Гость
        // ================================================================
        function AuthScreen() {
            var auth = useAuth();

            var modeState = useState('welcome');
            var mode = modeState[0];
            var setMode = modeState[1];

            var emailState = useState('');
            var email = emailState[0];
            var setEmail = emailState[1];

            var passwordState = useState('');
            var password = passwordState[0];
            var setPassword = passwordState[1];

            var usernameState = useState('');
            var username = usernameState[0];
            var setUsername = usernameState[1];

            var avatarFileState = useState(null);
            var avatarFile = avatarFileState[0];
            var setAvatarFile = avatarFileState[1];

            var avatarPreviewState = useState('');
            var avatarPreview = avatarPreviewState[0];
            var setAvatarPreview = avatarPreviewState[1];

            var errorState = useState('');
            var errorMsg = errorState[0];
            var setErrorMsg = errorState[1];

            var busyState = useState(false);
            var isBusy = busyState[0];
            var setIsBusy = busyState[1];

            var fileInputRef = useRef(null);

            // Обработка выбора файла аватарки
            function onAvatarFileChange(e) {
                var file = e.target.files && e.target.files[0];
                if (!file) return;
                setAvatarFile(file);
                setAvatarPreview(URL.createObjectURL(file));
            }

            // Регистрация
            async function handleRegister() {
                setErrorMsg('');
                setIsBusy(true);
                try {
                    await auth.register(email, password, username, avatarFile);
                } catch (err) {
                    setErrorMsg(err.message || 'Ошибка регистрации');
                }
                setIsBusy(false);
            }

            // Вход
            async function handleLogin() {
                setErrorMsg('');
                setIsBusy(true);
                try {
                    await auth.login(email, password);
                } catch (err) {
                    setErrorMsg(err.message || 'Неверный email или пароль');
                }
                setIsBusy(false);
            }

            // --- ЭКРАН ПРИВЕТСТВИЯ ---
            if (mode === 'welcome') {
                return (
                    <div className="fixed inset-0 z-50 bg-dark flex flex-col items-center justify-center p-6 animate-fade-in">
                        {/* Логотип с пульсацией */}
                        <div className="w-24 h-24 rounded-3xl bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center mb-6 pulse-glow">
                            <Icon name="pulse" size={44} className="text-white" />
                        </div>

                        <h1 className="text-4xl font-bold mb-1 bg-gradient-to-r from-primary to-purple-400 bg-clip-text text-transparent">
                            Пульс
                        </h1>
                        <p className="text-slate-400 mb-12 text-sm">Твой ритм. Твои правила.</p>

                        <button
                            onClick={function() { setMode('register'); }}
                            className="w-full max-w-xs bg-primary py-3.5 rounded-xl font-bold mb-3 active:scale-95 transition shadow-lg shadow-primary/30"
                        >
                            Зарегистрироваться
                        </button>

                        <button
                            onClick={function() { setMode('login'); }}
                            className="w-full max-w-xs bg-darkCard border border-darkBorder py-3.5 rounded-xl font-semibold mb-3 active:scale-95 transition"
                        >
                            Войти
                        </button>

                        <button
                            onClick={auth.guest}
                            className="w-full max-w-xs text-slate-500 py-3 text-sm active:scale-95 transition"
                        >
                            Продолжить как гость
                        </button>
                    </div>
                );
            }

            // --- ЭКРАН РЕГИСТРАЦИИ / ВХОДА ---
            var isRegisterMode = (mode === 'register');
            var canSubmit = email && password && (!isRegisterMode || username);

            return (
                <div className="fixed inset-0 z-50 bg-dark p-6 animate-fade-in overflow-y-auto">
                    {/* Кнопка назад */}
                    <button
                        onClick={function() { setMode('welcome'); setErrorMsg(''); }}
                        className="p-2 text-slate-400 mb-4"
                    >
                        <Icon name="x" />
                    </button>

                    <h2 className="text-2xl font-bold mb-6">
                        {isRegisterMode ? 'Создай профиль' : 'Вход в аккаунт'}
                    </h2>

                    {/* Выбор аватарки (только при регистрации) */}
                    {isRegisterMode && (
                        <div className="flex flex-col items-center mb-6">
                            <div
                                className="relative cursor-pointer"
                                onClick={function() { if (fileInputRef.current) fileInputRef.current.click(); }}
                            >
                                {avatarPreview ? (
                                    <img
                                        src={avatarPreview}
                                        className="w-24 h-24 rounded-full object-cover border-4 border-primary"
                                        alt="preview"
                                    />
                                ) : (
                                    <div className="w-24 h-24 rounded-full bg-darkCard border-4 border-dashed border-darkBorder flex items-center justify-center">
                                        <Icon name="camera" size={32} className="text-slate-500" />
                                    </div>
                                )}
                                <div className="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full border-2 border-dark">
                                    <Icon name="edit" size={12} />
                                </div>
                            </div>
                            <input
                                ref={fileInputRef}
                                type="file"
                                accept="image/*"
                                className="hidden"
                                onChange={onAvatarFileChange}
                            />
                            <p className="text-xs text-slate-500 mt-2">Нажми, чтобы выбрать фото с устройства</p>
                        </div>
                    )}

                    {/* Поле имени пользователя (только при регистрации) */}
                    {isRegisterMode && (
                        <input
                            type="text"
                            placeholder="Имя пользователя"
                            value={username}
                            onChange={function(e) { setUsername(e.target.value); }}
                            className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-3 outline-none focus:border-primary transition text-white"
                        />
                    )}

                    {/* Поле email */}
                    <input
                        type="email"
                        placeholder="Email"
                        value={email}
                        onChange={function(e) { setEmail(e.target.value); }}
                        className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-3 outline-none focus:border-primary transition text-white"
                    />

                    {/* Поле пароля */}
                    <input
                        type="password"
                        placeholder="Пароль"
                        value={password}
                        onChange={function(e) { setPassword(e.target.value); }}
                        className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-4 outline-none focus:border-primary transition text-white"
                    />

                    {/* Сообщение об ошибке */}
                    {errorMsg && (
                        <p className="text-red-400 text-sm mb-3 text-center">{errorMsg}</p>
                    )}

                    {/* Основная кнопка */}
                    <button
                        disabled={isBusy || !canSubmit}
                        onClick={isRegisterMode ? handleRegister : handleLogin}
                        className={
                            'w-full py-4 rounded-xl font-bold transition active:scale-95 flex items-center justify-center gap-2 ' +
                            (canSubmit && !isBusy ? 'bg-primary text-white' : 'bg-darkCard text-slate-600')
                        }
                    >
                        {isBusy && (
                            <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full spinner" />
                        )}
                        {isRegisterMode ? 'Создать аккаунт' : 'Войти'}
                    </button>

                    {/* Переключение между регистрацией и входом */}
                    <p className="text-center text-sm text-slate-500 mt-4">
                        {isRegisterMode ? 'Уже есть аккаунт? ' : 'Нет аккаунта? '}
                        <button
                            onClick={function() {
                                setMode(isRegisterMode ? 'login' : 'register');
                                setErrorMsg('');
                            }}
                            className="text-primary font-semibold"
                        >
                            {isRegisterMode ? 'Войти' : 'Зарегистрироваться'}
                        </button>
                    </p>
                </div>
            );
        }


        // ================================================================
        // 🏠 HEADER (Шапка приложения)
        // ================================================================
        function Header() {
            return (
                <header className="sticky top-0 z-40 bg-dark/90 backdrop-blur-xl border-b border-darkBorder">
                    <div className="flex items-center justify-between px-4 h-14">
                        {/* Логотип */}
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center">
                                <Icon name="pulse" size={18} className="text-white" />
                            </div>
                            <h1 className="text-xl font-bold bg-gradient-to-r from-primary to-purple-400 bg-clip-text text-transparent">
                                Пульс
                            </h1>
                        </div>

                        {/* Кнопки уведомлений */}
                        <div className="flex gap-1">
                            <button className="p-2 rounded-full hover:bg-darkCard relative transition">
                                <Icon name="heart" size={22} />
                                <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
                            </button>
                            <button className="p-2 rounded-full hover:bg-darkCard transition">
                                <Icon name="comment" size={22} />
                            </button>
                        </div>
                    </div>
                </header>
            );
        }


        // ================================================================
        // 🏠 ГЛАВНАЯ СТРАНИЦА
        // Поиск + Сторис друзей + Фото/видео лента
        // ================================================================
        function HomePage() {
            var auth = useAuth();
            var user = auth.user;
            var profile = auth.profile;
            var refreshProfile = auth.refreshProfile;

            var queryState = useState('');
            var searchQuery = queryState[0];
            var setSearchQuery = queryState[1];

            var postsState = useState([]);
            var posts = postsState[0];
            var setPosts = postsState[1];

            var storiesState = useState([]);
            var stories = storiesState[0];
            var setStories = storiesState[1];

            var activeStoryState = useState(null);
            var activeStory = activeStoryState[0];
            var setActiveStory = activeStoryState[1];

            var loadingState = useState(true);
            var isLoading = loadingState[0];
            var setIsLoading = loadingState[1];

            var storyFileRef = useRef(null);

            /**
             * Загрузка постов из Supabase.
             * Поддерживает поиск по описанию через ilike.
             */
            var fetchPosts = useCallback(async function() {
                if (!supabase) return;
                setIsLoading(true);

                try {
                    var query;
                    if (searchQuery) {
                        query = supabase
                            .from('posts')
                            .select('*, profiles(username, avatar_url, is_premium)')
                            .or('caption.ilike.%' + searchQuery + '%')
                            .order('created_at', { ascending: false })
                            .limit(50);
                    } else {
                        query = supabase
                            .from('posts')
                            .select('*, profiles(username, avatar_url, is_premium)')
                            .order('created_at', { ascending: false })
                            .limit(50);
                    }

                    var result = await query;
                    setPosts(result.data || []);
                } catch (err) {
                    console.error('Ошибка загрузки постов:', err);
                }

                setIsLoading(false);
            }, [searchQuery]);

            /**
             * Загрузка сторис за последние 24 часа.
             */
            var fetchStories = useCallback(async function() {
                if (!supabase) return;

                try {
                    var cutoff = new Date(Date.now() - 86400000).toISOString();
                    var result = await supabase
                        .from('stories')
                        .select('*, profiles(username, avatar_url, is_premium)')
                        .gte('created_at', cutoff)
                        .order('created_at', { ascending: false });

                    setStories(result.data || []);
                } catch (err) {
                    console.error('Ошибка загрузки сторис:', err);
                }
            }, []);

            // Загружаем данные при монтировании и при изменении поиска
            useEffect(function() {
                fetchPosts();
                fetchStories();
            }, [fetchPosts, fetchStories]);

            /**
             * Загрузка своей сторис.
             * Сжимает → загружает в Storage → создаёт запись в таблице stories.
             */
            async function handleStoryUpload(e) {
                var file = e.target.files && e.target.files[0];
                if (!file || !user) return;

                try {
                    var blob = await compressImage(file, 1080, 0.8);
                    var path = user.id + '/story_' + Date.now() + '.jpg';

                    var uploadResult = await supabase.storage.from('posts').upload(path, blob, {
                        contentType: 'image/jpeg'
                    });

                    if (uploadResult.error) {
                        alert('Ошибка загрузки сторис: ' + uploadResult.error.message);
                        return;
                    }

                    var urlResult = supabase.storage.from('posts').getPublicUrl(path);
                    var publicUrl = urlResult.data.publicUrl;

                    await supabase.from('stories').insert({
                        user_id: user.id,
                        media_url: publicUrl
                    });

                    fetchStories();
                } catch (err) {
                    console.error('Ошибка создания сторис:', err);
                    alert('Ошибка: ' + err.message);
                }
            }

            /**
             * Удаление своего поста.
             * RPC функция также восстанавливает недельный лимит.
             */
            async function handleDeletePost(postId) {
                if (!confirm('Удалить пост? Лимит восстановится.')) return;

                try {
                    await supabase.rpc('delete_post_and_restore', { p_post_id: postId });
                    refreshProfile();
                    fetchPosts();
                } catch (err) {
                    console.error('Ошибка удаления:', err);
                    alert('Ошибка удаления: ' + err.message);
                }
            }

            // Фильтруем чужие сторис (своя показывается отдельно)
            var otherStories = stories.filter(function(s) {
                return !user || s.user_id !== user.id;
            });

            return (
                <div className="animate-fade-in pb-20">

                    {/* Строка поиска (прилипает под header) */}
                    <div className="px-4 py-3 sticky top-14 z-30 bg-dark/95 backdrop-blur-md">
                        <div className="relative">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
                                <Icon name="search" size={18} />
                            </div>
                            <input
                                type="text"
                                placeholder="Поиск по имени или описанию..."
                                value={searchQuery}
                                onChange={function(e) { setSearchQuery(e.target.value); }}
                                className="w-full bg-darkCard border border-darkBorder rounded-xl py-3 pl-10 pr-10 text-sm outline-none focus:border-primary transition placeholder-slate-500 text-white"
                            />
                            {searchQuery && (
                                <button
                                    onClick={function() { setSearchQuery(''); }}
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"
                                >
                                    <Icon name="x" size={16} />
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Сторис (горизонтальный скролл) */}
                    <div className="px-4 py-3 border-b border-darkBorder">
                        <div className="flex gap-4 overflow-x-auto no-scrollbar pb-1">

                            {/* Кнопка добавления своей истории */}
                            <div
                                className="flex flex-col items-center gap-1 min-w-[68px] cursor-pointer"
                                onClick={function() { if (storyFileRef.current) storyFileRef.current.click(); }}
                            >
                                <div className="relative w-16 h-16 rounded-full bg-darkCard border-2 border-dashed border-darkBorder overflow-hidden">
                                    {profile && profile.avatar_url ? (
                                        <img src={profile.avatar_url} className="w-full h-full object-cover opacity-60" alt="" />
                                    ) : (
                                        <div className="w-full h-full flex items-center justify-center">
                                            <Icon name="user" size={24} className="text-slate-600" />
                                        </div>
                                    )}
                                    <div className="absolute -bottom-0.5 -right-0.5 w-6 h-6 bg-primary rounded-full flex items-center justify-center border-2 border-dark">
                                        <span className="text-white text-sm font-bold leading-none">+</span>
                                    </div>
                                </div>
                                <input
                                    ref={storyFileRef}
                                    type="file"
                                    accept="image/*"
                                    className="hidden"
                                    onChange={handleStoryUpload}
                                />
                                <span className="text-[11px] text-slate-400 w-16 text-center truncate">Ваша</span>
                            </div>

                            {/* Чужие истории */}
                            {otherStories.map(function(story) {
                                var storyProfile = story.profiles;
                                var shortName = (storyProfile && storyProfile.username ? storyProfile.username : 'user').split('_')[0];

                                return (
                                    <button
                                        key={story.id}
                                        onClick={function() { setActiveStory(story); }}
                                        className="flex flex-col items-center gap-1 min-w-[68px]"
                                    >
                                        <Avatar
                                            src={storyProfile ? storyProfile.avatar_url : null}
                                            size={60}
                                            isPremium={storyProfile ? storyProfile.is_premium : false}
                                        />
                                        <span className="text-[11px] text-slate-300 w-16 text-center truncate">
                                            {shortName}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Лента постов */}
                    {isLoading ? (
                        <div className="flex justify-center py-20">
                            <div className="w-8 h-8 border-2 border-primary border-t-transparent rounded-full spinner" />
                        </div>
                    ) : posts.length > 0 ? (
                        posts.map(function(post) {
                            var postProfile = post.profiles;
                            var isOwnPost = user && user.id === post.user_id;

                            return (
                                <article key={post.id} className="border-b border-darkBorder">

                                    {/* Шапка поста */}
                                    <div className="flex items-center justify-between px-4 py-3">
                                        <div className="flex items-center gap-3">
                                            <Avatar
                                                src={postProfile ? postProfile.avatar_url : null}
                                                size={36}
                                                isPremium={postProfile ? postProfile.is_premium : false}
                                            />
                                            <div>
                                                <div className="flex items-center gap-1">
                                                    <p className="text-sm font-semibold">
                                                        {postProfile ? postProfile.username : 'unknown'}
                                                    </p>
                                                    {postProfile && postProfile.is_premium && (
                                                        <span className="text-[10px] bg-gradient-to-r from-orange-500 to-pink-500 text-white px-1.5 rounded font-bold">
                                                            PRO
                                                        </span>
                                                    )}
                                                </div>
                                                <p className="text-xs text-slate-500">
                                                    {formatTimeAgo(post.created_at)} • {post.quality} • {post.fps} FPS
                                                </p>
                                            </div>
                                        </div>

                                        {/* Кнопка удаления (только свои посты) */}
                                        {isOwnPost && (
                                            <button
                                                onClick={function() { handleDeletePost(post.id); }}
                                                className="text-red-400 p-2 hover:bg-red-500/10 rounded-lg transition"
                                            >
                                                <Icon name="trash" size={18} />
                                            </button>
                                        )}
                                    </div>

                                    {/* Медиа контент */}
                                    <div className="relative bg-black">
                                        {post.media_items && post.media_items.length === 1 ? (
                                            /* Одно медиа */
                                            post.media_items[0].type === 'video' ? (
                                                <video
                                                    src={post.media_items[0].url}
                                                    controls
                                                    playsInline
                                                    className="w-full max-h-[500px] object-cover"
                                                />
                                            ) : (
                                                <img
                                                    src={post.media_items[0].url}
                                                    className="w-full object-cover max-h-[550px]"
                                                    loading="lazy"
                                                    alt=""
                                                />
                                            )
                                        ) : (
                                            /* Карусель из нескольких медиа */
                                            <div className="relative">
                                                <div className="media-carousel flex">
                                                    {(post.media_items || []).map(function(item, idx) {
                                                        return (
                                                            <div key={idx} className="media-carousel-item">
                                                                {item.type === 'video' ? (
                                                                    <video
                                                                        src={item.url}
                                                                        controls
                                                                        playsInline
                                                                        className="w-full max-h-[500px] object-cover"
                                                                    />
                                                                ) : (
                                                                    <img
                                                                        src={item.url}
                                                                        className="w-full object-cover max-h-[550px]"
                                                                        loading="lazy"
                                                                        alt=""
                                                                    />
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="absolute bottom-3 right-3 bg-black/60 px-2 py-1 rounded-full text-xs font-bold backdrop-blur-sm">
                                                    {post.media_items.length} медиа
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Кнопки действий */}
                                    <div className="flex items-center gap-4 px-4 py-3">
                                        <button className="active:scale-125 transition">
                                            <Icon name="heart" />
                                        </button>
                                        <button className="active:scale-110 transition">
                                            <Icon name="comment" />
                                        </button>
                                        <button className="active:scale-110 transition">
                                            <Icon name="share" />
                                        </button>
                                        <div className="flex-1" />
                                        <button className="active:scale-110 transition">
                                            <Icon name="bookmark" />
                                        </button>
                                    </div>

                                    {/* Подпись */}
                                    <div className="px-4 pb-4">
                                        <p className="text-sm">
                                            <span className="font-semibold mr-2">
                                                {postProfile ? postProfile.username : 'unknown'}
                                            </span>
                                            <span className="text-slate-300">{post.caption}</span>
                                        </p>
                                    </div>
                                </article>
                            );
                        })
                    ) : (
                        /* Пустое состояние */
                        <div className="flex flex-col items-center justify-center py-20 px-6 text-center">
                            <Icon name="pulse" size={48} className="text-slate-700 mb-4" />
                            <p className="text-slate-500 text-lg font-semibold mb-2">Лента пуста</p>
                            <p className="text-slate-600 text-sm">Нажми «+» и выложи первый пост!</p>
                        </div>
                    )}

                    {/* Оверлей просмотра сторис */}
                    {activeStory && (
                        <div
                            className="fixed inset-0 z-[100] bg-black flex items-center justify-center"
                            onClick={function() { setActiveStory(null); }}
                        >
                            <div
                                className="relative w-full max-w-md h-full"
                                onClick={function(e) { e.stopPropagation(); }}
                            >
                                <div className="absolute top-6 left-3 right-3 z-10 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <Avatar
                                            src={activeStory.profiles ? activeStory.profiles.avatar_url : null}
                                            size={32}
                                            isPremium={activeStory.profiles ? activeStory.profiles.is_premium : false}
                                        />
                                        <span className="text-sm font-semibold">
                                            {activeStory.profiles ? activeStory.profiles.username : ''}
                                        </span>
                                    </div>
                                    <button onClick={function() { setActiveStory(null); }}>
                                        <Icon name="x" />
                                    </button>
                                </div>
                                <img
                                    src={activeStory.media_url}
                                    className="w-full h-full object-contain"
                                    alt=""
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        }


        // ================================================================
        // 🎬 ЛЕНТА ВИДЕО (TikTok-стиль)
        // Вертикальный скролл, автоплей через IntersectionObserver
        // ================================================================
        function FeedPage() {
            var videosState = useState([]);
            var videos = videosState[0];
            var setVideos = videosState[1];

            var activeIdxState = useState(0);
            var activeIdx = activeIdxState[0];
            var setActiveIdx = activeIdxState[1];

            var loadingState = useState(true);
            var isLoading = loadingState[0];
            var setIsLoading = loadingState[1];

            var containerRef = useRef(null);

            // Загрузка видео-постов из Supabase
            useEffect(function() {
                async function loadVideos() {
                    if (!supabase) { setIsLoading(false); return; }

                    try {
                        var result = await supabase
                            .from('posts')
                            .select('*, profiles(username, avatar_url, is_premium)')
                            .order('created_at', { ascending: false })
                            .limit(30);

                        var allPosts = result.data || [];
                        var videoPosts = allPosts.filter(function(p) {
                            return p.media_items && p.media_items.some(function(m) {
                                return m.type === 'video';
                            });
                        });

                        setVideos(videoPosts);
                    } catch (err) {
                        console.error('Ошибка загрузки видео:', err);
                    }

                    setIsLoading(false);
                }

                loadVideos();
            }, []);

            // IntersectionObserver для автоплея текущего видео
            useEffect(function() {
                if (!videos.length || !containerRef.current) return;

                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            var idx = Number(entry.target.getAttribute('data-idx'));
                            setActiveIdx(idx);
                        }
                    });
                }, {
                    threshold: 0.6,
                    root: containerRef.current
                });

                var items = containerRef.current.querySelectorAll('.tiktok-item');
                items.forEach(function(el) { observer.observe(el); });

                return function() { observer.disconnect(); };
            }, [videos]);

            // Состояние загрузки
            if (isLoading) {
                return (
                    <div className="h-full flex justify-center items-center">
                        <div className="w-8 h-8 border-2 border-primary border-t-transparent rounded-full spinner" />
                    </div>
                );
            }

            // Пустое состояние
            if (!videos.length) {
                return (
                    <div className="h-full flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                        <Icon name="play" size={48} className="text-slate-700 mb-4" />
                        <p className="text-slate-500 text-lg font-semibold">Видео пока нет</p>
                        <p className="text-slate-600 text-sm mt-2">Выложи первое видео через кнопку «+»!</p>
                    </div>
                );
            }

            return (
                <div ref={containerRef} className="tiktok-feed h-full">
                    {videos.map(function(video, index) {
                        var firstVideoItem = null;
                        if (video.media_items) {
                            for (var i = 0; i < video.media_items.length; i++) {
                                if (video.media_items[i].type === 'video') {
                                    firstVideoItem = video.media_items[i];
                                    break;
                                }
                            }
                        }

                        var videoProfile = video.profiles;

                        return (
                            <div
                                key={video.id}
                                data-idx={index}
                                className="tiktok-item relative bg-black"
                                style={{ height: 'calc(100dvh - 64px)' }}
                            >
                                {/* Видео с автоплеем */}
                                <video
                                    src={firstVideoItem ? firstVideoItem.url : ''}
                                    loop
                                    playsInline
                                    muted
                                    ref={function(el) {
                                        if (el && index === activeIdx) {
                                            el.play().catch(function() {});
                                        }
                                        if (el && index !== activeIdx) {
                                            el.pause();
                                        }
                                    }}
                                    className="w-full h-full object-cover"
                                />

                                {/* Метка качества и FPS */}
                                <div className="absolute top-4 right-4 bg-black/50 px-2 py-1 rounded text-xs font-bold backdrop-blur-sm">
                                    {video.fps} FPS • {video.quality}
                                </div>

                                {/* Информация об авторе */}
                                <div className="absolute bottom-6 left-4 right-16 z-10">
                                    <div className="flex items-center gap-2 mb-2">
                                        <Avatar
                                            src={videoProfile ? videoProfile.avatar_url : null}
                                            size={32}
                                            isPremium={videoProfile ? videoProfile.is_premium : false}
                                        />
                                        <span className="font-bold text-sm">
                                            @{videoProfile ? videoProfile.username : 'unknown'}
                                        </span>
                                    </div>
                                    <p className="text-sm text-white/90 leading-snug">{video.caption}</p>
                                </div>

                                {/* Правая панель действий */}
                                <div className="absolute right-3 bottom-8 flex flex-col items-center gap-5 z-10">
                                    <button className="flex flex-col items-center">
                                        <div className="p-3 rounded-full bg-black/30 backdrop-blur-sm">
                                            <Icon name="heart" />
                                        </div>
                                        <span className="text-xs mt-1">{formatCount(video.likes_count)}</span>
                                    </button>
                                    <button className="flex flex-col items-center">
                                        <div className="p-3 rounded-full bg-black/30 backdrop-blur-sm">
                                            <Icon name="comment" />
                                        </div>
                                        <span className="text-xs mt-1">{formatCount(video.comments_count)}</span>
                                    </button>
                                    <button>
                                        <div className="p-3 rounded-full bg-black/30 backdrop-blur-sm">
                                            <Icon name="share" />
                                        </div>
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }


        // ================================================================
        // ➕ СТРАНИЦА СОЗДАНИЯ ПОСТА
        // Выбор фото/видео (до 4 объектов), проверка лимитов,
        // загрузка в Supabase Storage, создание записи в БД
        // ================================================================
        function CreatePage() {
            var auth = useAuth();
            var user = auth.user;
            var profile = auth.profile;
            var refreshProfile = auth.refreshProfile;

            var itemsState = useState([]);
            var mediaItems = itemsState[0];
            var setMediaItems = itemsState[1];

            var captionState = useState('');
            var caption = captionState[0];
            var setCaption = captionState[1];

            var statusState = useState(null);
            var status = statusState[0];
            var setStatus = statusState[1];

            var limitInfoState = useState(null);
            var limitInfo = limitInfoState[0];
            var setLimitInfo = limitInfoState[1];

            var uploadingState = useState(false);
            var isUploading = uploadingState[0];
            var setIsUploading = uploadingState[1];

            var fileInputRef = useRef(null);

            // Если нет аккаунта
            if (!user) {
                return (
                    <div className="h-full flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                        <Icon name="lock" size={40} className="text-slate-600 mb-4" />
                        <h2 className="text-xl font-bold mb-2">Нужен аккаунт</h2>
                        <p className="text-slate-400 text-sm">Зарегистрируйся, чтобы публиковать посты</p>
                    </div>
                );
            }

            /**
             * Обработка выбора файлов.
             * Проверяет: максимум 4 объекта, видео не длиннее 60 сек.
             * Фото сжимаются через Canvas API.
             */
            async function handleFilesSelected(e) {
                var files = e.target.files ? Array.from(e.target.files) : [];
                if (files.length === 0) return;

                if (mediaItems.length + files.length > 4) {
                    alert('Максимум 4 объекта в одном посте!');
                    return;
                }

                var newItems = [];

                for (var i = 0; i < files.length; i++) {
                    var file = files[i];

                    if (file.type.startsWith('video/')) {
                        // Проверка длительности видео
                        var duration = await getVideoDuration(file);
                        if (duration > 60) {
                            alert('Видео "' + file.name + '" длиннее 60 секунд! Максимум 60 сек.');
                            continue;
                        }
                        newItems.push({
                            type: 'video',
                            file: file,
                            preview: URL.createObjectURL(file)
                        });
                    } else {
                        // Сжатие фото
                        try {
                            var compressedBlob = await compressImage(file, 1080, 0.7);
                            newItems.push({
                                type: 'photo',
                                file: compressedBlob,
                                preview: URL.createObjectURL(compressedBlob)
                            });
                        } catch (compressErr) {
                            console.error('Ошибка сжатия:', compressErr);
                            // Добавляем оригинал если сжатие не удалось
                            newItems.push({
                                type: 'photo',
                                file: file,
                                preview: URL.createObjectURL(file)
                            });
                        }
                    }
                }

                setMediaItems(function(prev) {
                    return prev.concat(newItems);
                });
            }

            // Удаление элемента из превью
            function removeItem(idx) {
                setMediaItems(function(prev) {
                    return prev.filter(function(_, i) { return i !== idx; });
                });
            }

            /**
             * Публикация поста.
             * 1. Проверяет недельный лимит из БД
             * 2. Загружает каждый файл в Supabase Storage
             * 3. Создаёт запись в таблице posts
             */
            async function handlePublish() {
                if (mediaItems.length === 0) return;

                // Свежая проверка лимита
                await refreshProfile();

                var profileResult;
                try {
                    profileResult = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', user.id)
                        .single();
                } catch (err) {
                    setStatus('err');
                    setTimeout(function() { setStatus(null); }, 3000);
                    return;
                }

                var freshProfile = profileResult.data;
                if (!freshProfile) {
                    setStatus('err');
                    setTimeout(function() { setStatus(null); }, 3000);
                    return;
                }

                var now = Date.now();
                var postsThisWeek = freshProfile.posts_this_week || 0;

                // Сброс счётчика если неделя прошла
                if (now > new Date(freshProfile.week_reset).getTime()) {
                    postsThisWeek = 0;
                }

                var limit = freshProfile.is_premium ? 6 : 2;

                if (postsThisWeek >= limit) {
                    setLimitInfo({
                        limit: limit,
                        used: postsThisWeek,
                        isPremium: freshProfile.is_premium
                    });
                    setStatus('limit');
                    return;
                }

                setIsUploading(true);

                try {
                    // Загрузка каждого файла в Storage
                    var uploadedItems = [];

                    for (var i = 0; i < mediaItems.length; i++) {
                        var item = mediaItems[i];
                        var ext = item.type === 'video' ? 'mp4' : 'jpg';
                        var fileName = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
                        var storagePath = user.id + '/' + fileName;
                        var contentType = item.type === 'video' ? 'video/mp4' : 'image/jpeg';

                        var uploadResult = await supabase.storage.from('posts').upload(storagePath, item.file, {
                            contentType: contentType
                        });

                        if (uploadResult.error) {
                            throw uploadResult.error;
                        }

                        var urlResult = supabase.storage.from('posts').getPublicUrl(storagePath);
                        uploadedItems.push({
                            type: item.type,
                            url: urlResult.data.publicUrl
                        });
                    }

                    // Создание записи поста в БД
                    var insertResult = await supabase.from('posts').insert({
                        user_id: user.id,
                        media_items: uploadedItems,
                        caption: caption,
                        fps: freshProfile.is_premium ? 60 : 30,
                        quality: freshProfile.is_premium ? 'HD' : 'SD'
                    });

                    if (insertResult.error) {
                        throw insertResult.error;
                    }

                    // Успех
                    refreshProfile();
                    setCaption('');
                    setMediaItems([]);
                    setStatus('ok');
                    setTimeout(function() { setStatus(null); }, 2000);

                } catch (err) {
                    console.error('Ошибка публикации:', err);
                    setStatus('err');
                    setTimeout(function() { setStatus(null); }, 3000);
                }

                setIsUploading(false);
            }

            var currentLimit = profile ? (profile.is_premium ? 6 : 2) : 2;
            var currentUsed = profile ? (profile.posts_this_week || 0) : 0;

            return (
                <div className="p-5 animate-fade-in pb-24">
                    <h2 className="text-2xl font-bold mb-5">Новый пост</h2>

                    {/* Индикатор недельного лимита */}
                    <div className="bg-darkCard rounded-xl p-4 border border-darkBorder mb-5">
                        <div className="flex justify-between mb-2">
                            <span className="text-sm text-slate-400">Лимит недели</span>
                            <span className={'text-sm font-bold ' + (profile && profile.is_premium ? 'text-yellow-400' : '')}>
                                {currentUsed} / {currentLimit}
                            </span>
                        </div>
                        <div className="w-full h-2 bg-darkBorder rounded-full overflow-hidden">
                            <div
                                className={'h-full transition-all ' + (profile && profile.is_premium ? 'bg-yellow-400' : 'bg-primary')}
                                style={{ width: Math.min((currentUsed / currentLimit) * 100, 100) + '%' }}
                            />
                        </div>
                        <p className="text-xs text-slate-500 mt-2">
                            {profile && profile.is_premium
                                ? '👑 Premium: до 6 постов, 60 FPS, HD'
                                : 'Free: 2 поста, 30 FPS, SD (480p)'}
                        </p>
                    </div>

                    {/* Превью выбранных медиа */}
                    {mediaItems.length > 0 && (
                        <div className="mb-5">
                            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                                {mediaItems.map(function(item, idx) {
                                    return (
                                        <div key={idx} className="relative min-w-[100px] h-[100px] rounded-xl overflow-hidden border border-darkBorder">
                                            {item.type === 'video' ? (
                                                <video src={item.preview} className="w-full h-full object-cover" />
                                            ) : (
                                                <img src={item.preview} className="w-full h-full object-cover" alt="" />
                                            )}
                                            <button
                                                onClick={function() { removeItem(idx); }}
                                                className="absolute top-1 right-1 bg-black/70 rounded-full p-1"
                                            >
                                                <Icon name="x" size={12} />
                                            </button>
                                            <div className="absolute bottom-1 left-1 bg-black/60 px-1.5 rounded text-[10px] font-bold uppercase">
                                                {item.type === 'video' ? 'VID' : 'IMG'}
                                            </div>
                                        </div>
                                    );
                                })}

                                {/* Кнопка добавить ещё */}
                                {mediaItems.length < 4 && (
                                    <button
                                        onClick={function() { if (fileInputRef.current) fileInputRef.current.click(); }}
                                        className="min-w-[100px] h-[100px] rounded-xl border-2 border-dashed border-darkBorder flex items-center justify-center hover:border-primary transition"
                                    >
                                        <Icon name="plus" size={24} className="text-slate-500" />
                                    </button>
                                )}
                            </div>
                            <p className="text-xs text-slate-500 mt-1">
                                {mediaItems.length}/4 объектов • Видео макс. 60 сек
                            </p>
                        </div>
                    )}

                    {/* Большая кнопка выбора (когда ничего не выбрано) */}
                    {mediaItems.length === 0 && (
                        <button
                            onClick={function() { if (fileInputRef.current) fileInputRef.current.click(); }}
                            className="w-full aspect-video bg-darkCard border-2 border-dashed border-darkBorder rounded-2xl flex flex-col items-center justify-center gap-3 mb-5 hover:border-primary transition active:scale-95"
                        >
                            <Icon name="camera" size={40} className="text-slate-500" />
                            <p className="text-slate-400 font-semibold">Выбрать фото или видео</p>
                            <p className="text-xs text-slate-600">До 4 объектов • Видео до 60 сек</p>
                        </button>
                    )}

                    {/* Скрытый input */}
                    <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*,video/*"
                        multiple
                        className="hidden"
                        onChange={handleFilesSelected}
                    />

                    {/* Описание */}
                    <textarea
                        value={caption}
                        onChange={function(e) { setCaption(e.target.value); }}
                        placeholder="Описание..."
                        rows={3}
                        className="w-full bg-darkCard border border-darkBorder rounded-xl p-4 outline-none focus:border-primary resize-none mb-4 text-white placeholder-slate-500"
                    />

                    {/* Кнопка публикации */}
                    <button
                        onClick={handlePublish}
                        disabled={mediaItems.length === 0 || isUploading}
                        className={
                            'w-full py-4 rounded-xl font-bold active:scale-95 transition flex items-center justify-center gap-2 ' +
                            (mediaItems.length > 0 && !isUploading ? 'bg-primary text-white' : 'bg-darkCard text-slate-600')
                        }
                    >
                        {isUploading && (
                            <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full spinner" />
                        )}
                        {isUploading ? 'Загрузка...' : 'Опубликовать'}
                    </button>

                    {/* Модалка: лимит исчерпан */}
                    {status === 'limit' && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">
                            <div className="bg-darkCard border border-darkBorder rounded-2xl p-6 max-w-sm w-full text-center">
                                <div className="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
                                    <Icon name="lock" size={28} className="text-red-400" />
                                </div>
                                <h3 className="text-xl font-bold mb-2">Лимит исчерпан</h3>
                                <p className="text-slate-400 text-sm mb-4">
                                    Free: {limitInfo.limit}/нед • Premium: 6/нед
                                </p>
                                <p className="text-xs text-slate-500 mb-5">
                                    💡 Удали старый пост, чтобы освободить место
                                </p>
                                <button
                                    onClick={function() { setStatus(null); }}
                                    className="w-full bg-darkBorder py-3 rounded-xl font-semibold"
                                >
                                    Позже
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Тост: успех */}
                    {status === 'ok' && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-green-500 px-6 py-3 rounded-full font-semibold shadow-lg z-50 animate-fade-in">
                            ✅ Опубликовано!
                        </div>
                    )}

                    {/* Тост: ошибка */}
                    {status === 'err' && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-red-500 px-6 py-3 rounded-full font-semibold shadow-lg z-50 animate-fade-in">
                            ❌ Ошибка загрузки
                        </div>
                    )}
                </div>
            );
        }


        // ================================================================
        // 👤 СТРАНИЦА ПРОФИЛЯ
        // Информация, сетка постов, промокоды
        // ================================================================
        function ProfilePage() {
            var auth = useAuth();
            var user = auth.user;
            var profile = auth.profile;
            var refreshProfile = auth.refreshProfile;
            var logout = auth.logout;

            var tabState = useState('posts');
            var activeTab = tabState[0];
            var setActiveTab = tabState[1];

            var codeState = useState('');
            var promoCode = codeState[0];
            var setPromoCode = codeState[1];

            var resultState = useState(null);
            var promoResult = resultState[0];
            var setPromoResult = resultState[1];

            var myPostsState = useState([]);
            var myPosts = myPostsState[0];
            var setMyPosts = myPostsState[1];

            var applyingState = useState(false);
            var isApplying = applyingState[0];
            var setIsApplying = applyingState[1];

            // Загрузка своих постов
            useEffect(function() {
                if (!user || !supabase) return;

                supabase.from('posts')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false })
                    .then(function(result) {
                        setMyPosts(result.data || []);
                    });
            }, [user, activeTab]);

            // Если нет аккаунта
            if (!user) {
                return (
                    <div className="h-full flex items-center justify-center text-slate-500 animate-fade-in">
                        <div className="text-center">
                            <Icon name="user" size={48} className="mb-3 mx-auto" />
                            <p>Профиль доступен только с аккаунтом</p>
                        </div>
                    </div>
                );
            }

            /**
             * Активация промокода через серверную RPC функцию.
             * Безопасно проверяется и применяется на стороне БД.
             */
            async function handleApplyPromo() {
                if (!promoCode.trim()) return;
                setIsApplying(true);

                try {
                    var result = await supabase.rpc('activate_promo', {
                        p_code: promoCode.trim().toUpperCase()
                    });

                    var data = result.data || { success: false, error: result.error ? result.error.message : 'Ошибка' };
                    setPromoResult(data);

                    if (data.success) {
                        refreshProfile();
                        setPromoCode('');
                    }
                } catch (err) {
                    setPromoResult({ success: false, error: err.message || 'Ошибка' });
                }

                setIsApplying(false);
                setTimeout(function() { setPromoResult(null); }, 3000);
            }

            /**
             * Удаление своего поста с восстановлением лимита.
             */
            async function handleDeletePost(postId) {
                if (!confirm('Удалить пост?')) return;

                try {
