                    content += '<div style="font-size:12px;color:var(--text-sec);">@' + Utils.esc(u.username) + '</div></div></div>';
                    if (u.banned) {
                        content += '<button class="btn btn-secondary btn-small" onclick="Admin.unban(\'' + u.id + '\')">Разбанить</button>';
                    } else {
                        content += '<button class="btn btn-danger btn-small" onclick="Admin.banUser(\'' + u.id + '\')">🚫 Бан</button>';
                    }
                    content += '</div>';
                }
                self.showPanel(content);
            });
        } else if (this.currentTab === 'videos') {
            sb.from('videos').select('*').order('created_at', { ascending: false }).then(function(videosResult) {
                var videos = videosResult.data || [];
                for (var j = 0; j < videos.length; j++) {
                    var v = videos[j];
                    content += '<div class="admin-row"><div style="min-width:0;"><div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + Utils.esc(v.title) + '</div>';
                    content += '<div style="font-size:12px;color:var(--text-sec);">@' + Utils.esc(v.username) + '</div></div>';
                    content += '<button class="btn btn-danger btn-small" onclick="Admin.deleteVideo(\'' + v.id + '\')">🗑</button></div>';
                }
                self.showPanel(content);
            });
        } else if (this.currentTab === 'promos') {
            DB.getAllPromos().then(function(promos) {
                var active = promos.filter(function(p) { return !p.used; });
                var used = promos.filter(function(p) { return p.used; });
                content += '<button class="btn btn-premium" style="width:100%;margin-bottom:12px;" onclick="Admin.createPromo()">+ Создать</button>';
                content += '<div id="new-promo-slot"></div>';
                content += '<div class="admin-section-title">Активные (' + active.length + ')</div>';
                for (var k = 0; k < active.length; k++) {
                    content += '<div class="admin-row"><div style="font-family:monospace;font-weight:700;">' + active[k].code + '</div>';
                    content += '<button class="btn btn-secondary btn-small" onclick="Admin.copyPromo(\'' + active[k].code + '\')">📋</button></div>';
                }
                content += '<div class="admin-section-title">Использованные (' + used.length + ')</div>';
                for (var m = 0; m < used.length; m++) {
                    content += '<div class="admin-row" style="opacity:0.5;"><div style="font-family:monospace;text-decoration:line-through;">' + used[m].code + '</div></div>';
                }
                self.showPanel(content);
            });
        }
    },

    showPanel: function(content) {
        App.modal('<div class="modal-header"><div class="modal-title">⚙️ Админ</div><button class="modal-close" onclick="App.closeModal()">' + Icons.close() + '</button></div><div class="admin-tab-bar"><div class="admin-tab ' + (this.currentTab === 'users' ? 'active' : '') + '" onclick="Admin.switchTab(\'users\')">👥 Юзеры</div><div class="admin-tab ' + (this.currentTab === 'videos' ? 'active' : '') + '" onclick="Admin.switchTab(\'videos\')">🎬 Видео</div><div class="admin-tab ' + (this.currentTab === 'promos' ? 'active' : '') + '" onclick="Admin.switchTab(\'promos\')">🎁 Промо</div></div><div style="max-height:60vh;overflow-y:auto;">' + content + '</div>');
    },

    banUser: function(userId) {
        if (Auth.user && Auth.user.id === userId) { Utils.toast('Нельзя себя!', 'error'); return; }
        var reason = prompt('Причина:') || 'Нарушение';
        var self = this;
        DB.banUser(userId, reason).then(function() {
            Utils.toast('Забанен 🚫', 'error');
            self.renderPanel();
        });
    },

    unban: function(userId) {
        var self = this;
        DB.unbanUser(userId).then(function() {
            Utils.toast('Разбанен ✅', 'success');
            self.renderPanel();
        });
    },

    deleteVideo: function(videoId) {
        if (!confirm('Удалить?')) return;
        var self = this;
        DB.deleteVideo(videoId).then(function() {
            Utils.toast('Удалено 🗑', 'success');
            self.renderPanel();
        });
    },

    createPromo: function() {
        DB.createPromo().then(function(code) {
            document.getElementById('new-promo-slot').innerHTML = '<div class="promo-code-box">' + code + '</div><button class="btn btn-secondary btn-small" style="width:100%;" onclick="Admin.copyPromo(\'' + code + '\')">📋 Скопировать</button>';
            Utils.toast('Создан! 🎉', 'premium');
        });
    },

    copyPromo: function(code) {
        navigator.clipboard.writeText(code).then(function() {
            Utils.toast('Скопирован 📋', 'success');
        });
    }
};

/* =============================================
   ГЛАВНОЕ ПРИЛОЖЕНИЕ
   ============================================= */
var App = {
    current: 'welcome',
    profileBack: 'home',

    go: function(name) {
        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
        var screen = document.getElementById('screen-' + name);
        if (screen) screen.classList.add('active');
        this.current = name;
        if (name === 'register') setTimeout(function() { Reg.buildPicker(); }, 50);
    },

    nav: function(name) {
        if (name === 'home') {
            this.go('home');
            Posts.render();
            Stories.loadBar();
        } else if (name === 'feed') {
            this.go('feed');
            Feed.renderInto('feed-container');
        } else if (name === 'inbox') {
            this.go('inbox');
        } else if (name === 'profile') {
            if (!Auth.user) {
                Utils.toast('Войди', 'error');
                var self = this;
                setTimeout(function() { self.go('welcome'); }, 500);
                return;
            }
            this.profileBack = 'home';
            this.go('profile');
            Profile.currentTab = 'videos';
            Profile.render();
        }
    },

    viewProfile: function(userId) {
        this.profileBack = this.current;
        this.go('profile');
        Profile.render(userId);
    },

    enterGuest: function() {
        Auth.user = null;
        Auth.isGuest = true;
        Utils.toast('Гостевой режим 👀', 'success');
        this.startApp();
    },

    modal: function(html) {
        document.getElementById('modals').innerHTML = '<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)App.closeModal()"><div class="modal">' + html + '</div></div>';
    },

    closeModal: function() {
        document.getElementById('modals').innerHTML = '';
    },

    showBanScreen: function(user) {
        this.go('banned');
        var reasonBox = document.getElementById('ban-reason');
        if (user.ban_reason) {
            reasonBox.style.display = 'block';
            reasonBox.innerHTML = '<b>Причина:</b> ' + Utils.esc(user.ban_reason);
        } else {
            reasonBox.style.display = 'none';
        }
    },

    startApp: function() {
        this.go('home');
        Posts.render();
        Stories.loadBar();
    },

    init: function() {
        document.getElementById('welcome-logo').addEventListener('click', function() { Admin.logoTap(); });
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                var tag = document.activeElement.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                e.preventDefault();
                Feed.toggleCurrent();
            }
        });
    }
};

/* =============================================
   ЗАПУСК
   ============================================= */
(function() {
    if (!sb) {
        Utils.toast('Ошибка Supabase. Проверь интернет.', 'error');
        return;
    }
    App.init();
    Auth.restoreSession().then(function(restored) {
        if (restored && Auth.user && !Auth.user.banned) {
            App.startApp();
        } else {
            App.go('welcome');
        }
    });
})();
</script>
</body>
</html>
