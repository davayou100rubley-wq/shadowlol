<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Пульс</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel для JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        primaryDark: '#4f46e5',
                        dark: '#0f172a',
                        darkCard: '#1e293b',
                        darkBorder: '#334155'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: #0f172a;
            color: #fff;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* Скролл без скроллбара */
        .stories-scroll {
            scrollbar-width: none;
        }
        .stories-scroll::-webkit-scrollbar {
            display: none;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Пульсация логотипа */
        @keyframes pulseLogo {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        .pulse-logo {
            animation: pulseLogo 2s infinite;
        }

        /* Premium галочка — неоновый градиент */
        .premium-check {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 0 8px rgba(220, 39, 67, 0.6);
        }

        /* Premium обводка аватара — градиентная */
        .premium-ring {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 2.5px;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(220, 39, 67, 0.4);
        }

        /* Обычная обводка аватара — синяя */
        .free-ring {
            background: #3b82f6;
            padding: 2px;
            border-radius: 50%;
        }

        /* TikTok вертикальный snap scroll */
        .video-feed {
            scroll-snap-type: y mandatory;
            overflow-y: auto;
        }
        .video-feed::-webkit-scrollbar {
            display: none;
        }
        .video-snap {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        /* Карусель горизонтальная */
        .carousel-scroll {
            scroll-snap-type: x mandatory;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .carousel-scroll::-webkit-scrollbar {
            display: none;
        }
        .carousel-item {
            scroll-snap-align: center;
            min-width: 100%;
        }

        /* Safe area для iPhone */
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Спиннер загрузки */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, createContext, useContext, useCallback } = React;

        // ==========================================
        // 🔌 SUPABASE CONFIG
        // ⚠️ ЗАМЕНИ ЭТИ ДВЕ СТРОКИ НА СВОИ КЛЮЧИ!
        // Supabase Dashboard → Settings → API
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        // ==========================================

        // Безопасная инициализация Supabase клиента
        let supabase = null;
        let isSupabaseReady = false;

        try {
            if (typeof window !== 'undefined' && window.supabase && !SUPABASE_URL.includes('YOUR_')) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                isSupabaseReady = true;
                console.log('✅ Supabase подключён успешно');
            } else {
                console.warn('⚠️ Supabase не настроен. Замени ключи в коде.');
            }
        } catch (e) {
            console.error('❌ Ошибка подключения Supabase:', e);
        }


        // ==========================================
        // 🎨 ИКОНКИ (SVG компоненты)
        // ==========================================
        const Icon = ({ name, size = 24, filled = false, className = "" }) => {
            const paths = {
                home: <>
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    {!filled && <polyline points="9 22 9 12 15 12 15 22"/>}
                </>,
                play: <polygon points="5 3 19 12 5 21 5 3"/>,
                plus: <>
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </>,
                heart: <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>,
                user: <>
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </>,
                search: <>
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </>,
                comment: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>,
                share: <>
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </>,
                bookmark: <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>,
                more: <>
                    <circle cx="12" cy="12" r="1"/>
                    <circle cx="19" cy="12" r="1"/>
                    <circle cx="5" cy="12" r="1"/>
                </>,
                x: <>
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </>,
                crown: <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>,
                gift: <>
                    <polyline points="20 12 20 22 4 22 4 12"/>
                    <rect x="2" y="7" width="20" height="5"/>
                    <line x1="12" y1="22" x2="12" y2="7"/>
                    <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                    <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                </>,
                lock: <>
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </>,
                settings: <>
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </>,
                pulse: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
                edit: <>
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </>,
                grid: <>
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </>,
                camera: <>
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </>,
                trash: <>
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </>,
                check: <polyline points="20 6 9 17 4 12"/>,
            };

            return (
                <svg
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill={filled ? "currentColor" : "none"}
                    stroke="currentColor"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {paths[name]}
                </svg>
            );
        };


        // ==========================================
        // 🔧 УТИЛИТЫ
        // ==========================================

        // Сжатие изображения перед загрузкой в Storage
        const compressImage = (file, maxWidth = 1080, quality = 0.7) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                    };
                };
            });
        };

        // Получение длительности видео
        const getVideoDuration = (file) => {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => resolve(video.duration);
                video.onerror = () => resolve(0);
                video.src = URL.createObjectURL(file);
            });
        };

        // Форматирование времени
        const formatTime = (dateStr) => {
            const diff = Date.now() - new Date(dateStr).getTime();
            const minutes = Math.floor(diff / 60000);
            if (minutes < 1) return 'только что';
            if (minutes < 60) return `${minutes} мин`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ч`;
            const days = Math.floor(hours / 24);
            return `${days} д`;
        };


        // ==========================================
        // 🔐 AUTH CONTEXT (Supabase Auth)
        // ==========================================
        const AuthContext = createContext(null);

        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [isGuest, setIsGuest] = useState(false);
            const [loading, setLoading] = useState(true);

            // Загрузка профиля из БД
            const loadProfile = useCallback(async (userId) => {
                if (!supabase) return;
                const { data, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .single();
                if (data && !error) {
                    setProfile(data);
                }
            }, []);

            useEffect(() => {
                if (!supabase) {
                    setLoading(false);
                    return;
                }

                // Проверка существующей сессии (авто-вход)
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session?.user) {
                        setUser(session.user);
                        loadProfile(session.user.id);
                    }
                    setLoading(false);
                });

                // Слушатель изменений auth состояния
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session?.user) {
                        setUser(session.user);
                        loadProfile(session.user.id);
                    } else {
                        setUser(null);
                        setProfile(null);
                    }
                });

                return () => subscription.unsubscribe();
            }, [loadProfile]);

            // Регистрация нового пользователя
            const register = async (email, password, username, avatarFile) => {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { username } }
                });
                if (error) throw error;

                // Загрузка аватарки если есть
                if (avatarFile && data.user) {
                    const ext = avatarFile.name.split('.').pop();
                    const path = `${data.user.id}/avatar.${ext}`;
                    const compressed = await compressImage(avatarFile, 400, 0.8);
                    await supabase.storage.from('avatars').upload(path, compressed, {
                        upsert: true,
                        contentType: 'image/jpeg'
                    });
                    const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(path);
                    await supabase.from('profiles').update({ avatar_url: publicUrl }).eq('id', data.user.id);
                }

                await loadProfile(data.user.id);
                return data;
            };

            // Вход
            const login = async (email, password) => {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                return data;
            };

            // Выход
            const logout = async () => {
                await supabase.auth.signOut();
                setUser(null);
                setProfile(null);
                setIsGuest(false);
            };

            // Гостевой режим
            const guest = () => {
                setIsGuest(true);
                setUser(null);
                setProfile(null);
            };

            // Обновление профиля
            const refreshProfile = useCallback(async () => {
                if (user) await loadProfile(user.id);
            }, [user, loadProfile]);

            return (
                <AuthContext.Provider value={{
                    user, profile, isGuest, loading,
                    register, login, logout, guest, refreshProfile
                }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const useAuth = () => useContext(AuthContext);


        // ==========================================
        // 🎨 PREMIUM AVATAR COMPONENT
        // ==========================================
        const Avatar = ({ src, size = 40, isPremium, showCheck = true, className = "" }) => {
            const ringClass = isPremium ? 'premium-ring' : (src ? 'free-ring' : '');

            return (
                <div className={`relative inline-block ${className}`}>
                    <div className={ringClass}>
                        <div className="bg-dark rounded-full overflow-hidden" style={{ width: size, height: size }}>
                            {src
                                ? <img src={src} className="w-full h-full object-cover" alt="" />
                                : <div className="w-full h-full flex items-center justify-center bg-darkCard">
                                    <Icon name="user" size={size * 0.5} />
                                  </div>
                            }
                        </div>
                    </div>
                    {showCheck && isPremium && (
                        <div className="absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full premium-check flex items-center justify-center border-2 border-dark">
                            <Icon name="check" size={12} className="text-white" />
                        </div>
                    )}
                </div>
            );
        };


        // ==========================================
        // ⚙️ SETUP SCREEN (если Supabase не настроен)
        // ==========================================
        const SetupScreen = () => (
            <div className="min-h-screen bg-dark flex flex-col items-center justify-center p-6 text-center fade-in">
                <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center mb-6 pulse-logo">
                    <Icon name="pulse" size={36} className="text-white" />
                </div>
                <h1 className="text-3xl font-bold mb-2">Пульс</h1>
                <p className="text-slate-400 mb-8 max-w-sm">
                    Supabase не настроен. Открой этот HTML-файл в любом текстовом редакторе
                    и замени две строки в начале скрипта:
                </p>
                <div className="bg-darkCard border border-darkBorder rounded-xl p-4 text-left text-xs font-mono max-w-md w-full mb-6 overflow-x-auto">
                    <p className="text-red-400 mb-1">{'// Найди эти строки и замени:'}</p>
                    <p className="text-slate-400">const SUPABASE_URL = <span className="text-yellow-400">'YOUR_SUPABASE_URL'</span>;</p>
                    <p className="text-slate-400">const SUPABASE_KEY = <span className="text-yellow-400">'YOUR_SUPABASE_ANON_KEY'</span>;</p>
                    <p className="text-green-400 mt-3 mb-1">{'// Замени на свои ключи из Supabase:'}</p>
                    <p className="text-slate-300">const SUPABASE_URL = <span className="text-green-300">'https://xxx.supabase.co'</span>;</p>
                    <p className="text-slate-300">const SUPABASE_KEY = <span className="text-green-300">'eyJhbG...'</span>;</p>
                </div>
                <p className="text-slate-500 text-xs max-w-sm">
                    Ключи находятся в Supabase Dashboard → Settings → API.<br/>
                    Также убедись что SQL-скрипт выполнен и бакеты avatars/posts созданы в Storage.
                </p>
            </div>
        );


        // ==========================================
        // 🚪 AUTH SCREEN (Регистрация / Вход / Гость)
        // ==========================================
        const AuthScreen = () => {
            const { register, login, guest } = useAuth();
            const [mode, setMode] = useState('welcome');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [avatarFile, setAvatarFile] = useState(null);
            const [avatarPreview, setAvatarPreview] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const fileRef = useRef(null);

            const handleAvatarSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setAvatarFile(file);
                setAvatarPreview(URL.createObjectURL(file));
            };

            const doRegister = async () => {
                setError('');
                setIsLoading(true);
                try {
                    await register(email, password, username, avatarFile);
                } catch (e) {
                    setError(e.message || 'Ошибка регистрации');
                }
                setIsLoading(false);
            };

            const doLogin = async () => {
                setError('');
                setIsLoading(true);
                try {
                    await login(email, password);
                } catch (e) {
                    setError(e.message || 'Неверный email или пароль');
                }
                setIsLoading(false);
            };

            // Экран приветствия
            if (mode === 'welcome') {
                return (
                    <div className="fixed inset-0 z-50 bg-dark flex flex-col items-center justify-center p-6 fade-in">
                        <div className="w-24 h-24 rounded-3xl bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center mb-6 pulse-logo">
                            <Icon name="pulse" size={44} className="text-white" />
                        </div>
                        <h1 className="text-4xl font-bold mb-1 bg-gradient-to-r from-primary to-purple-400 bg-clip-text text-transparent">
                            Пульс
                        </h1>
                        <p className="text-slate-400 mb-12 text-sm">Твой ритм. Твои правила.</p>
                        <button onClick={() => setMode('register')}
                            className="w-full max-w-xs bg-primary py-3.5 rounded-xl font-bold mb-3 active:scale-95 transition shadow-lg shadow-primary/30">
                            Зарегистрироваться
                        </button>
                        <button onClick={() => setMode('login')}
                            className="w-full max-w-xs bg-darkCard border border-darkBorder py-3.5 rounded-xl font-semibold mb-3 active:scale-95 transition">
                            Войти
                        </button>
                        <button onClick={guest}
                            className="w-full max-w-xs text-slate-500 py-3 text-sm active:scale-95 transition">
                            Продолжить как гость
                        </button>
                    </div>
                );
            }

            // Экран регистрации / входа
            return (
                <div className="fixed inset-0 z-50 bg-dark p-6 fade-in overflow-y-auto">
                    <button onClick={() => { setMode('welcome'); setError(''); }}
                        className="p-2 text-slate-400 mb-4">
                        <Icon name="x" />
                    </button>
                    <h2 className="text-2xl font-bold mb-6">
                        {mode === 'register' ? 'Создай профиль' : 'Вход'}
                    </h2>

                    {/* Выбор аватарки (только при регистрации) */}
                    {mode === 'register' && (
                        <div className="flex flex-col items-center mb-6">
                            <div className="relative cursor-pointer" onClick={() => fileRef.current?.click()}>
                                {avatarPreview
                                    ? <img src={avatarPreview} className="w-24 h-24 rounded-full object-cover border-4 border-primary" />
                                    : <div className="w-24 h-24 rounded-full bg-darkCard border-4 border-dashed border-darkBorder flex items-center justify-center">
                                        <Icon name="camera" size={32} className="text-slate-500" />
                                      </div>
                                }
                                <div className="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full border-2 border-dark">
                                    <Icon name="edit" size={12} />
                                </div>
                            </div>
                            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleAvatarSelect} />
                            <p className="text-xs text-slate-500 mt-2">Нажми, чтобы выбрать фото с устройства</p>
                        </div>
                    )}

                    {/* Поля ввода */}
                    {mode === 'register' && (
                        <input type="text" placeholder="Имя пользователя" value={username}
                            onChange={e => setUsername(e.target.value)}
                            className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-3 outline-none focus:border-primary transition" />
                    )}
                    <input type="email" placeholder="Email" value={email}
                        onChange={e => setEmail(e.target.value)}
                        className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-3 outline-none focus:border-primary transition" />
                    <input type="password" placeholder="Пароль" value={password}
                        onChange={e => setPassword(e.target.value)}
                        className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-4 outline-none focus:border-primary transition" />

                    {/* Ошибка */}
                    {error && <p className="text-red-400 text-sm mb-3 text-center">{error}</p>}

                    {/* Кнопка действия */}
                    <button
                        disabled={isLoading || !email || !password || (mode === 'register' && !username)}
                        onClick={mode === 'register' ? doRegister : doLogin}
                        className={`w-full py-4 rounded-xl font-bold transition active:scale-95 flex items-center justify-center gap-2 ${
                            email && password && (mode === 'login' || username) ? 'bg-primary' : 'bg-darkCard text-slate-600'
                        }`}>
                        {isLoading && <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full spinner" />}
                        {mode === 'register' ? 'Создать аккаунт' : 'Войти'}
                    </button>

                    {/* Переключение режима */}
                    <p className="text-center text-sm text-slate-500 mt-4">
                        {mode === 'register' ? 'Уже есть аккаунт? ' : 'Нет аккаунта? '}
                        <button onClick={() => { setMode(mode === 'register' ? 'login' : 'register'); setError(''); }}
                            className="text-primary font-semibold">
                            {mode === 'register' ? 'Войти' : 'Зарегистрироваться'}
                        </button>
                    </p>
                </div>
            );
        };


        // ==========================================
        // 🏠 HEADER
        // ==========================================
        const Header = () => (
            <header className="sticky top-0 z-40 bg-dark/90 backdrop-blur-xl border-b border-darkBorder">
                <div className="flex items-center justify-between px-4 h-14">
                    <div className="flex items-center gap-2">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center">
                            <Icon name="pulse" size={18} className="text-white" />
                        </div>
                        <h1 className="text-xl font-bold bg-gradient-to-r from-primary to-purple-400 bg-clip-text text-transparent">
                            Пульс
                        </h1>
                    </div>
                    <div className="flex gap-1">
                        <button className="p-2 rounded-full hover:bg-darkCard relative">
                            <Icon name="heart" size={22} />
                            <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        <button className="p-2 rounded-full hover:bg-darkCard">
                            <Icon name="comment" size={22} />
                        </button>
                    </div>
                </div>
            </header>
        );


        // ==========================================
        // 🏠 HOME PAGE (Поиск + Сторис друзей + Фото-лента)
        // ==========================================
        const HomePage = () => {
            const { user, profile, refreshProfile } = useAuth();
            const [query, setQuery] = useState('');
            const [posts, setPosts] = useState([]);
            const [stories, setStories] = useState([]);
            const [activeStory, setActiveStory] = useState(null);
            const [loadingPosts, setLoadingPosts] = useState(true);
            const storyInputRef = useRef(null);

            // Загрузка постов из Supabase
            const fetchPosts = useCallback(async () => {
                setLoadingPosts(true);
                let queryBuilder = supabase
                    .from('posts')
                    .select('*, profiles(username, avatar_url, is_premium)')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (query) {
                    queryBuilder = supabase
                        .from('posts')
                        .select('*, profiles(username, avatar_url, is_premium)')
                        .or(`caption.ilike.%${query}%`)
                        .order('created_at', { ascending: false })
                        .limit(50);
                }

                const { data } = await queryBuilder;
                setPosts(data || []);
                setLoadingPosts(false);
            }, [query]);

            // Загрузка сторис из Supabase
            const fetchStories = useCallback(async () => {
                const cutoff = new Date(Date.now() - 86400000).toISOString();
                const { data } = await supabase
                    .from('stories')
                    .select('*, profiles(username, avatar_url, is_premium)')
                    .gte('created_at', cutoff)
                    .order('created_at', { ascending: false });
                setStories(data || []);
            }, []);

            useEffect(() => {
                fetchPosts();
                fetchStories();
            }, [fetchPosts, fetchStories]);

            // Загрузка своей сторис
            const handleStoryUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !user) return;

                const blob = await compressImage(file, 1080, 0.8);
                const path = `${user.id}/story_${Date.now()}.jpg`;

                const { error } = await supabase.storage.from('posts').upload(path, blob, {
                    contentType: 'image/jpeg'
                });
                if (error) { alert('Ошибка загрузки сторис'); return; }

                const { data: { publicUrl } } = supabase.storage.from('posts').getPublicUrl(path);
                await supabase.from('stories').insert({ user_id: user.id, media_url: publicUrl });
                fetchStories();
            };

            // Удаление поста
            const deletePost = async (postId) => {
                if (!confirm('Удалить пост? Лимит восстановится.')) return;
                await supabase.rpc('delete_post_and_restore', { p_post_id: postId });
                refreshProfile();
                fetchPosts();
            };

            // Фильтрация сторис
            const otherStories = stories.filter(s => !user || s.user_id !== user.id);

            return (
                <div className="fade-in pb-20">
                    {/* Строка поиска */}
                    <div className="px-4 py-3 sticky top-14 z-30 bg-dark/95 backdrop-blur-md">
                        <div className="relative">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
                                <Icon name="search" size={18} />
                            </div>
                            <input type="text" placeholder="Поиск по имени или описанию..."
                                value={query} onChange={e => setQuery(e.target.value)}
                                className="w-full bg-darkCard border border-darkBorder rounded-xl py-3 pl-10 pr-10 text-sm outline-none focus:border-primary transition placeholder-slate-500" />
                            {query && (
                                <button onClick={() => setQuery('')}
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">
                                    <Icon name="x" size={16} />
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Сторис (только друзья + своя) */}
                    <div className="px-4 py-3 border-b border-darkBorder">
                        <div className="flex gap-4 overflow-x-auto stories-scroll pb-1">
                            {/* Своя история */}
                            <div className="flex flex-col items-center gap-1 min-w-[68px]"
                                onClick={() => storyInputRef.current?.click()}>
                                <div className="relative w-16 h-16 rounded-full bg-darkCard border-2 border-dashed border-darkBorder overflow-hidden cursor-pointer">
                                    {profile?.avatar_url
                                        ? <img src={profile.avatar_url} className="w-full h-full object-cover opacity-60" />
                                        : <div className="w-full h-full flex items-center justify-center">
                                            <Icon name="user" size={24} className="text-slate-600" />
                                          </div>
                                    }
                                    <div className="absolute -bottom-0.5 -right-0.5 w-6 h-6 bg-primary rounded-full flex items-center justify-center border-2 border-dark">
                                        <span className="text-white text-sm font-bold leading-none">+</span>
                                    </div>
                                </div>
                                <input ref={storyInputRef} type="file" accept="image/*" className="hidden" onChange={handleStoryUpload} />
                                <span className="text-[11px] text-slate-400 w-16 text-center truncate">Ваша</span>
                            </div>

                            {/* Чужие истории */}
                            {otherStories.map(story => (
                                <button key={story.id} onClick={() => setActiveStory(story)}
                                    className="flex flex-col items-center gap-1 min-w-[68px]">
                                    <Avatar src={story.profiles?.avatar_url} size={60} isPremium={story.profiles?.is_premium} />
                                    <span className="text-[11px] text-slate-300 w-16 text-center truncate">
                                        {(story.profiles?.username || '').split('_')[0]}
                                    </span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Лента постов */}
                    {loadingPosts ? (
                        <div className="flex justify-center py-20">
                            <div className="w-8 h-8 border-2 border-primary border-t-transparent rounded-full spinner" />
                        </div>
                    ) : posts.length > 0 ? (
                        posts.map(post => (
                            <article key={post.id} className="border-b border-darkBorder">
                                {/* Шапка поста */}
                                <div className="flex items-center justify-between px-4 py-3">
                                    <div className="flex items-center gap-3">
                                        <Avatar src={post.profiles?.avatar_url} size={36} isPremium={post.profiles?.is_premium} />
                                        <div>
                                            <div className="flex items-center gap-1">
                                                <p className="text-sm font-semibold">{post.profiles?.username}</p>
                                                {post.profiles?.is_premium && (
                                                    <span className="text-[10px] bg-gradient-to-r from-orange-500 to-pink-500 text-white px-1.5 rounded font-bold">PRO</span>
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-500">
                                                {formatTime(post.created_at)} • {post.quality} • {post.fps} FPS
                                            </p>
                                        </div>
                                    </div>
                                    {user && user.id === post.user_id && (
                                        <button onClick={() => deletePost(post.id)}
                                            className="text-red-400 p-2 hover:bg-red-500/10 rounded-lg transition">
                                            <Icon name="trash" size={18} />
                                        </button>
                                    )}
                                </div>

                                {/* Медиа карусель */}
                                <div className="relative bg-black">
                                    {post.media_items?.length === 1 ? (
                                        post.media_items[0].type === 'video'
                                            ? <video src={post.media_items[0].url} controls playsInline className="w-full max-h-[500px] object-cover" />
                                            : <img src={post.media_items[0].url} className="w-full object-cover max-h-[550px]" loading="lazy" />
                                    ) : (
                                        <div className="relative">
                                            <div className="carousel-scroll flex">
                                                {(post.media_items || []).map((item, idx) => (
                                                    <div key={idx} className="carousel-item">
                                                        {item.type === 'video'
                                                            ? <video src={item.url} controls playsInline className="w-full max-h-[500px] object-cover" />
                                                            : <img src={item.url} className="w-full object-cover max-h-[550px]" loading="lazy" />
                                                        }
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="absolute bottom-3 right-3 bg-black/60 px-2 py-1 rounded-full text-xs font-bold backdrop-blur-sm">
                                                {post.media_items.length} медиа
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Действия */}
                                <div className="flex items-center gap-4 px-4 py-3">
                                    <button className="active:scale-125 transition"><Icon name="heart" /></button>
                                    <button><Icon name="comment" /></button>
                                    <button><Icon name="share" /></button>
                                    <div className="flex-1" />
                                    <button><Icon name="bookmark" /></button>
                                </div>

                                {/* Подпись */}
                                <div className="px-4 pb-4">
                                    <p className="text-sm">
                                        <span className="font-semibold mr-2">{post.profiles?.username}</span>
                                        <span className="text-slate-300">{post.caption}</span>
                                    </p>
                                </div>
                            </article>
                        ))
                    ) : (
                        <div className="flex flex-col items-center justify-center py-20 px-6 text-center">
                            <Icon name="pulse" size={48} className="text-slate-700 mb-4" />
                            <p className="text-slate-500 text-lg font-semibold mb-2">Лента пуста</p>
                            <p className="text-slate-600 text-sm">Нажми «+» и выложи первый пост!</p>
                        </div>
                    )}

                    {/* Просмотр сторис (оверлей) */}
                    {activeStory && (
                        <div className="fixed inset-0 z-[100] bg-black flex items-center justify-center"
                            onClick={() => setActiveStory(null)}>
                            <div className="relative w-full max-w-md h-full" onClick={e => e.stopPropagation()}>
                                <div className="absolute top-6 left-3 right-3 z-10 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <Avatar src={activeStory.profiles?.avatar_url} size={32} isPremium={activeStory.profiles?.is_premium} />
                                        <span className="text-sm font-semibold">{activeStory.profiles?.username}</span>
                                    </div>
                                    <button onClick={() => setActiveStory(null)}><Icon name="x" /></button>
                                </div>
                                <img src={activeStory.media_url} className="w-full h-full object-contain" />
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        // ==========================================
        // 🎬 FEED PAGE (Вертикальная лента видео — TikTok стиль)
        // ==========================================
        const FeedPage = () => {
            const [videos, setVideos] = useState([]);
            const [activeIdx, setActiveIdx] = useState(0);
            const [loading, setLoading] = useState(true);
            const containerRef = useRef(null);

            // Загрузка видео-постов
            useEffect(() => {
                (async () => {
                    const { data } = await supabase
                        .from('posts')
                        .select('*, profiles(username, avatar_url, is_premium)')
                        .order('created_at', { ascending: false })
                        .limit(30);

                    const videoPosts = (data || []).filter(p =>
                        p.media_items?.some(m => m.type === 'video')
                    );
                    setVideos(videoPosts);
                    setLoading(false);
                })();
            }, []);

            // IntersectionObserver для автоплея
            useEffect(() => {
                if (!videos.length) return;
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveIdx(Number(entry.target.dataset.idx));
                        }
                    });
                }, { threshold: 0.6, root: containerRef.current });

                document.querySelectorAll('.video-snap').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [videos]);

            if (loading) {
                return (
                    <div className="h-full flex justify-center items-center">
                        <div className="w-8 h-8 border-2 border-primary border-t-transparent rounded-full spinner" />
                    </div>
                );
            }

            if (!videos.length) {
                return (
                    <div className="h-full flex flex-col items-center justify-center p-6 text-center fade-in">
                        <Icon name="play" size={48} className="text-slate-700 mb-4" />
                        <p className="text-slate-500 text-lg font-semibold">Видео пока нет</p>
                        <p className="text-slate-600 text-sm mt-2">Выложи первое видео через кнопку «+»!</p>
                    </div>
                );
            }

            return (
                <div ref={containerRef} className="video-feed h-full">
                    {videos.map((video, index) => {
                        const firstVideo = video.media_items?.find(m => m.type === 'video');
                        return (
                            <div key={video.id} data-idx={index} className="video-snap relative bg-black"
                                style={{ height: 'calc(100dvh - 64px)' }}>
                                <video
                                    src={firstVideo?.url}
                                    loop playsInline muted
                                    ref={el => {
                                        if (el && index === activeIdx) el.play().catch(() => {});
                                        if (el && index !== activeIdx) el.pause();
                                    }}
                                    className="w-full h-full object-cover"
                                />

                                {/* Метка качества */}
                                <div className="absolute top-4 right-4 bg-black/50 px-2 py-1 rounded text-xs font-bold backdrop-blur-sm">
                                    {video.fps} FPS • {video.quality}
                                </div>

                                {/* Информация внизу */}
                                <div className="absolute bottom-6 left-4 right-16 z-10">
                                    <div className="flex items-center gap-2 mb-2">
                                        <Avatar src={video.profiles?.avatar_url} size={32} isPremium={video.profiles?.is_premium} />
                                        <span className="font-bold text-sm">@{video.profiles?.username}</span>
                                    </div>
                                    <p className="text-sm text-white/90 leading-snug">{video.caption}</p>
                                </div>

                                {/* Правая панель действий */}
                                <div className="absolute right-3 bottom-8 flex flex-col items-center gap-5 z-10">
                                    <button className="flex flex-col items-center">
                                        <div className="p-3 rounded-full bg-black/30 backdrop-blur-sm"><Icon name="heart" /></div>
                                        <span className="text-xs mt-1">{video.likes_count}</span>
                                    </button>
                                    <button className="flex flex-col items-center">
                                        <div className="p-3 rounded-full bg-black/30 backdrop-blur-sm"><Icon name="comment" /></div>
                                        <span className="text-xs mt-1">{video.comments_count}</span>
                                    </button>
                                    <button>
                                        <div className="p-3 rounded-full bg-black/30 backdrop-blur-sm"><Icon name="share" /></div>
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };


        // ==========================================
        // ➕ CREATE PAGE (Создание поста: фото/видео, до 4 объектов)
        // ==========================================
        const CreatePage = () => {
            const { user, profile, refreshProfile } = useAuth();
            const [mediaItems, setMediaItems] = useState([]);
            const [caption, setCaption] = useState('');
            const [status, setStatus] = useState(null);
            const [limitInfo, setLimitInfo] = useState(null);
            const [uploading, setUploading] = useState(false);
            const fileRef = useRef(null);

            // Если нет аккаунта
            if (!user) {
                return (
                    <div className="h-full flex flex-col items-center justify-center p-6 text-center fade-in">
                        <Icon name="lock" size={40} className="text-slate-600 mb-4" />
                        <h2 className="text-xl font-bold mb-2">Нужен аккаунт</h2>
                        <p className="text-slate-400 text-sm">Зарегистрируйся, чтобы постить</p>
                    </div>
                );
            }

            // Обработка выбора файлов
            const handleFilesSelected = async (e) => {
                const files = Array.from(e.target.files);
                if (mediaItems.length + files.length > 4) {
                    alert('Максимум 4 объекта в одном посте!');
                    return;
                }

                const newItems = [];
                for (const file of files) {
                    if (file.type.startsWith('video/')) {
                        const duration = await getVideoDuration(file);
                        if (duration > 60) {
                            alert(`Видео "${file.name}" длиннее 60 секунд!`);
                            continue;
                        }
                        newItems.push({ type: 'video', file, preview: URL.createObjectURL(file) });
                    } else {
                        const blob = await compressImage(file, 1080, 0.7);
                        newItems.push({ type: 'photo', file: blob, preview: URL.createObjectURL(blob) });
                    }
                }
                setMediaItems(prev => [...prev, ...newItems]);
            };

            // Удаление элемента из превью
            const removeItem = (idx) => setMediaItems(prev => prev.filter((_, i) => i !== idx));

            // Публикация поста
            const publish = async () => {
                if (!mediaItems.length) return;

                // Проверка лимита
                await refreshProfile();
                const { data: freshProfile } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                const now = Date.now();
                let postsThisWeek = freshProfile.posts_this_week;
                if (now > new Date(freshProfile.week_reset).getTime()) {
                    postsThisWeek = 0;
                }
                const limit = freshProfile.is_premium ? 6 : 2;

                if (postsThisWeek >= limit) {
                    setLimitInfo({ limit, used: postsThisWeek, isPremium: freshProfile.is_premium });
                    setStatus('limit');
                    return;
                }

                setUploading(true);
                try {
                    const uploadedItems = [];
                    for (const item of mediaItems) {
                        const ext = item.type === 'video' ? 'mp4' : 'jpg';
                        const path = `${user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
                        const { error } = await supabase.storage.from('posts').upload(path, item.file, {
                            contentType: item.type === 'video' ? 'video/mp4' : 'image/jpeg'
                        });
                        if (error) throw error;
                        const { data: { publicUrl } } = supabase.storage.from('posts').getPublicUrl(path);
                        uploadedItems.push({ type: item.type, url: publicUrl });
                    }

                    await supabase.from('posts').insert({
                        user_id: user.id,
                        media_items: uploadedItems,
                        caption,
                        fps: freshProfile.is_premium ? 60 : 30,
                        quality: freshProfile.is_premium ? 'HD' : 'SD'
                    });

                    refreshProfile();
                    setCaption('');
                    setMediaItems([]);
                    setStatus('success');
                    setTimeout(() => setStatus(null), 2000);
                } catch (e) {
                    console.error(e);
                    setStatus('error');
                    setTimeout(() => setStatus(null), 3000);
                }
                setUploading(false);
            };

            const limit = profile?.is_premium ? 6 : 2;
            const used = profile?.posts_this_week || 0;

            return (
                <div className="p-5 fade-in pb-24">
                    <h2 className="text-2xl font-bold mb-5">Новый пост</h2>

                    {/* Индикатор лимита */}
                    <div className="bg-darkCard rounded-xl p-4 border border-darkBorder mb-5">
                        <div className="flex justify-between mb-2">
                            <span className="text-sm text-slate-400">Лимит недели</span>
                            <span className={`text-sm font-bold ${profile?.is_premium ? 'text-yellow-400' : ''}`}>
                                {used} / {limit}
                            </span>
                        </div>
                        <div className="w-full h-2 bg-darkBorder rounded-full overflow-hidden">
                            <div className={`h-full ${profile?.is_premium ? 'bg-yellow-400' : 'bg-primary'} transition-all`}
                                style={{ width: `${Math.min((used / limit) * 100, 100)}%` }} />
                        </div>
                        <p className="text-xs text-slate-500 mt-2">
                            {profile?.is_premium
                                ? '👑 Premium: до 6 постов, 60 FPS, HD'
                                : 'Free: 2 поста, 30 FPS, SD (480p)'}
                        </p>
                    </div>

                    {/* Превью выбранных медиа */}
                    {mediaItems.length > 0 && (
                        <div className="mb-5">
                            <div className="flex gap-2 overflow-x-auto stories-scroll pb-2">
                                {mediaItems.map((item, idx) => (
                                    <div key={idx} className="relative min-w-[100px] h-[100px] rounded-xl overflow-hidden border border-darkBorder">
                                        {item.type === 'video'
                                            ? <video src={item.preview} className="w-full h-full object-cover" />
                                            : <img src={item.preview} className="w-full h-full object-cover" />
                                        }
                                        <button onClick={() => removeItem(idx)}
                                            className="absolute top-1 right-1 bg-black/70 rounded-full p-1">
                                            <Icon name="x" size={12} />
                                        </button>
                                        <div className="absolute bottom-1 left-1 bg-black/60 px-1.5 rounded text-[10px] font-bold uppercase">
                                            {item.type === 'video' ? 'VID' : 'IMG'}
                                        </div>
                                    </div>
                                ))}
                                {mediaItems.length < 4 && (
                                    <button onClick={() => fileRef.current?.click()}
                                        className="min-w-[100px] h-[100px] rounded-xl border-2 border-dashed border-darkBorder flex items-center justify-center hover:border-primary transition">
                                        <Icon name="plus" size={24} className="text-slate-500" />
                                    </button>
                                )}
                            </div>
                            <p className="text-xs text-slate-500 mt-1">
                                {mediaItems.length}/4 объектов • Видео макс. 60 сек
                            </p>
                        </div>
                    )}

                    {/* Кнопка выбора файлов */}
                    {mediaItems.length === 0 && (
                        <button onClick={() => fileRef.current?.click()}
                            className="w-full aspect-video bg-darkCard border-2 border-dashed border-darkBorder rounded-2xl flex flex-col items-center justify-center gap-3 mb-5 hover:border-primary transition active:scale-95">
                            <Icon name="camera" size={40} className="text-slate-500" />
                            <p className="text-slate-400 font-semibold">Выбрать фото или видео</p>
                            <p className="text-xs text-slate-600">До 4 объектов • Видео до 60 сек</p>
                        </button>
                    )}

                    <input ref={fileRef} type="file" accept="image/*,video/*" multiple className="hidden" onChange={handleFilesSelected} />

                    {/* Описание */}
                    <textarea value={caption} onChange={e => setCaption(e.target.value)}
                        placeholder="Описание..." rows={3}
                        className="w-full bg-darkCard border border-darkBorder rounded-xl p-4 outline-none focus:border-primary resize-none mb-4" />

                    {/* Кнопка публикации */}
                    <button onClick={publish} disabled={!mediaItems.length || uploading}
                        className={`w-full py-4 rounded-xl font-bold active:scale-95 transition flex items-center justify-center gap-2 ${
                            mediaItems.length && !uploading ? 'bg-primary' : 'bg-darkCard text-slate-600'
                        }`}>
                        {uploading && <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full spinner" />}
                        {uploading ? 'Загрузка...' : 'Опубликовать'}
                    </button>

                    {/* Модалка: лимит исчерпан */}
                    {status === 'limit' && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">
                            <div className="bg-darkCard border border-darkBorder rounded-2xl p-6 max-w-sm w-full text-center">
                                <div className="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
                                    <Icon name="lock" size={28} className="text-red-400" />
                                </div>
                                <h3 className="text-xl font-bold mb-2">Лимит исчерпан</h3>
                                <p className="text-slate-400 text-sm mb-4">
                                    Free: {limitInfo.limit}/нед • Premium: 6/нед
                                </p>
                                <p className="text-xs text-slate-500 mb-5">
                                    💡 Удали старый пост, чтобы освободить место
                                </p>
                                <button onClick={() => setStatus(null)}
                                    className="w-full bg-darkBorder py-3 rounded-xl font-semibold">
                                    Позже
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Тосты */}
                    {status === 'success' && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-green-500 px-6 py-3 rounded-full font-semibold shadow-lg z-50 fade-in">
                            ✅ Опубликовано!
                        </div>
                    )}
                    {status === 'error' && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-red-500 px-6 py-3 rounded-full font-semibold shadow-lg z-50 fade-in">
                            ❌ Ошибка загрузки
                        </div>
                    )}
                </div>
            );
        };


        // ==========================================
        // 👤 PROFILE PAGE (Посты + Промокоды)
        // ==========================================
        const ProfilePage = () => {
            const { user, profile, refreshProfile } = useAuth();
            const [tab, setTab] = useState('posts');
            const [code, setCode] = useState('');
            const [result, setResult] = useState(null);
            const [myPosts, setMyPosts] = useState([]);
            const [applying, setApplying] = useState(false);

            // Загрузка своих постов
            useEffect(() => {
                if (user) {
                    supabase.from('posts')
                        .select('*')
                        .eq('user_id', user.id)
                        .order('created_at', { ascending: false })
                        .then(({ data }) => setMyPosts(data || []));
                }
            }, [user, tab]);

            if (!user) {
                return (
                    <div className="h-full flex items-center justify-center text-slate-500 fade-in">
                        <div className="text-center">
                            <Icon name="user" size={48} className="mb-3 mx-auto" />
                            <p>Профиль только для аккаунтов</p>
                        </div>
                    </div>
                );
            }

            // Активация промокода через RPC функцию
            const applyPromo = async () => {
                if (!code.trim()) return;
                setApplying(true);
                const { data, error } = await supabase.rpc('activate_promo', {
                    p_code: code.trim().toUpperCase()
                });
                setResult(data || { success: false, error: error?.message || 'Ошибка' });
                if (data?.success) {
                    refreshProfile();
                    setCode('');
                }
                setApplying(false);
                setTimeout(() => setResult(null), 3000);
            };

            // Удаление своего поста
            const deletePost = async (postId) => {
                if (!confirm('Удалить пост?')) return;
                await supabase.rpc('delete_post_and_restore', { p_post_id: postId });
                refreshProfile();
                setMyPosts(prev => prev.filter(p => p.id !== postId));
            };

            return (
                <div className="fade-in pb-24">
                    {/* Шапка профиля */}
                    <div className="px-5 py-4 flex items-center justify-between border-b border-darkBorder">
                        <h2 className="text-lg font-bold">@{profile?.username}</h2>
                        <button className="p-2 text-slate-400"><Icon name="settings" /></button>
                    </div>

                    {/* Информация */}
                    <div className="px-5 py-5 flex items-center gap-5">
                        <Avatar src={profile?.avatar_url} size={80} isPremium={profile?.is_premium} />
                        <div className="flex-1">
                            <div className="flex items-center gap-2 flex-wrap">
                                <h3 className="font-bold text-lg">{profile?.username}</h3>
                                {profile?.is_premium && (
                                    <span className="bg-gradient-to-r from-orange-500 to-pink-500 text-white text-xs font-bold px-2 py-0.5 rounded-full flex items-center gap-1 shadow-[0_0_10px_rgba(234,88,12,0.5)]">
                                        <Icon name="crown" size={10} filled /> PREMIUM
                                    </span>
                                )}
                            </div>
                            <p className="text-sm text-slate-400 mt-1">
                                Постов: {myPosts.length} • {profile?.is_premium ? '60 FPS • HD' : '30 FPS • SD'}
                            </p>
                        </div>
                    </div>

                    {/* Кнопка редактирования */}
                    <div className="px-5 pb-4">
                        <button className="w-full py-2.5 bg-darkCard border border-darkBorder rounded-lg text-sm font-semibold flex items-center justify-center gap-2">
                            <Icon name="edit" size={14} /> Редактировать профиль
                        </button>
                    </div>

                    {/* Табы */}
                    <div className="flex border-b border-darkBorder">
                        <button onClick={() => setTab('posts')}
                            className={`flex-1 py-3 flex justify-center relative ${tab === 'posts' ? 'text-white' : 'text-slate-500'}`}>
                            <Icon name="grid" />
                            {tab === 'posts' && <div className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-white rounded-full" />}
                        </button>
                        <button onClick={() => setTab('promo')}
                            className={`flex-1 py-3 flex justify-center relative ${tab === 'promo' ? 'text-yellow-400' : 'text-slate-500'}`}>
                            <Icon name="gift" />
                            {tab === 'promo' && <div className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-yellow-400 rounded-full" />}
                        </button>
                    </div>

                    {/* Контент табов */}
                    {tab === 'posts' ? (
                        <div className="grid grid-cols-3 gap-0.5 p-0.5">
                            {myPosts.length ? myPosts.map(post => (
                                <div key={post.id} className="aspect-square bg-darkCard overflow-hidden relative group cursor-pointer">
                                    {post.media_items?.[0]?.type === 'video'
                                        ? <video src={post.media_items[0].url} className="w-full h-full object-cover" />
                                        : <img src={post.media_items?.[0]?.url} className="w-full h-full object-cover" />
                                    }
                                    {post.media_items?.length > 1 && (
                                        <div className="absolute top-1 right-1 bg-black/60 px-1.5 rounded text-[10px] font-bold">
                                            {post.media_items.length}
                                        </div>
                                    )}
                                    <button onClick={() => deletePost(post.id)}
                                        className="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                        <Icon name="trash" className="text-red-400" />
                                    </button>
                                </div>
                            )) : (
                                <div className="col-span-3 py-12 text-center text-slate-500">Нет постов</div>
                            )}
                        </div>
                    ) : (
                        <div className="p-5 space-y-4">
                            {/* Поле ввода промокода */}
                            <div className="bg-darkCard rounded-xl p-4 border border-darkBorder">
                                <h3 className="font-bold mb-3 flex items-center gap-2">
                                    <Icon name="gift" size={18} className="text-primary" /> Активировать код
                                </h3>
                                <div className="flex gap-2">
                                    <input value={code} onChange={e => setCode(e.target.value.toUpperCase())}
                                        placeholder="ВВЕДИ КОД"
                                        className="flex-1 bg-dark border border-darkBorder rounded-lg px-3 py-2.5 text-sm outline-none focus:border-primary uppercase tracking-wider" />
                                    <button onClick={applyPromo} disabled={applying}
                                        className="bg-primary px-5 rounded-lg font-bold active:scale-95 transition flex items-center gap-2">
                                        {applying && <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full spinner" />}
                                        OK
                                    </button>
                                </div>
                            </div>

                            {/* Результат активации */}
                            {result && (
                                <div className={`rounded-xl p-4 text-sm font-semibold fade-in ${
                                    result.success
                                        ? 'bg-green-500/20 text-green-400 border border-green-500/30'
                                        : 'bg-red-500/20 text-red-400 border border-red-500/30'
                                }`}>
                                    {result.message || result.error}
                                </div>
                            )}

                            {/* Информация о Premium */}
                            <div className="bg-gradient-to-br from-orange-500/10 to-pink-500/10 rounded-xl p-4 border border-orange-500/20">
                                <h3 className="font-bold text-orange-400 mb-2 flex items-center gap-2">
                                    <Icon name="crown" size={16} filled className="text-orange-400" /> Premium даёт
                                </h3>
                                <ul className="text-sm text-slate-300 space-y-1.5">
                                    <li>• 6 постов в неделю (вместо 2)</li>
                                    <li>• 60 FPS и HD качество</li>
                                    <li>• Неоновая галочка и обводка</li>
                                </ul>
                            </div>

                            {/* Тестовые коды */}
                            <details className="text-xs text-slate-600">
                                <summary className="cursor-pointer">🔧 Тестовые коды</summary>
                                <div className="mt-2 p-3 bg-darkCard rounded-lg">
                                    <p className="text-yellow-400 font-bold">PULSE-GOD — навсегда</p>
                                    <p>PULSE-001 ... PULSE-100 — на месяц</p>
                                </div>
                            </details>
                        </div>
                    )}
                </div>
            );
        };


        // ==========================================
        // 🔔 ACTIVITY PAGE
        // ==========================================
        const ActivityPage = () => (
            <div className="fade-in p-6 text-center mt-20">
                <Icon name="heart" size={48} className="text-slate-700 mb-4 mx-auto" />
                <p className="text-slate-500 text-lg font-semibold">Уведомления пусты</p>
                <p className="text-slate-600 text-sm mt-2">Лайки и комментарии появятся здесь</p>
            </div>
        );


        // ==========================================
        // 🧭 BOTTOM NAVIGATION
        // ==========================================
        const BottomNav = ({ active, setActive }) => {
            const { profile } = useAuth();
            const tabs = [
                { id: 'home', label: 'Главная', icon: 'home' },
                { id: 'feed', label: 'Лента', icon: 'play' },
                { id: 'create', label: '', icon: 'plus' },
                { id: 'activity', label: 'Активность', icon: 'heart' },
                { id: 'profile', label: 'Профиль', icon: 'user' },
            ];

            return (
                <nav className="fixed bottom-0 left-0 right-0 z-40 bg-dark/90 backdrop-blur-xl border-t border-darkBorder safe-bottom">
                    <div className="max-w-lg mx-auto flex items-center justify-around h-16">
                        {tabs.map(tab => {
                            const isActive = active === tab.id;

                            if (tab.id === 'create') {
                                return (
                                    <button key={tab.id} onClick={() => setActive('create')} className="mx-1">
                                        <div className="w-12 h-9 bg-primary rounded-lg flex items-center justify-center active:scale-90 transition shadow-lg shadow-primary/40">
                                            <Icon name="plus" size={22} className="text-white" />
                                        </div>
                                    </button>
                                );
                            }

                            return (
                                <button key={tab.id} onClick={() => setActive(tab.id)}
                                    className={`flex flex-col items-center gap-0.5 py-1 px-2 transition ${isActive ? 'text-primary' : 'text-slate-500'}`}>
                                    {tab.id === 'profile' && profile?.avatar_url
                                        ? <Avatar src={profile.avatar_url} size={24} isPremium={profile.is_premium} showCheck={false} />
                                        : <Icon name={tab.icon} filled={isActive} size={24} />
                                    }
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </nav>
            );
        };


        // ==========================================
        // 🚀 MAIN APP COMPONENT
        // ==========================================
        const AppContent = () => {
            const { user, isGuest, loading } = useAuth();
            const [tab, setTab] = useState('home');

            // Экран загрузки
            if (loading) {
                return (
                    <div className="h-screen flex items-center justify-center bg-dark">
                        <div className="w-10 h-10 border-2 border-primary border-t-transparent rounded-full spinner" />
                    </div>
                );
            }

            // Если Supabase не настроен — показываем экран настройки
            if (!isSupabaseReady) {
                return <SetupScreen />;
            }

            // Если не авторизован и не гость — показываем экран входа
            if (!user && !isGuest) {
                return <AuthScreen />;
            }

            // Роутинг страниц
            const pages = {
                home: HomePage,
                feed: FeedPage,
                create: CreatePage,
                activity: ActivityPage,
                profile: ProfilePage
            };
            const Page = pages[tab] || HomePage;
            const isFeed = tab === 'feed';

            return (
                <div className="min-h-screen bg-dark">
                    {!isFeed && <Header />}
                    <main className={`${isFeed ? 'h-screen' : 'pb-16'} overflow-y-auto`}>
                        <Page />
                    </main>
                    <BottomNav active={tab} setActive={setTab} />
                </div>
            );
        };

        const App = () => (
            <AuthProvider>
                <AppContent />
            </AuthProvider>
        );


        // ==========================================
        // 🎯 РЕНДЕР С ОБРАБОТКОЙ ОШИБОК
        // ==========================================
        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (e) {
            document.getElementById('root').innerHTML = `
                <div style="color:white;padding:40px;text-align:center">
                    <h2>❌ Ошибка запуска приложения</h2>
                    <p style="color:#94a3b8;margin-top:10px">${e.message}</p>
                    <p style="color:#64748b;margin-top:10px;font-size:12px">
                        Открой консоль браузера (F12) для деталей
                    </p>
                </div>
            `;
        }
    </script>
</body>
</html>
