<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ПУЛЬС | Pulse Social</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SUPABASE JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <style>
        /* Глобальные стили и сброс */
        :root {
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --primary: #3b82f6;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Утилиты */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Premium Effects */
        .premium-ring {
            background: linear-gradient(45deg, #ff00cc, #333399, #00ccff);
            padding: 2px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        
        .neon-check {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 50%;
            padding: 2px;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.8);
            border: 2px solid var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* TikTok Scroll Snap */
        .tiktok-container {
            height: calc(100vh - 70px);
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            background: black;
            scroll-behavior: smooth;
        }
        .tiktok-item {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Анимации */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Исправление бага с клавиатурой на iOS/Android */
        .input-fix:focus {
            transform: translateZ(0);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==========================================
        // КОНФИГУРАЦИЯ SUPABASE
        // ==========================================
        // ЗАМЕНИ ЭТИ ЗНАЧЕНИЯ НА СВОИ!
        const SUPABASE_URL = 'ТВОЙ_SUPABASE_URL'; 
        const SUPABASE_KEY = 'ТВОЙ_ANON_KEY';
        
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        const DefaultAvatarSVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E`;

        // ==========================================
        // ХУКИ И УТИЛИТЫ
        // ==========================================
        
        const useAuth = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // 1. Проверяем текущую сессию (Авто-вход)
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session?.user) {
                        fetchProfile(session.user.id).then(profile => {
                            setUser({ ...session.user, ...profile });
                            setLoading(false);
                        });
                    } else {
                        setLoading(false);
                    }
                });

                // 2. Слушаем изменения входа/выхода
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session?.user) {
                        fetchProfile(session.user.id).then(profile => {
                            setUser({ ...session.user, ...profile });
                        });
                    } else {
                        setUser(null);
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            const fetchProfile = async (userId) => {
                const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
                return data || {};
            };

            return { user, loading, setUser };
        };

        const useRealtimeFeed = () => {
            const [posts, setPosts] = useState([]);
            const [videos, setVideos] = useState([]);
            const [stories, setStories] = useState([]);

            useEffect(() => {
                fetchData();

                // Подписки на изменения
                const postsSub = supabase.channel('public:posts')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, payload => {
                        setPosts(prev => [payload.new, ...prev]);
                    }).subscribe();

                const videosSub = supabase.channel('public:videos')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'videos' }, payload => {
                        setVideos(prev => [payload.new, ...prev]);
                    }).subscribe();

                const storiesSub = supabase.channel('public:stories')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'stories' }, payload => {
                        setStories(prev => [payload.new, ...prev]);
                    }).subscribe();

                return () => {
                    supabase.removeChannel(postsSub);
                    supabase.removeChannel(videosSub);
                    supabase.removeChannel(storiesSub);
                };
            }, []);

            const fetchData = async () => {
                // Загружаем посты с данными автора
                const { data: p } = await supabase
                    .from('posts')
                    .select('*, profiles(username, avatar_url, is_premium)')
                    .order('created_at', { ascending: false })
                    .limit(50);
                
                // Загружаем видео
                const { data: v } = await supabase
                    .from('videos')
                    .select('*, profiles(username, avatar_url, is_premium)')
                    .order('created_at', { ascending: false })
                    .limit(50);

                // Загружаем истории (только за последние 24 часа)
                const yesterday = new Date(Date.now() - 86400000).toISOString();
                const { data: s } = await supabase
                    .from('stories')
                    .select('*, profiles(username, avatar_url, is_premium)')
                    .gte('created_at', yesterday)
                    .order('created_at', { ascending: false });

                setPosts(p || []);
                setVideos(v || []);
                setStories(s || []);
            };

            return { posts, videos, stories, refresh: fetchData };
        };

        // ==========================================
        // КОМПОНЕНТЫ ИНТЕРФЕЙСА
        // ==========================================

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Avatar = ({ url, isPremium, size = "w-10 h-10" }) => (
            <div className={`relative ${isPremium ? 'premium-ring' : ''}`}>
                <div className={`${size} rounded-full bg-slate-800 overflow-hidden border-2 border-[#020617]`}>
                    <img src={url || DefaultAvatarSVG} className="w-full h-full object-cover" onError={(e) => e.target.src = DefaultAvatarSVG} />
                </div>
                {isPremium && (
                    <div className="neon-check w-4 h-4">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4" className="w-2.5 h-2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                )}
            </div>
        );

        // --- ЭКРАН АВТОРИЗАЦИИ ---
        const AuthScreen = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [mode, setMode] = useState('login');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleAuth = async () => {
                if (!username || !password) return setError("Заполните все поля");
                setLoading(true);
                setError('');

                try {
                    if (mode === 'register') {
                        const { data, error } = await supabase.auth.signUp({
                            email: `${username.replace(/\s/g, '')}@pulse.app`,
                            password: password,
                            options: { data: { username: username, avatar_url: DefaultAvatarSVG } }
                        });
                        if (error) throw error;
                        alert("Аккаунт создан! Войдите.");
                        setMode('login');
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({
                            email: `${username.replace(/\s/g, '')}@pulse.app`,
                            password: password,
                        });
                        if (error) throw error;
                        // Логин обработается хуком useAuth автоматически
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-[#020617] animate-fade-in">
                    <h1 className="text-6xl font-black text-blue-500 mb-8 tracking-widest drop-shadow-lg">ПУЛЬС</h1>
                    <div className="w-full max-w-sm space-y-4">
                        <div className="space-y-2">
                            <label className="text-xs text-slate-400 uppercase font-bold ml-1">Никнейм</label>
                            <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-4 bg-slate-900 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500 transition-colors input-fix" />
                        </div>
                        <div className="space-y-2">
                            <label className="text-xs text-slate-400 uppercase font-bold ml-1">Пароль</label>
                            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 bg-slate-900 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500 transition-colors input-fix" />
                        </div>
                        
                        {error && <div className="bg-red-500/10 text-red-500 p-3 rounded-lg text-sm text-center">{error}</div>}

                        <button onClick={handleAuth} disabled={loading} className="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20">
                            {loading ? 'Обработка...' : (mode==='login'?'Войти в систему':'Создать аккаунт')}
                        </button>
                        
                        <div className="flex justify-between items-center pt-4">
                            <button onClick={()=>setMode(mode==='login'?'register':'login')} className="text-slate-400 text-sm hover:text-white transition-colors">
                                {mode==='login'?'Нет аккаунта? Регистрация':'Уже есть аккаунт? Вход'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- ГЛАВНАЯ ВКЛАДКА ---
        const MainTab = ({ searchQuery, setSearchQuery, stories, posts }) => {
            const filteredPosts = posts.filter(p => 
                p.content_text?.toLowerCase().includes(searchQuery.toLowerCase()) || 
                p.profiles?.username?.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="pb-24 min-h-screen animate-fade-in">
                    {/* Поиск */}
                    <div className="sticky top-0 z-30 bg-[#020617]/95 backdrop-blur-md p-4 border-b border-slate-800/50">
                        <div className="relative group">
                            <Icon name="search" className="absolute left-3 top-3 text-slate-500 group-focus-within:text-blue-500 transition-colors" size={20} />
                            <input 
                                type="text" 
                                placeholder="Поиск людей и постов..." 
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                className="w-full bg-slate-900/50 text-white pl-10 pr-4 py-2.5 rounded-xl border border-slate-800 focus:border-blue-500 focus:bg-slate-900 outline-none transition-all input-fix"
                            />
                        </div>
                    </div>

                    {/* Stories */}
                    {!searchQuery && (
                        <div className="py-4 border-b border-slate-800/50 bg-[#020617]">
                            <div className="flex space-x-4 overflow-x-auto no-scrollbar px-4 pb-2">
                                <div className="flex flex-col items-center space-y-1 min-w-[72px] cursor-pointer group">
                                    <div className="w-16 h-16 rounded-full border-2 border-dashed border-slate-600 flex items-center justify-center bg-slate-800 group-hover:border-blue-500 transition-colors">
                                        <Icon name="plus" className="text-slate-400" />
                                    </div>
                                    <span className="text-xs text-slate-400 font-medium">Добавить</span>
                                </div>
                                {stories.map(s => (
                                    <div key={s.id} className="flex flex-col items-center space-y-1 min-w-[72px] cursor-pointer transform hover:scale-105 transition-transform">
                                        <Avatar url={s.profiles?.avatar_url} isPremium={s.profiles?.is_premium} size="w-16 h-16" />
                                        <span className="text-xs text-slate-300 truncate w-16 text-center font-medium">{s.profiles?.username}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Posts Feed */}
                    <div className="space-y-4 mt-2 px-0 md:px-4 max-w-2xl mx-auto">
                        {filteredPosts.length === 0 && !searchQuery && (
                            <div className="flex flex-col items-center justify-center py-20 text-slate-600">
                                <Icon name="image-off" size={48} className="mb-4 opacity-20" />
                                <p>Лента пуста. Создайте первый пост!</p>
                            </div>
                        )}
                        {filteredPosts.map(post => (
                            <div key={post.id} className="bg-slate-900/40 backdrop-blur-sm rounded-none md:rounded-xl overflow-hidden border-b md:border border-slate-800/50">
                                <div className="flex items-center p-3 space-x-3">
                                    <Avatar url={post.profiles?.avatar_url} isPremium={post.profiles?.is_premium} />
                                    <div>
                                        <p className="font-bold text-sm text-white">{post.profiles?.username}</p>
                                        <p className="text-xs text-slate-500">{new Date(post.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                    </div>
                                    <button className="ml-auto text-slate-500 hover:text-white"><Icon name="more-horizontal" size={20}/></button>
                                </div>
                                
                                {post.image_url && (
                                    <div className="w-full aspect-square bg-black relative group">
                                        <img src={post.image_url} className="w-full h-full object-cover" loading="lazy" />
                                    </div>
                                )}
                                
                                <div className="p-3">
                                    <div className="flex space-x-4 mb-2">
                                        <button className="hover:text-red-500 transition-colors"><Icon name="heart" size={24} /></button>
                                        <button className="hover:text-blue-500 transition-colors"><Icon name="message-circle" size={24} /></button>
                                        <button className="hover:text-green-500 transition-colors ml-auto"><Icon name="send" size={24} /></button>
                                    </div>
                                    <p className="text-sm text-slate-300 leading-relaxed">
                                        <span className="font-bold text-white mr-2">{post.profiles?.username}</span>
                                        {post.content_text}
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- ЛЕНТА ВИДЕО (TIKTOK) ---
        const FeedTab = ({ videos }) => (
            <div className="tiktok-container bg-black pb-20 snap-y snap-mandatory">
                {videos.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-slate-500">
                        <Icon name="film" size={48} className="mb-4 opacity-20" />
                        <p>Видео ленты пока нет</p>
                    </div>
                ) : (
                    videos.map(v => (
                        <div key={v.id} className="tiktok-item snap-start relative bg-slate-900">
                            {/* Здесь должен быть тег <video>, но для демо используем заглушку или картинку если это превью */}
                            <div className="absolute inset-0 flex items-center justify-center bg-slate-800">
                                <p className="text-slate-500">Видео контент</p>
                            </div>
                            
                            {/* UI Overlay */}
                            <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent pt-20">
                                <div className="flex items-end justify-between">
                                    <div className="max-w-[80%]">
                                        <p className="font-bold text-white text-lg drop-shadow-md">@{v.profiles?.username}</p>
                                        <p className="text-white text-sm drop-shadow-md line-clamp-2">{v.description}</p>
                                    </div>
                                    <div className="flex flex-col space-y-4 items-center mb-2">
                                        <div className="bg-slate-800/40 backdrop-blur-md p-3 rounded-full hover:bg-slate-700/40 transition-colors cursor-pointer">
                                            <Icon name="heart" className="text-white" />
                                        </div>
                                        <div className="bg-slate-800/40 backdrop-blur-md p-3 rounded-full hover:bg-slate-700/40 transition-colors cursor-pointer">
                                            <Icon name="message-square" className="text-white" />
                                        </div>
                                        <div className="bg-slate-800/40 backdrop-blur-md p-3 rounded-full hover:bg-slate-700/40 transition-colors cursor-pointer">
                                            <Icon name="share-2" className="text-white" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))
                )}
            </div>
        );

        // --- СОЗДАНИЕ КОНТЕНТА ---
        const CreateTab = ({ user, onSuccess }) => {
            const [type, setType] = useState('post');
            const [title, setTitle] = useState('');
            const [text, setText] = useState('');
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [uploading, setUploading] = useState(false);

            const handleFile = (e) => {
                const f = e.target.files[0];
                if (f) {
                    setFile(f);
                    setPreview(URL.createObjectURL(f));
                }
            };

            const handleUpload = async () => {
                if (!file || !text) return alert("Заполните описание и выберите файл");
                setUploading(true);

                try {
                    // 1. Загрузка файла в Storage
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random()}.${fileExt}`;
                    const filePath = `${user.id}/${fileName}`;

                    const { error: uploadError } = await supabase.storage
                        .from('media')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    // 2. Получение публичной ссылки
                    const { data: urlData } = supabase.storage.from('media').getPublicUrl(filePath);
                    const publicUrl = urlData.publicUrl;

                    // 3. Запись в базу данных
                    const table = type === 'video' ? 'videos' : (type === 'story' ? 'stories' : 'posts');
                    const insertData = {
                        author_id: user.id,
                        title: title,
                        content_text: text,
                        created_at: new Date().toISOString()
                    };

                    if (type === 'video') insertData.video_url = publicUrl;
                    else if (type === 'story') insertData.media_url = publicUrl;
                    else insertData.image_url = publicUrl;

                    const { error: dbError } = await supabase.from(table).insert(insertData);
                    if (dbError) throw dbError;

                    alert("Опубликовано!");
                    onSuccess();
                } catch (err) {
                    console.error(err);
                    alert("Ошибка загрузки: " + err.message);
                } finally {
                    setUploading(false);
                }
            };

            return (
                <div className="p-4 pb-24 min-h-screen animate-slide-up">
                    <h2 className="text-2xl font-bold mb-6">Новая публикация</h2>
                    
                    <div className="flex space-x-2 mb-6 bg-slate-900 p-1 rounded-xl">
                        {['post', 'story', 'video'].map(t => (
                            <button 
                                key={t} 
                                onClick={() => setType(t)}
                                className={`flex-1 py-3 text-sm font-bold rounded-lg capitalize transition-all ${type===t ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}
                            >
                                {t === 'post' ? 'Пост (Фото)' : t === 'story' ? 'История' : 'Видео'}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-4">
                        <input 
                            placeholder="Заголовок (необязательно)" 
                            className="w-full bg-slate-900 p-4 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500 transition-colors input-fix"
                            value={title}
                            onChange={e => setTitle(e.target.value)}
                        />

                        <textarea 
                            placeholder="Опишите момент..." 
                            className="w-full bg-slate-900 p-4 rounded-xl border border-slate-800 text-white outline-none focus:border-blue-500 transition-colors h-32 resize-none input-fix"
                            value={text}
                            onChange={e => setText(e.target.value)}
                        />

                        <div className="mb-6">
                            {!preview ? (
                                <label className="flex flex-col items-center justify-center w-full h-56 border-2 border-dashed border-slate-700 rounded-xl cursor-pointer hover:bg-slate-900/50 hover:border-blue-500 transition-all group">
                                    <div className="bg-slate-800 p-4 rounded-full mb-3 group-hover:scale-110 transition-transform">
                                        <Icon name="upload-cloud" size={32} className="text-blue-500" />
                                    </div>
                                    <span className="text-slate-400 font-medium">Нажмите чтобы выбрать файл</span>
                                    <input type="file" accept="image/*,video/*" className="hidden" onChange={handleFile} />
                                </label>
                            ) : (
                                <div className="relative w-full h-64 rounded-xl overflow-hidden bg-black border border-slate-700">
                                    <img src={preview} className="w-full h-full object-contain" />
                                    <button onClick={() => {setFile(null); setPreview(null)}} className="absolute top-2 right-2 bg-red-500/80 backdrop-blur p-2 rounded-full hover:bg-red-600 transition-colors">
                                        <Icon name="x" size={16} className="text-white" />
                                    </button>
                                </div>
                            )}
                        </div>

                        <button 
                            onClick={handleUpload}
                            disabled={!text || !file || uploading}
                            className="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all active:scale-95 flex items-center justify-center"
                        >
                            {uploading ? (
                                <><Icon name="loader-2" className="animate-spin mr-2" /> Загрузка...</>
                            ) : 'Опубликовать'}
                        </button>
                    </div>
                </div>
            );
        };

        // --- ПРОФИЛЬ ---
        const ProfileTab = ({ user, onLogout }) => {
            const [subTab, setSubTab] = useState('content');
            const [promoCode, setPromoCode] = useState('');
            const [applying, setApplying] = useState(false);

            const applyPromo = async () => {
                if (!promoCode) return;
                setApplying(true);
                try {
                    const { data: promo, error } = await supabase.from('promo_codes').select('*').eq('code', promoCode.toUpperCase()).single();
                    if (error || !promo || promo.is_used) throw new Error("Неверный или использованный код");

                    const days = promo.duration_days;
                    const expires = days ? new Date(Date.now() + days * 86400000).toISOString() : null;

                    await supabase.from('profiles').update({ is_premium: true, premium_expires_at: expires }).eq('id', user.id);
                    await supabase.from('promo_codes').update({ is_used: true, used_by: user.id }).eq('code', promoCode.toUpperCase());
                    
                    alert("Премиум активирован! Перезагрузите страницу.");
                    window.location.reload();
                } catch (err) {
                    alert(err.message);
                } finally {
                    setApplying(false);
                }
            };

            return (
                <div className="pb-24 min-h-screen bg-[#020617] animate-fade-in">
                    <div className="sticky top-0 z-30 bg-[#020617]/95 backdrop-blur p-4 flex items-center border-b border-slate-800">
                        <button onClick={onLogout} className="p-2 -ml-2 text-slate-400 hover:text-white transition-colors">
                            <Icon name="log-out" size={24} />
                        </button>
                        <h2 className="text-lg font-bold ml-2">Настройки профиля</h2>
                    </div>

                    <div className="p-6 flex flex-col items-center border-b border-slate-800/50">
                        <Avatar url={user.avatar_url} isPremium={user.is_premium} size="w-28 h-28" />
                        <h2 className="text-2xl font-bold mt-4">{user.username}</h2>
                        {user.is_premium && <span className="text-yellow-500 text-xs font-bold mt-2 border border-yellow-500/30 bg-yellow-500/10 px-3 py-1 rounded-full">PREMIUM USER</span>}
                        
                        <div className="flex space-x-12 mt-8 text-center">
                            <div><p className="font-bold text-xl">0</p><p className="text-xs text-slate-500 uppercase tracking-wide">Постов</p></div>
                            <div><p className="font-bold text-xl">0</p><p className="text-xs text-slate-500 uppercase tracking-wide">Подписчиков</p></div>
                        </div>
                    </div>

                    <div className="flex border-b border-slate-800 sticky top-[60px] bg-[#020617] z-20">
                        <button onClick={() => setSubTab('content')} className={`flex-1 py-4 text-sm font-bold transition-colors ${subTab === 'content' ? 'text-blue-500 border-b-2 border-blue-500' : 'text-slate-500 hover:text-slate-300'}`}>
                            Публикации
                        </button>
                        <button onClick={() => setSubTab('promo')} className={`flex-1 py-4 text-sm font-bold transition-colors ${subTab === 'promo' ? 'text-blue-500 border-b-2 border-blue-500' : 'text-slate-500 hover:text-slate-300'}`}>
                            Промокоды
                        </button>
                    </div>

                    {subTab === 'content' ? (
                        <div className="grid grid-cols-3 gap-0.5 p-0.5">
                            <div className="col-span-3 py-10 text-center text-slate-600 text-sm">У вас пока нет публикаций</div>
                        </div>
                    ) : (
                        <div className="p-4 animate-fade-in">
                            <div className="bg-slate-900 rounded-xl border border-slate-800 p-6 shadow-xl">
                                <h3 className="font-bold text-blue-400 mb-4 flex items-center text-lg">
                                    <Icon name="ticket" size={20} className="mr-2"/> Активация Премиум
                                </h3>
                                {!user.is_premium ? (
                                    <div className="space-y-4">
                                        <div className="relative">
                                            <input 
                                                type="text" 
                                                placeholder="Введите промокод" 
                                                className="w-full bg-[#020617] p-4 rounded-xl border border-slate-700 text-white outline-none focus:border-blue-500 transition-colors uppercase input-fix"
                                                value={promoCode}
                                                onChange={e => setPromoCode(e.target.value)}
                                            />
                                        </div>
                                        <button 
                                            onClick={applyPromo} 
                                            disabled={applying}
                                            className="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95"
                                        >
                                            {applying ? 'Проверка...' : 'Активировать'}
                                        </button>
                                        <p className="text-xs text-center text-slate-500 mt-2">Доступно 100 кодов на 30 дней и 1 вечный.</p>
                                    </div>
                                ) : (
                                    <div className="text-center py-4">
                                        <Icon name="check-circle-2" size={48} className="mx-auto text-green-500 mb-2" />
                                        <p className="text-green-500 font-bold">Премиум активен</p>
                                        <p className="text-slate-400 text-sm mt-1">Вы можете выкладывать до 4 видео в неделю.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- ГЛАВНЫЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ ---
        const App = () => {
            const { user, loading } = useAuth();
            const { posts, videos, stories, refresh } = useRealtimeFeed();
            const [activeTab, setActiveTab] = useState('main');
            const [searchQuery, setSearchQuery] = useState('');

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#020617]">
                        <div className="flex flex-col items-center">
                            <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <p className="text-blue-500 font-bold tracking-widest animate-pulse">ПУЛЬС</p>
                        </div>
                    </div>
                );
            }

            if (!user) return <AuthScreen />;

            return (
                <div className="min-h-screen bg-[#020617] text-slate-200">
                    {activeTab === 'main' && <MainTab searchQuery={searchQuery} setSearchQuery={setSearchQuery} stories={stories} posts={posts} />}
                    {activeTab === 'feed' && <FeedTab videos={videos} />}
                    {activeTab === 'create' && <CreateTab user={user} onSuccess={() => { setActiveTab('main'); refresh(); }} />}
                    {activeTab === 'profile' && <ProfileTab user={user} onLogout={() => supabase.auth.signOut()} />}

                    {/* Нижняя навигация */}
                    <div className="fixed bottom-0 w-full bg-[#020617]/95 backdrop-blur-lg border-t border-slate-800/50 flex justify-around py-2 z-50 pb-[calc(0.5rem+var(--safe-bottom))]">
                        {[
                            { id: 'main', icon: 'home', label: 'Главная' },
                            { id: 'feed', icon: 'play-circle', label: 'Лента' },
                            { id: 'create', icon: 'plus-square', label: '+' },
                            { id: 'profile', icon: 'user', label: 'Профиль' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)} 
                                className={`flex flex-col items-center w-1/5 p-2 rounded-xl transition-all duration-300 ${activeTab===tab.id ? 'text-blue-500 -translate-y-1' : 'text-slate-500 hover:text-slate-300'}`}
                            >
                                <div className={`p-1 rounded-full ${activeTab===tab.id ? 'bg-blue-500/10' : ''}`}>
                                    <Icon name={tab.icon} size={24} className={activeTab===tab.id ? 'stroke-[2.5px]' : ''} />
                                </div>
                                <span className="text-[10px] mt-1 font-medium">{tab.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
