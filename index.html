<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shadow — Короткие видео</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body { height: 100dvh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior: none; touch-action: manipulation; position: fixed; width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; -webkit-tap-highlight-color: transparent; }
input, textarea { font-family: inherit; outline: none; border: none; }
video, img { display: block; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a0a; }
::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }

:root {
  --primary: #a855f7; --primary-dark: #7c3aed; --primary-light: #c084fc;
  --text-sec: #a1a1aa; --text-muted: #52525b; --border: #27272a;
  --bg-card: #0a0a0a; --bg-card-alt: #121212; --bg-input: #1a1a1a;
  --error: #ef4444; --success: #22c55e;
  --premium: #fbbf24; --premium-dark: #f59e0b;
  --nav-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

#app { width: 100%; height: 100%; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; opacity: 0; transition: opacity 0.25s ease; }
.screen.active { display: flex; opacity: 1; }
.screen.no-pad { padding: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; transition: all 0.15s ease; min-height: 48px; user-select: none; }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 20px rgba(168,85,247,0.3); }
.btn-premium { background: linear-gradient(135deg, var(--premium), var(--premium-dark)); color: #000; font-weight: 700; }
.btn-telegram { background: linear-gradient(135deg, #2AABEE, #1E96D1); color: #fff; font-weight: 700; }
.btn-secondary { background: var(--bg-card-alt); color: #fff; border: 1px solid var(--border); }
.btn-ghost { background: transparent; color: var(--text-sec); }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
.btn-small { padding: 8px 14px; font-size: 13px; min-height: 36px; }
.btn-block { width: 100%; max-width: 320px; }

.form-group { width: 100%; max-width: 360px; margin-bottom: 18px; text-align: left; }
.form-label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-sec); font-weight: 500; }
.form-input, .form-textarea { width: 100%; padding: 14px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 16px; transition: border-color 0.2s; }
.form-input:focus, .form-textarea:focus { border-color: var(--primary); }
.form-textarea { resize: none; min-height: 80px; }

.avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; border: 2px solid var(--border); overflow: hidden; position: relative; }
.avatar.small { width: 32px; height: 32px; font-size: 13px; }
.avatar.big { width: 44px; height: 44px; font-size: 16px; cursor: pointer; }
.avatar.xxl { width: 110px; height: 110px; font-size: 42px; }
.avatar.premium { background: linear-gradient(135deg, var(--premium), var(--premium-dark)); color: #000; border-color: var(--premium); }
.avatar.regular { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
.avatar.banned { background: #333; color: #666; border-color: var(--error); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.has-story { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.avatar.has-story.premium { border-color: var(--premium); box-shadow: 0 0 0 2px var(--premium); }

/* STORIES BAR */
.stories-bar { display: flex; gap: 12px; padding: 12px 14px; overflow-x: auto; scrollbar-width: none; background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stories-bar::-webkit-scrollbar { display: none; }
.story-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
.story-avatar-wrap .avatar { width: 56px; height: 56px; font-size: 20px; }
.story-avatar-name { font-size: 11px; color: var(--text-sec); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.story-add-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-sec); cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
.story-add-btn:hover { border-color: var(--primary); color: var(--primary); }

/* STORY VIEWER */
.story-viewer { position: fixed; inset: 0; z-index: 500; background: #000; display: none; flex-direction: column; }
.story-viewer.active { display: flex; }
.story-progress-bar { display: flex; gap: 4px; padding: 12px 12px 0; position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
.story-progress-segment { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
.story-progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
.story-progress-segment.done .story-progress-fill { width: 100%; }
.story-progress-segment.active .story-progress-fill { width: 0%; animation: storyProgress linear forwards; }
@keyframes storyProgress { from { width: 0%; } to { width: 100%; } }

.story-header { position: absolute; top: 24px; left: 12px; right: 12px; z-index: 10; display: flex; align-items: center; gap: 10px; }
.story-header .avatar { width: 36px; height: 36px; font-size: 14px; }
.story-header-name { font-weight: 700; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.story-header-time { font-size: 12px; color: rgba(255,255,255,0.7); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.story-close { position: absolute; top: 24px; right: 12px; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.story-close svg { width: 20px; height: 20px; fill: #fff; }

.story-content { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.story-content img, .story-content video { max-width: 100%; max-height: 100%; object-fit: contain; }

.story-nav-zone { position: absolute; top: 80px; bottom: 80px; width: 30%; z-index: 8; }
.story-nav-left { left: 0; }
.story-nav-right { right: 0; }

/* STORY UPLOAD */
.story-upload-slides { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.story-upload-slides::-webkit-scrollbar { display: none; }
.story-slide-preview { width: 80px; height: 120px; border-radius: 8px; overflow: hidden; position: relative; flex-shrink: 0; border: 2px solid var(--border); background: var(--bg-card-alt); }
.story-slide-preview img, .story-slide-preview video { width: 100%; height: 100%; object-fit: cover; }
.story-slide-remove { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
.story-slide-add { width: 80px; height: 120px; border-radius: 8px; border: 2px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; cursor: pointer; color: var(--text-sec); font-size: 12px; transition: all 0.2s; }
.story-slide-add:hover { border-color: var(--primary); color: var(--primary); }
.story-slide-number { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

.welcome-title { font-size: clamp(52px, 13vw, 76px); font-weight: 900; background: linear-gradient(135deg, #a855f7, #c084fc, #7c3aed); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; letter-spacing: -2px; }
.welcome-subtitle { color: var(--text-sec); font-size: 15px; text-align: center; max-width: 300px; line-height: 1.5; }
.welcome-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-top: 40px; }

.feed-container { width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
.feed-container::-webkit-scrollbar { display: none; }

.video-card { position: relative; width: 100%; height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; background: #000; overflow: hidden; }
.video-element { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.video-gradient { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 35%); }
.video-info { position: absolute; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); left: 14px; right: 76px; z-index: 5; }
.video-author-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.video-author-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); cursor: pointer; }
.video-desc { font-size: 14px; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.8); margin-bottom: 6px; }
.video-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.video-tag { font-size: 13px; color: var(--primary-light); font-weight: 600; }

.play-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; z-index: 6; }
.play-indicator svg { width: 100%; height: 100%; fill: rgba(255,255,255,0.95); filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6)); }
.play-indicator.visible { opacity: 1; }

.video-actions { position: absolute; right: 10px; bottom: calc(var(--nav-h) + var(--safe-b) + 20px); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.video-action { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.video-action-btn { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); transition: transform 0.15s; }
.video-action-btn:active { transform: scale(0.85); }
.video-action-btn svg { width: 26px; height: 26px; fill: #fff; }
.video-action.liked .video-action-btn svg { fill: var(--primary); }
.video-action.saved .video-action-btn svg { fill: var(--premium); }
.video-action-count { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.avatar-follow-wrap { position: relative; margin-bottom: 6px; }
.follow-plus { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; border: 2px solid #000; transition: background 0.15s; }
.follow-plus.followed { background: var(--success); }

.video-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #121212, #000); gap: 12px; }

#bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; z-index: 100; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-muted); transition: color 0.2s; }
.nav-btn svg { width: 24px; height: 24px; fill: currentColor; }
.nav-btn span { font-size: 10px; }
.nav-btn.active { color: var(--primary); }
.upload-nav-btn { width: 44px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(168,85,247,0.4); }
.upload-nav-btn svg { width: 22px; height: 22px; fill: #fff; }

.profile-header { text-align: center; margin-bottom: 20px; }
.profile-name-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; }
.profile-name { font-size: 21px; font-weight: 800; }
.profile-username { color: var(--text-sec); font-size: 14px; margin-top: 4px; }
.profile-bio { color: var(--text-sec); font-size: 14px; margin-top: 10px; max-width: 300px; }
.profile-stats { display: flex; justify-content: center; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
.stat-val { font-size: 20px; font-weight: 800; }
.stat-label { font-size: 12px; color: var(--text-sec); }
.profile-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 20px 0 16px; }
.profile-tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-sec); border-bottom: 2px solid transparent; transition: all 0.2s; cursor: pointer; }
.profile-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.videos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: 100%; }
.grid-video { aspect-ratio: 9/16; background: var(--bg-card-alt); border-radius: 3px; overflow: hidden; position: relative; cursor: pointer; }
.grid-video video, .grid-video img { width: 100%; height: 100%; object-fit: cover; }
.grid-video-views { position: absolute; bottom: 6px; left: 6px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 3px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.grid-video-menu-btn { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 700; z-index: 3; }

.promo-tab-content { padding: 10px 0; }
.promo-status { background: var(--bg-card-alt); border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 16px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease; backdrop-filter: blur(3px); }
.modal { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px 20px calc(20px + var(--safe-b)); animation: slideUp 0.3s ease; border-top: 1px solid var(--border); }
@media (min-width: 768px) { .modal-overlay { align-items: center; } .modal { max-width: 520px; border-radius: 20px; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-close { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; }
.modal-close svg { width: 18px; height: 18px; fill: var(--text-sec); }

.upload-dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 36px 20px; text-align: center; transition: all 0.2s; margin-bottom: 18px; cursor: pointer; }
.upload-dropzone.has-video { border-color: var(--success); background: rgba(34,197,94,0.05); }
.upload-dropzone-icon { font-size: 42px; margin-bottom: 10px; }
.upload-preview-video { width: 100%; max-height: 280px; border-radius: 10px; background: #000; }
.upload-progress { width: 100%; height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden; margin: 10px 0; display: none; }
.upload-progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

.limit-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; margin-bottom: 16px; }
.limit-badge.premium { border-color: var(--premium); background: rgba(251,191,36,0.08); color: var(--premium); }

.comments-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
.comment-item { display: flex; gap: 10px; }
.comment-body { flex: 1; }
.comment-author { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.comment-time { font-size: 11px; color: var(--text-muted); font-weight: 400; }
.comment-text { font-size: 14px; line-height: 1.4; margin-top: 3px; }
.comment-form { display: flex; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); }
.comment-input { flex: 1; padding: 12px 16px; background: var(--bg-input); border-radius: 22px; color: #fff; font-size: 14px; }
.comment-send { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.comment-send svg { width: 20px; height: 20px; fill: #fff; }

.premium-card { background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(245,158,11,0.04)); border: 2px solid var(--premium); border-radius: 16px; padding: 24px; text-align: center; }
.premium-price { font-size: 34px; font-weight: 900; color: var(--premium); margin: 14px 0; }
.premium-features { text-align: left; margin: 18px 0; }
.premium-feature { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
.premium-badge-inline { display: inline-flex; align-items: center; gap: 5px; background: rgba(251,191,36,0.1); border: 1px solid var(--premium); color: var(--premium); padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.telegram-box { background: rgba(42,171,238,0.08); border: 1px solid rgba(42,171,238,0.4); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

.toast { position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 20px); left: 50%; transform: translateX(-50%); background: var(--bg-card-alt); border: 1px solid var(--border); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 600; max-width: 90%; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.6); animation: toastIn 0.3s ease; white-space: pre-line; }
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--error); }
.toast.premium { border-color: var(--premium); }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 20px; text-align: center; }
.empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
.empty-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.empty-text { font-size: 14px; color: var(--text-sec); max-width: 280px; line-height: 1.5; }

.ban-icon { font-size: 80px; margin-bottom: 20px; }
.ban-title { font-size: 24px; font-weight: 900; color: var(--error); margin-bottom: 12px; }

.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }

.admin-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--bg-card-alt); border-radius: 10px; margin-bottom: 8px; gap: 10px; }
.admin-section-title { font-size: 13px; font-weight: 700; color: var(--text-sec); margin: 16px 0 8px; text-transform: uppercase; }
.promo-code-box { background: var(--bg-input); border: 1px dashed var(--primary); border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 16px; letter-spacing: 2px; text-align: center; margin: 10px 0; }
.admin-tab-bar { display: flex; gap: 4px; margin-bottom: 16px; background: var(--bg-card-alt); border-radius: 10px; padding: 4px; }
.admin-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-sec); cursor: pointer; transition: all 0.2s; }
.admin-tab.active { background: var(--primary); color: #fff; }

.avatar-picker { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.avatar-preview { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; overflow: hidden; flex-shrink: 0; border: 3px solid var(--border); }
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-options { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.avatar-option { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-input); border: 2px solid var(--border); cursor: pointer; overflow: hidden; font-weight: 700; font-size: 18px; color: var(--text-sec); transition: all 0.15s; }
.avatar-option.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168,85,247,0.3); transform: scale(1.05); }
.avatar-option svg, .avatar-option img { width: 100%; height: 100%; object-fit: cover; }
.avatar-option.photo-opt { font-size: 22px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes toastIn { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes heartPop {
  0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
  15% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; }
  30% { transform: translate(-50%,-50%) scale(0.95); }
  45%, 80% { transform: translate(-50%,-50%) scale(1); opacity: 1; }

  async isFollowing(tid,cid) { if(!sb||!cid) return false; const {data}=await sb.from('follows').select('id').eq('follower_id',cid).eq('following_id',tid).maybeSingle(); return !!data; },
  async followersCount(uid) { if(!sb) return 0; const {count}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',uid); return count||0; },

  async getComments(vid) { if(!sb) return []; const {data}=await sb.from('comments').select('*, profiles(id,display_name,avatar_type,avatar_index,avatar_url,premium_until)').eq('video_id',vid).order('created_at',{ascending:true}); return data||[]; },
  async addComment({videoId,userId,text}) { if(!sb) return null; const {data}=await sb.from('comments').insert({video_id:videoId,user_id:userId,text}).select('*, profiles(id,display_name,avatar_type,avatar_index,avatar_url,premium_until)').single(); return data; },
  async redeemPromo(code,uid) {
    if(!sb) return {ok:false,error:'Нет соединения'};
    const cl=(code||'').trim().toUpperCase().replace(/\s/g,''); const clnd=cl.replace(/-/g,'');
    const {data:promos}=await sb.from('promos').select('*');
    const p=(promos||[]).find(x=>{const s=x.code.trim().toUpperCase().replace(/\s/g,''); return s===cl||s.replace(/-/g,'')===clnd;});
    if(!p) return {ok:false,error:'Промокод не найден 😕'};
    if(p.used) return {ok:false,error:'Уже использован'};
    await sb.from('promos').update({used:true,used_by:uid,used_at:new Date().toISOString()}).eq('id',p.id);
    await Premium.activate(uid,p.days);
    return {ok:true,days:p.days};
  },
  async getUploads(uid) { if(!sb) return []; const {data}=await sb.from('uploads').select('uploaded_at').eq('user_id',uid); return (data||[]).map(u=>new Date(u.uploaded_at).getTime()); },
  async banUser(uid,r) { if(!sb) return; await sb.from('profiles').update({banned:true,ban_reason:r||'Нарушение'}).eq('id',uid); },
  async unbanUser(uid) { if(!sb) return; await sb.from('profiles').update({banned:false,ban_reason:''}).eq('id',uid); },
  async createPromo() { if(!sb) return null; const c=Utils.genPromo(); const {data}=await sb.from('promos').insert({code:c,days:30}).select().single(); return data?.code||c; },
  async getAllPromos() { if(!sb) return []; const {data}=await sb.from('promos').select('*').order('created_at',{ascending:false}); return data||[]; },

  /* ===== STORIES ===== */
  async getActiveStories() {
    if(!sb) return [];
    const cutoff=new Date(Date.now()-24*60*60*1000).toISOString();
    const {data}=await sb.from('stories').select('*, profiles(id,username,display_name,avatar_type,avatar_index,avatar_url,premium_until)').gte('created_at',cutoff).order('created_at',{ascending:false});
    const result=[];
    for(const s of (data||[])){
      const {data:slides}=await sb.from('story_slides').select('*').eq('story_id',s.id).order('slide_order',{ascending:true});
      if(slides&&slides.length>0) result.push({...s,slides,author:s.profiles});
    }
    return result;
  },
  async getUserStories(userId) {
    if(!sb) return [];
    const cutoff=new Date(Date.now()-24*60*60*1000).toISOString();
    const {data}=await sb.from('stories').select('*').eq('user_id',userId).gte('created_at',cutoff).order('created_at',{ascending:false});
    const result=[];
    for(const s of (data||[])){
      const {data:slides}=await sb.from('story_slides').select('*').eq('story_id',s.id).order('slide_order',{ascending:true});
      if(slides&&slides.length>0) result.push({...s,slides});
    }
    return result;
  },
  async createStory({userId,username,slides}) {
    if(!sb) return {ok:false,error:'Нет соединения'};
    const {data:story,error:se}=await sb.from('stories').insert({user_id:userId,username}).select().single();
    if(se) return {ok:false,error:se.message};
    for(let i=0;i<slides.length;i++){
      const sl=slides[i];
      const ext=sl.type==='video'?'mp4':'jpg';
      const fname=story.id+'_'+i+'.'+ext;
      const ct=sl.type==='video'?(sl.blob.type||'video/mp4'):'image/jpeg';
      const {error:ue}=await sb.storage.from('stories').upload(fname,sl.blob,{contentType:ct});
      if(ue) return {ok:false,error:'Ошибка загрузки слайда '+(i+1)};
      const {data:pu}=sb.storage.from('stories').getPublicUrl(fname);
      await sb.from('story_slides').insert({story_id:story.id,slide_order:i,media_type:sl.type,media_url:pu.publicUrl,duration:sl.type==='video'?sl.duration:5});
    }
    return {ok:true};
  },
  async hasActiveStory(userId) {
    if(!sb) return false;
    const cutoff=new Date(Date.now()-24*60*60*1000).toISOString();
    const {count}=await sb.from('stories').select('*',{count:'exact',head:true}).eq('user_id',userId).gte('created_at',cutoff);
    return (count||0)>0;
  }
};

const Auth = {

const Limits = {
  async weekUploads(uid) { const u=await DB.getUploads(uid); const w=Date.now()-CONFIG.WEEK_MS; return u.filter(t=>t>w).length; },
  async canUpload(u) { const l=Premium.isActive(u)?CONFIG.PREMIUM_LIMIT:CONFIG.FREE_LIMIT; return (await this.weekUploads(u.id))<l; },
  async remaining(u) { const l=Premium.isActive(u)?CONFIG.PREMIUM_LIMIT:CONFIG.FREE_LIMIT; return Math.max(0,l-(await this.weekUploads(u.id))); },
  maxMB(u) { return Premium.isActive(u)?CONFIG.PREMIUM_MAX_MB:CONFIG.FREE_MAX_MB; }
};

   STORIES
   ============================================ */
const Stories = {
  allStories: [],
  currentStoryIdx: 0,
  currentSlideIdx: 0,
  timer: null,

  async loadBar() {
    const container = document.getElementById('stories-bar-container');
    if (!container) return;
    try { this.allStories = await DB.getActiveStories(); } catch { this.allStories = []; }

    let html = '<div class="stories-bar">';
    /* Кнопка добавления своей истории */
    if (Auth.user && !Auth.isGuest) {
      html += `<div class="story-avatar-wrap" onclick="Stories.openUpload()">
        <div class="story-add-btn">+</div>
        <div class="story-avatar-name">Моя история</div>
      </div>`;
    }
    /* Истории других пользователей */
    const seen = new Set();
    for (const s of this.allStories) {
      if (seen.has(s.user_id)) continue;
      seen.add(s.user_id);
      const author = s.author || {};
      const isMe = Auth.user && Auth.user.id === s.user_id;
      html += `<div class="story-avatar-wrap" onclick="Stories.openViewer('${s.user_id}')">
        <div class="avatar has-story ${Premium.isActive(author)?'premium':'regular'}">${avatarContent(author)}</div>
        <div class="story-avatar-name">${Utils.esc(isMe ? 'Вы' : (author.display_name||'?'))}</div>
      </div>`;
    }
    html += '</div>';
    container.innerHTML = html;
  },

  async openViewer(userId) {
    const stories = this.allStories.filter(s => s.user_id === userId);
    if (stories.length === 0) { Utils.toast('История не найдена', 'error'); return; }
    this.currentStoryIdx = 0;
    this.currentSlideIdx = 0;
    this._viewerStories = stories;
    this._viewerUser = stories[0].author || await Utils.getProfile(userId);
    document.getElementById('story-viewer').classList.add('active');
    this.renderSlide();
  },

  renderSlide() {
    const story = this._viewerStories[this.currentStoryIdx];
    if (!story) { this.closeViewer(); return; }
    const slide = story.slides[this.currentSlideIdx];
    if (!slide) { this.closeViewer(); return; }

    /* Прогресс бар */
    const prog = document.getElementById('story-progress');
    prog.innerHTML = story.slides.map((_, i) => {
      let cls = 'story-progress-segment';
      if (i < this.currentSlideIdx) cls += ' done';
      else if (i === this.currentSlideIdx) cls += ' active';
      const dur = slide.duration || 5;
      return `<div class="${cls}" style="${i===this.currentSlideIdx?'animation-duration:'+dur+'s':''}"><div class="story-progress-fill"></div></div>`;
    }).join('');

    /* Хедер */
    const u = this._viewerUser || {};
    document.getElementById('story-header').innerHTML = `
      <div class="avatar ${Premium.isActive(u)?'premium':'regular'}">${avatarContent(u)}</div>
      <div><div class="story-header-name">${Utils.esc(u.display_name||'?')} ${Premium.badge(u)}</div>
      <div class="story-header-time">${Utils.timeAgo(story.created_at)}</div></div>`;

    /* Контент */
    const content = document.getElementById('story-content');
    if (slide.media_type === 'video') {
      content.innerHTML = `<video src="${slide.media_url}" autoplay muted playsinline style="max-width:100%;max-height:100%;object-fit:contain;"></video>`;
    } else {
      content.innerHTML = `<img src="${slide.media_url}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;">`;
    }

    /* Таймер автопереключения */
    clearTimeout(this.timer);
    const dur = (slide.duration || 5) * 1000;
    this.timer = setTimeout(() => this.nextSlide(), dur);
  },

  nextSlide() {
    clearTimeout(this.timer);
    const story = this._viewerStories[this.currentStoryIdx];
    if (this.currentSlideIdx < story.slides.length - 1) {
      this.currentSlideIdx++;
      this.renderSlide();
    } else if (this.currentStoryIdx < this._viewerStories.length - 1) {
      this.currentStoryIdx++;
      this.currentSlideIdx = 0;
      this.renderSlide();
    } else {
      this.closeViewer();
    }
  },

  prevSlide() {
    clearTimeout(this.timer);
    if (this.currentSlideIdx > 0) {
      this.currentSlideIdx--;
      this.renderSlide();
    } else if (this.currentStoryIdx > 0) {
      this.currentStoryIdx--;
      this.currentSlideIdx = 0;
      this.renderSlide();
    } else {
      this.renderSlide();
    }
  },

  closeViewer() {
    clearTimeout(this.timer);
    document.getElementById('story-viewer').classList.remove('active');
    document.getElementById('story-content').innerHTML = '';
  },

  /* ===== ЗАГРУЗКА ИСТОРИИ ===== */
  slides: [],

  openUpload() {
    if (!Auth.user || Auth.isGuest) { Utils.toast('Войди в аккаунт', 'error'); return; }
    this.slides = [];
    this.renderUploadModal();
  },

  renderUploadModal() {
    const max = CONFIG.MAX_STORY_SLIDES;
    let slidesHtml = '';
    this.slides.forEach((sl, i) => {
      const url = URL.createObjectURL(sl.blob);
      const preview = sl.type === 'video'
        ? `<video src="${url}" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>`
        : `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
      slidesHtml += `<div class="story-slide-preview">
        <div class="story-slide-number">${i + 1}</div>
        ${preview}
        <button class="story-slide-remove" onclick="Stories.removeSlide(${i})">✕</button>
      </div>`;
    });
    if (this.slides.length < max) {
      slidesHtml += `<div class="story-slide-add" onclick="document.getElementById('story-file-input').click()">
        <div style="font-size:24px;">+</div>
        <div>Добавить</div>
      </div>`;
    }

    App.modal(`<div class="modal-header"><div class="modal-title">📸 Новая история</div><button class="modal-close" onclick="App.closeModal()">${Icons.close()}</button></div>
      <div style="font-size:13px; color:var(--text-sec); margin-bottom:12px;">Максимум ${max} слайда · фото или видео · живут 24 часа</div>
      <input type="file" id="story-file-input" accept="image/*,video/*" multiple style="display:none;" onchange="Stories.pickFiles(this)">
      <div class="story-upload-slides">${slidesHtml}</div>
      <button class="btn btn-primary" style="width:100%; margin-top:16px;" id="story-submit" onclick="Stories.submit()" ${this.slides.length===0?'disabled':''}>
        Опубликовать историю (${this.slides.length}/${max})
      </button>`);
  },

  async pickFiles(input) {
    const files = Array.from(input.files);
    const maxMB = Limits.maxMB(Auth.user);
    for (const file of files) {
      if (this.slides.length >= CONFIG.MAX_STORY_SLIDES) { Utils.toast(`Максимум ${CONFIG.MAX_STORY_SLIDES} слайда`, 'error'); break; }
      if (file.size > maxMB * 1024 * 1024) { Utils.toast(`Файл слишком большой (макс ${maxMB} МБ)`, 'error'); continue; }
      const isVideo = file.type.startsWith('video/');
      let duration = 5;
      if (isVideo) {
        const url = URL.createObjectURL(file);
        const v = document.createElement('video');
        v.preload = 'metadata'; v.src = url;
        await new Promise(r => { v.onloadedmetadata = () => { duration = Math.min(Math.round(v.duration), CONFIG.MAX_VIDEO_SEC); URL.revokeObjectURL(url); r(); }; v.onerror = r; });
      }
      this.slides.push({ blob: file, type: isVideo ? 'video' : 'photo', duration });
    }
    input.value = '';
    this.renderUploadModal();
  },

  removeSlide(idx) {
    this.slides.splice(idx, 1);
    this.renderUploadModal();
  },

  async submit() {
    if (this.slides.length === 0) return;
    const btn = document.getElementById('story-submit');
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
    try {
      const res = await DB.createStory({
        userId: Auth.user.id,
        username: Auth.user.username,
        slides: this.slides
      });
      if (!res.ok) { Utils.toast(res.error, 'error'); btn.disabled = false; btn.textContent = 'Опубликовать'; return; }
      App.closeModal();

  setupAutoplay() { if(this.observer) this.observer.disconnect(); this.observer=new IntersectionObserver(entries=>{entries.forEach(e=>{const v=e.target.querySelector('video'); if(!v) return; if(e.isIntersecting){this.currentCard=e.target;v.play().catch(()=>{});this.setPS(e.target,true);}else{v.pause();v.currentTime=0;}});},{threshold:0.6}); document.querySelectorAll('.video-card').forEach(c=>this.observer.observe(c)); },

const Upload = {
  file:null, duration:0,
  async open() {
    if(!Auth.user||Auth.isGuest){Utils.toast('Войди в аккаунт','error');return;}
    const cu=await Limits.canUpload(Auth.user);
    if(!cu){Utils.toast('Лимит видео исчерпан 😔','error');if(!Premium.isActive(Auth.user)) setTimeout(()=>Premium.open(),600);return;}
    this.file=null; this.duration=0;
    const rem=await Limits.remaining(Auth.user); const lim=Premium.isActive(Auth.user)?CONFIG.PREMIUM_LIMIT:CONFIG.FREE_LIMIT;
    const maxMB=Limits.maxMB(Auth.user);
    const ip=Premium.isActive(Auth.user);
    App.modal(`<div class="modal-header"><div class="modal-title">Загрузить видео</div><button class="modal-close" onclick="App.closeModal()">${Icons.close()}</button></div>
      <div class="limit-badge ${ip?'premium':''}">📤 Осталось: ${rem}/${lim} · Макс ${maxMB} МБ</div>
      <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('file-input').click()"><div class="upload-dropzone-icon">📹</div><div style="font-weight:600; margin-bottom:4px;">Выбери видео</div><div style="font-size:13px; color:var(--text-sec);">До ${CONFIG.MAX_VIDEO_SEC} сек · до ${maxMB} МБ</div><input type="file" id="file-input" accept="video/*" style="display:none;" onchange="Upload.pickFile(this)"></div>
      <div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div>
      <div id="video-preview-wrap" style="display:none; margin-bottom:16px;"><video id="upload-preview" class="upload-preview-video" muted playsinline loop autoplay></video><div style="font-size:12px; color:var(--text-sec); margin-top:6px; text-align:center;" id="duration-label"></div></div>
      <div class="form-group"><label class="form-label">Название *</label><input type="text" class="form-input" id="upload-title" maxlength="100"></div>

      <button class="btn btn-primary" style="width:100%;" id="upload-btn" onclick="Upload.submit()" disabled>Загрузить</button>`);
  },
  pickFile(input) {
    const f=input.files[0]; if(!f) return;
    if(!f.type.startsWith('video/')){Utils.toast('Выбери видеофайл','error');return;}
    const maxMB=Limits.maxMB(Auth.user);
    if(f.size>maxMB*1024*1024){Utils.toast(`Файл больше ${maxMB} МБ`,'error');return;}
    const url=URL.createObjectURL(f); const tv=document.createElement('video'); tv.preload='metadata'; tv.src=url;
    tv.onloadedmetadata=()=>{URL.revokeObjectURL(url);if(tv.duration>CONFIG.MAX_VIDEO_SEC){Utils.toast(`Видео ${Math.round(tv.duration)} сек. Макс ${CONFIG.MAX_VIDEO_SEC}!`,'error');return;}this.file=f;this.duration=tv.duration;document.getElementById('upload-preview').src=URL.createObjectURL(f);document.getElementById('video-preview-wrap').style.display='block';document.getElementById('dropzone').classList.add('has-video');document.getElementById('dropzone').querySelector('.upload-dropzone-icon').textContent='✅';document.getElementById('duration-label').textContent=`⏱ ${Math.round(this.duration)} сек`;document.getElementById('upload-btn').disabled=false;};
  },
  async makeThumbnail(f) { return new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.muted=true;v.src=URL.createObjectURL(f);v.onloadeddata=()=>{v.currentTime=Math.min(1,v.duration/2);};v.onseeked=()=>{const c=document.createElement('canvas');c.width=360;c.height=640;const ctx=c.getContext('2d');const ratio=Math.max(c.width/v.videoWidth,c.height/v.videoHeight);const w=v.videoWidth*ratio,h=v.videoHeight*ratio;ctx.drawImage(v,(c.width-w)/2,(c.height-h)/2,w,h);c.toBlob(b=>{URL.revokeObjectURL(v.src);r(b);},'image/jpeg',0.8);};v.onerror=()=>r(null);}); },
  async submit() {
    const title=document.getElementById('upload-title').value.trim(); const desc=document.getElementById('upload-desc').value.trim();
    if(!this.file||!title){Utils.toast('Заполни название','error');return;}
    const btn=document.getElementById('upload-btn'); btn.disabled=true; btn.innerHTML='<div class="spinner"></div>';
    const prog=document.getElementById('upload-progress'); const bar=document.getElementById('upload-progress-bar'); prog.style.display='block'; bar.style.width='30%';
    try { const thumb=await this.makeThumbnail(this.file); bar.style.width='60%'; const tags=(desc.match(/#([a-zA-Zа-яА-ЯёЁ0-9_]+)/g)||[]).map(t=>t.slice(1)); const res=await DB.uploadVideo({userId:Auth.user.id,username:Auth.user.username,title,description:desc,tags,duration:Math.round(this.duration),videoBlob:this.file,thumbBlob:thumb}); bar.style.width='100%'; if(!res.ok){Utils.toast(res.error,'error');btn.disabled=false;btn.textContent='Загрузить';return;} App.closeModal();Utils.toast('Видео загружено! 🌍','success');App.go('main');Feed.render(); } catch(err){Utils.toast('Ошибка: '+err.message,'error');btn.disabled=false;btn.textContent='Загрузить';}
  }
};

    if(videos&&videos.length){h+='<div style="font-size:13px; font-weight:700; color:var(--text-sec); margin:14px 0 8px;">ВИДЕО</div>';h+=videos.map(v=>`<div class="admin-row" onclick="Feed.jumpTo('${v.id}')" style="cursor:pointer;"><div><div style="font-weight:600; font-size:14px;">${Utils.esc(v.title)}</div><div style="font-size:12px; color:var(--text-sec);">@${Utils.esc(v.username)}</div></div></div>`).join('');}
    if(!h) h='<div class="empty-state"><div class="empty-icon">🤷</div><div class="empty-text">Ничего не найдено</div></div>';
    r.innerHTML=h;
  }
};

const Admin = {
  loginTaps:0, currentTab:'users', authed:false,
  logoTap(){this.loginTaps++;if(this.loginTaps>=5){this.loginTaps=0;this.openLogin();}},
  openLogin(){App.modal(`<div class="modal-header"><div class="modal-title">🔐 Код админа</div><button class="modal-close" onclick="App.closeModal()">${Icons.close()}</button></div><div class="form-group"><input type="password" class="form-input" id="admin-pass"></div><button class="btn btn-primary" style="width:100%;" onclick="Admin.checkPass()">Войти</button>`);},
  checkPass(){if(document.getElementById('admin-pass').value===CONFIG.ADMIN_PASSWORD){this.authed=true;this.openPanel();}else Utils.toast('Неверный код','error');},
  openPanel(){this.currentTab='users';this.renderPanel();},
  switchTab(tab){this.currentTab=tab;this.renderPanel();},
  async renderPanel() {
    let c='';
    if(this.currentTab==='users'){const {data:users}=await sb.from('profiles').select('*');c=users.map(u=>`<div class="admin-row"><div style="display:flex; align-items:center; gap:10px; min-width:0;"><div class="avatar small ${u.banned?'banned':(Premium.isActive(u)?'premium':'regular')}">${avatarContent(u)}</div><div style="min-width:0;"><div style="font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${Utils.esc(u.display_name)} ${u.banned?'🚫':Premium.badge(u)}</div><div style="font-size:12px; color:var(--text-sec);">@${Utils.esc(u.username)}</div></div></div>${u.banned?`<button class="btn btn-secondary btn-small" onclick="Admin.unban('${u.id}')">Разбанить</button>`:`<button class="btn btn-danger btn-small" onclick="Admin.banUser('${u.id}')">🚫 Бан</button>`}</div>`).join('');}
    else if(this.currentTab==='videos'){const {data:videos}=await sb.from('videos').select('*').order('created_at',{ascending:false});c=videos.map(v=>`<div class="admin-row"><div style="min-width:0;"><div style="font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${Utils.esc(v.title)}</div><div style="font-size:12px; color:var(--text-sec);">@${Utils.esc(v.username)}</div></div><button class="btn btn-danger btn-small" onclick="Admin.deleteVideo('${v.id}')">🗑</button></div>`).join('');}
    else if(this.currentTab==='promos'){const promos=await DB.getAllPromos();const active=promos.filter(p=>!p.used);const used=promos.filter(p=>p.used);c=`<button class="btn btn-premium" style="width:100%; margin-bottom:12px;" onclick="Admin.createPromo()">+ Создать</button><div id="new-promo-slot"></div><div class="admin-section-title">Активные (${active.length})</div>${active.map(p=>`<div class="admin-row"><div style="font-family:monospace; font-weight:700;">${p.code}</div><button class="btn btn-secondary btn-small" onclick="Admin.copyPromo('${p.code}')">📋</button></div>`).join('')}<div class="admin-section-title">Использованные (${used.length})</div>${used.map(p=>`<div class="admin-row" style="opacity:0.5;"><div style="font-family:monospace; text-decoration:line-through;">${p.code}</div></div>`).join('')}`;}
    App.modal(`<div class="modal-header"><div class="modal-title">⚙️ Админ</div><button class="modal-close" onclick="App.closeModal()">${Icons.close()}</button></div><div class="admin-tab-bar"><div class="admin-tab ${this.currentTab==='users'?'active':''}" onclick="Admin.switchTab('users')">👥 Юзеры</div><div class="admin-tab ${this.currentTab==='videos'?'active':''}" onclick="Admin.switchTab('videos')">🎬 Видео</div><div class="admin-tab ${this.currentTab==='promos'?'active':''}" onclick="Admin.switchTab('promos')">🎁 Промо</div></div><div style="max-height:60vh; overflow-y:auto;">${c}</div>`);
  },
  async banUser(uid){if(Auth.user?.id===uid){Utils.toast('Нельзя себя!','error');return;}const r=prompt('Причина:')||'Нарушение';await DB.banUser(uid,r);Utils.toast('Забанен 🚫','error');this.renderPanel();},
  async unban(uid){await DB.unbanUser(uid);Utils.toast('Разбанен ✅','success');this.renderPanel();},
  async deleteVideo(vid){if(!confirm('Удалить?')) return;await DB.deleteVideo(vid);Utils.toast('Удалено 🗑','success');this.renderPanel();},
  async createPromo(){const c=await DB.createPromo();document.getElementById('new-promo-slot').innerHTML=`<div class="promo-code-box">${c}</div><button class="btn btn-secondary btn-small" style="width:100%;" onclick="Admin.copyPromo('${c}')">📋 Скопировать</button>`;Utils.toast('Создан! 🎉','premium');},
  copyPromo(c){navigator.clipboard.writeText(c).then(()=>Utils.toast('Скопирован 📋','success'));}
};

const App = {
  current:'welcome', profileBack:'main',
  go(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const s=document.getElementById('screen-'+name);if(s) s.classList.add('active');this.current=name;if(name==='register') setTimeout(()=>Reg.buildPicker(),50);},
  nav(name){if(name==='feed'){this.go('main');this.setNav('feed');Feed.render();}else if(name==='search'){this.go('search');this.setNav('search');document.getElementById('search-input').value='';Search.run();}else if(name==='inbox'){this.go('inbox');this.setNav('inbox');}else if(name==='profile'){if(!Auth.user){Utils.toast('Войди','error');setTimeout(()=>this.go('welcome'),500);return;}this.profileBack='main';this.go('profile');this.setNav('profile');Profile.currentTab='videos';Profile.render();}},
  setNav(name){document.querySelectorAll('.nav-btn[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));},
  viewProfile(uid){this.profileBack=this.current;this.go('profile');Profile.render(uid);},
  backFromProfile(){this.go(this.profileBack==='profile'?'main':this.profileBack);if(this.profileBack==='main') Feed.render();},
  enterGuest(){Auth.user=null;Auth.isGuest=true;Utils.toast('Гостевой режим 👀','success');this.startApp();},
  modal(html){document.getElementById('modals').innerHTML=`<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) App.closeModal()"><div class="modal">${html}</div></div>`;},
  closeModal(){document.getElementById('modals').innerHTML='';},
  showBanScreen(user){this.go('banned');const r=document.getElementById('ban-reason');if(user.ban_reason){r.style.display='block';r.innerHTML=`<b>Причина:</b> ${Utils.esc(user.ban_reason)}`;}else r.style.display='none';},
  startApp(){this.go('main');this.setNav('feed');Feed.render();},
  init(){document.getElementById('welcome-logo').addEventListener('click',()=>Admin.logoTap());document.addEventListener('keydown',(e)=>{if(e.code==='Space'){const t=document.activeElement.tagName;if(t==='INPUT'||t==='TEXTAREA') return;e.preventDefault();Feed.toggleCurrent();}});}
};

(async function(){
  if(!sb){Utils.toast('Ошибка Supabase. Проверь интернет.','error');return;}
  App.init();
  const restored=await Auth.restoreSession();
  if(restored&&Auth.user&&!Auth.user.banned) App.startApp();
  else App.go('welcome');
})();
</script>
