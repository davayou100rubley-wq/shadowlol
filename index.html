        // ================================================================
        // 🔧 УТИЛИТЫ
        // ================================================================
        function compressImage(file, maxWidth, quality) {
            maxWidth = maxWidth || 1080; quality = quality || 0.7;
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var img = new Image();
                    img.onload = function() {
                        var c = document.createElement('canvas');
                        var w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        c.toBlob(function(b) { b ? resolve(b) : reject(new Error('fail')); }, 'image/jpeg', quality);
                    };
                    img.onerror = function() { reject(new Error('img load fail')); };
                    img.src = ev.target.result;
                };
                reader.onerror = function() { reject(new Error('read fail')); };
                reader.readAsDataURL(file);
            });
        }

        function getVideoDuration(file) {
            return new Promise(function(resolve) {
                var v = document.createElement('video');
                v.preload = 'metadata';
                v.onloadedmetadata = function() { URL.revokeObjectURL(v.src); resolve(v.duration); };
                v.onerror = function() { resolve(0); };
                v.src = URL.createObjectURL(file);
            });
        }

        function formatTimeAgo(d) {
            var diff = Date.now() - new Date(d).getTime(), m = Math.floor(diff / 60000);
            if (m < 1) return 'только что'; if (m < 60) return m + ' мин';
            var h = Math.floor(m / 60); if (h < 24) return h + ' ч';
            return Math.floor(h / 24) + ' д';
        }

        function formatCount(n) {
            if (!n) return '0'; if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
            if (n >= 1e3) return (n/1e3).toFixed(1)+'K'; return String(n);
        }


        // ================================================================
        // 🔐 AUTH CONTEXT
        // ================================================================
        var AuthContext = createContext(null);

        function AuthProvider(props) {
            var _u = useState(null), user = _u[0], setUser = _u[1];
            var _p = useState(null), profile = _p[0], setProfile = _p[1];
            var _g = useState(false), isGuest = _g[0], setIsGuest = _g[1];
            var _l = useState(true), loading = _l[0], setLoading = _l[1];

            var loadProfile = useCallback(async function(uid) {
                if (!supabase) return;
                try { var r = await supabase.from('profiles').select('*').eq('id', uid).single(); if (r.data) setProfile(r.data); } catch(e) { console.error(e); }
            }, []);

            useEffect(function() {
                if (!supabase) { setLoading(false); return; }
                supabase.auth.getSession().then(function(res) {
                    var s = res.data ? res.data.session : null;
                    if (s && s.user) { setUser(s.user); loadProfile(s.user.id); }
                    setLoading(false);
                }).catch(function() { setLoading(false); });
                var sub = supabase.auth.onAuthStateChange(function(_, session) {
                    if (session && session.user) { setUser(session.user); loadProfile(session.user.id); }
                    else { setUser(null); setProfile(null); }
                });
                return function() { if (sub.data && sub.data.subscription) sub.data.subscription.unsubscribe(); };
            }, [loadProfile]);

            async function register(email, password, username, avatarFile) {
                if (!supabase) throw new Error('Supabase не подключён');
                var r = await supabase.auth.signUp({ email: email, password: password, options: { data: { username: username } } });
                if (r.error) throw r.error;
                if (avatarFile && r.data && r.data.user) {
                    try {
                        var ext = avatarFile.name.split('.').pop() || 'jpg';
                        var path = r.data.user.id + '/avatar.' + ext;
                        var blob = await compressImage(avatarFile, 400, 0.8);
                        await supabase.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
                        var url = supabase.storage.from('avatars').getPublicUrl(path).data.publicUrl;
                        await supabase.from('profiles').update({ avatar_url: url }).eq('id', r.data.user.id);
                    } catch(e) { console.error('avatar err:', e); }
                }
                if (r.data && r.data.user) await loadProfile(r.data.user.id);
                return r.data;
            }

            async function login(email, password) {
                if (!supabase) throw new Error('Supabase не подключён');
                var r = await supabase.auth.signInWithPassword({ email: email, password: password });
                if (r.error) throw r.error;
                return r.data;
            }

            async function logout() { if (supabase) await supabase.auth.signOut(); setUser(null); setProfile(null); setIsGuest(false); }
            function enterGuest() { setIsGuest(true); setUser(null); setProfile(null); }
            var refreshProfile = useCallback(async function() { if (user) await loadProfile(user.id); }, [user, loadProfile]);

            return <AuthContext.Provider value={{ user, profile, isGuest, loading, register, login, logout, guest: enterGuest, refreshProfile }}>{props.children}</AuthContext.Provider>;
        }

        function useAuth() { return useContext(AuthContext); }


        // ================================================================
        // 🎨 AVATAR
        // ================================================================
        function Avatar(props) {
            var src = props.src, sz = props.size || 40, ip = props.isPremium, sc = props.showCheck !== undefined ? props.showCheck : true, c = props.className || '';

            async function doReg() { setErr(''); setBusy(true); try { await auth.register(email, pw, un, af); } catch(e) { setErr(e.message || 'Ошибка'); } setBusy(false); }
            async function doLogin() { setErr(''); setBusy(true); try { await auth.login(email, pw); } catch(e) { setErr(e.message || 'Неверные данные'); } setBusy(false); }

            if (mode === 'welcome') return (

                    <h2 className="text-2xl font-bold mb-6">{isReg ? 'Создай профиль' : 'Вход'}</h2>
                    {isReg && <div className="flex flex-col items-center mb-6"><div className="relative cursor-pointer" onClick={function(){if(fr.current)fr.current.click();}}>{ap ? <img src={ap} className="w-24 h-24 rounded-full object-cover border-4 border-primary"/> : <div className="w-24 h-24 rounded-full bg-darkCard border-4 border-dashed border-darkBorder flex items-center justify-center"><Icon name="camera" size={32} className="text-slate-500"/></div>}<div className="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full border-2 border-dark"><Icon name="edit" size={12}/></div></div><input ref={fr} type="file" accept="image/*" className="hidden" onChange={onAvatar}/><p className="text-xs text-slate-500 mt-2">Нажми для фото</p></div>}
                    {isReg && <input type="text" placeholder="Имя пользователя" value={un} onChange={function(e){setUn(e.target.value);}} className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-3 outline-none focus:border-primary transition text-white"/>}
                    <input type="email" placeholder="Email" value={email} onChange={function(e){setEmail(e.target.value);}} className="w-full bg-darkCard border border-darkBorder rounded-xl py-3.5 px-4 mb-3 outline-none focus:border-primary transition text-white"/>

        // 🔔 ACTIVITY + 🧭 NAV + 🚀 APP
        // ================================================================
        function ActivityPage() { return <div className="animate-fade-in p-6 text-center mt-20"><Icon name="heart" size={48} className="text-slate-700 mb-4 mx-auto"/><p className="text-slate-500 text-lg font-semibold">Уведомления пусты</p></div>; }

        function BottomNav(props) {
            var active = props.active, setActive = props.setActive, profile = useAuth().profile;
            var tabs = [{id:'home',l:'Главная',i:'home'},{id:'feed',l:'Лента',i:'play'},{id:'create',l:'',i:'plus'},{id:'activity',l:'Активность',i:'heart'},{id:'profile',l:'Профиль',i:'user'}];
            return (<nav className="fixed bottom-0 left-0 right-0 z-40 bg-dark/90 backdrop-blur-xl border-t border-darkBorder safe-area-bottom"><div className="max-w-lg mx-auto flex items-center justify-around h-16">{tabs.map(function(t) { var ia = active===t.id; if (t.id==='create') return <button key={t.id} onClick={function(){setActive('create');}} className="mx-1"><div className="w-12 h-9 bg-primary rounded-lg flex items-center justify-center active:scale-90 transition shadow-lg shadow-primary/40"><Icon name="plus" size={22} className="text-white"/></div></button>; return <button key={t.id} onClick={function(){setActive(t.id);}} className={'flex flex-col items-center gap-0.5 py-1 px-2 transition '+(ia?'text-primary':'text-slate-500')}>{t.id==='profile'&&profile&&profile.avatar_url?<Avatar src={profile.avatar_url} size={24} isPremium={profile.is_premium} showCheck={false}/>:<Icon name={t.i} filled={ia} size={24}/>}<span className="text-[10px] font-medium">{t.l}</span></button>; })}</div></nav>);
        }

        function AppContent() {
            var auth = useAuth(), user = auth.user, isGuest = auth.isGuest, loading = auth.loading;
            var ts = useState('home'), tab = ts[0], setTab = ts[1];
            if (loading) return <div className="h-screen flex items-center justify-center bg-dark"><div className="w-10 h-10 border-2 border-primary border-t-transparent rounded-full spinner"/></div>;
            if (!supabase) return <div className="h-screen flex flex-col items-center justify-center bg-dark p-6 text-center"><Icon name="pulse" size={48} className="text-red-400 mb-4"/><h2 className="text-xl font-bold mb-2">Ошибка подключения</h2><p className="text-slate-400 text-sm">Supabase не загрузился. Проверь интернет и обнови.</p></div>;
            if (!user && !isGuest) return <AuthScreen/>;
            var pages = {home:HomePage, feed:FeedPage, create:CreatePage, activity:ActivityPage, profile:ProfilePage};
            var Page = pages[tab] || HomePage, isFeed = tab==='feed';
            return <div className="min-h-screen bg-dark">{!isFeed&&<Header/>}<main className={(isFeed?'h-screen':'pb-16')+' overflow-y-auto'}><Page/></main><BottomNav active={tab} setActive={setTab}/></div>;
        }

        function App() { return <AuthProvider><AppContent/></AuthProvider>; }

        try { ReactDOM.createRoot(document.getElementById('root')).render(<App/>); }
        catch(e) { document.getElementById('root').innerHTML = '<div style="color:white;padding:40px;text-align:center"><h2>❌ Ошибка</h2><p style="color:#94a3b8;margin-top:10px">'+e.message+'</p></div>'; }
    </script>
</body>
</html>
